title = "mempalace-code Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "mempalace-high-entropy-assignment"
description = "Repository smoke coverage for high-entropy secret assignments"
regex = '''(?i)(?:secret|token|api[_-]?key)\s*[:=]\s*['"]?([A-Za-z0-9_+=/\-]{32,})['"]?'''
secretGroup = 1
entropy = 4.2
keywords = [
  "api_key",
  "apikey",
  "secret",
  "token",
]
tags = [
  "entropy",
  "repo-smoke",
]
