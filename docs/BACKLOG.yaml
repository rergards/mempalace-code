items:
  - key: REL-LINUX-X64-DIARY-SIGSEGV
    summary: "Accept exact native Linux ONNX PCI discovery warning"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, installed-golden, rule-zero]
    description: "## Symptom\n\nExact rc11 SHA 0d95521df61b7f72ef8ff54cfaca8deb617e30ef, Tests run 33482097213, passed package, lint, typecheck, dependency, Gitleaks, MiniLM compatibility, all installer metadata contours, and native ARM installed application. Native x64 job 99773788621 failed at `installed_golden_fetch_model`. Its public annotation reports a successful cached default-model command followed only by the exact bounded ONNX Runtime `GetPciBusId` warning for a synthetic ACPI/MSFT UUID path.\n\n## Steps to reproduce\n\nRead the credential-free annotations for check run 99773788621 at exact SHA 0d95521df61b7f72ef8ff54cfaca8deb617e30ef. The new readiness annotation identifies `installed_golden_fetch_model` and includes the existing rerun command without authenticated logs.\n\n## Current evidence\n\nThe same exact PCI warning is already accepted on successful native Linux ARM by `_classify_installed_golden_diagnostic`; its regex validates ANSI framing, timestamp, ONNX source, fixed sysfs prefix, repeated lowercase UUID, expected-pattern text, terminal newline, and single-warning full match. The classifier currently rejects that exact warning solely when `machine` is x86_64. Native ARM passes; macOS exact-wheel passes all 26 rows. The prior emulated old/current segfault comparison remains diagnostic only and does not justify storage, allocator, dependency, or shutdown changes.\n\n## Scope\n\nExtend the existing diagnostic classifier so the exact bounded PCI warning is accepted after return code 0 on native Linux for supported architectures. Keep the separate unknown-CPU-vendor warning ARM-only. Reuse the existing regex and parameterized focused tests. Add no new classifier, pattern, dependency, workflow, retry, storage hook, allocator override, or task. Preserve fail-closed handling for nonzero exits, non-Linux platforms, unknown architectures, malformed/multiple/extra warnings, and missing framing. Regenerate only the existing scorecard outputs if test counts or lines change.\n\n## Expected vs actual\n\nExpected: a successful native Linux x64 cached-model probe with only the exact known PCI discovery warning continues the installed golden suite. Actual: the ARM-only architecture predicate converts that known warning into `installed_golden_fetch_model` failure.\n\n## Root cause\n\nThe classifier coupled two distinct ONNX diagnostics to one ARM-only architecture condition. The CPU-vendor diagnostic is ARM-specific; the fully bounded PCI path diagnostic also occurs on the supported GitHub x64 runner.\n\n## Acceptance criteria\n\n- Successful native Linux x64 and ARM runs consume exactly one full-match bounded PCI warning and continue the installed golden suite.\n- The CPU-vendor warning remains accepted only on native Linux ARM.\n- Nonzero exits, non-Linux platforms, unknown architectures, malformed casing/framing/path/UUID/pattern text, missing newline, duplicate warnings, and extra stderr remain failures.\n- Existing focused, full non-network, release-readiness, workflow-admission, public-safety, docs-drift, Ruff/format, Pyright, package, installer, direct golden, and Gitleaks gates pass.\n- A fresh immutable exact-SHA candidate passes native x64 installed application, all Python matrix jobs, native ARM, and `release-required`; otherwise its public annotation names the next failed owner without authenticated access.\n- Release gates execute no external AI client and access no user credential.\n\n## Rule Zero\n\n`_classify_installed_golden_diagnostic` is the sole owner. Relaxing only the architecture condition for its existing exact PCI regex has lower total complexity than a new x64 classifier, warning suppression, retry, dependency pin, or runtime workaround. Cheapest falsifier: exact successful Linux x64 PCI noise still fails, or an existing hostile variant passes. Recovery: restore the predicate and rerun the same exact-SHA Tests workflow."
  - key: REL-X64-MINILM-NUMERIC-TOLERANCE
    summary: "Calibrate MiniLM compatibility tolerance across supported CPU runners"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, minilm, rule-zero]
    description: "## Symptom\n\nExact rc9 SHA 3169c32af7c57d8dd6faa5f0559b7475fec4d70d, Tests run 33474182659, x64 job 99749887423 failed maximum_similarity_matrix_delta at 1.5903882855106133e-07 against 1.5800000000000001e-07. Exact rc6 and rc8 passed the same predicate. Five repeated direct measurements on macOS ARM64 and native Ubuntu 24.04 ARM64 are stable at 1.4243506515909665e-07 with identical neighbor order and minimum paired cosine 0.99999999999929745.\n\n## Steps to reproduce\n\nRead the exact public annotation with python scripts/release_public_read.py --check-run-annotations 99749887423 --expect-sha 3169c32af7c57d8dd6faa5f0559b7475fec4d70d. Compare the observed value with benchmarks/minilm_runtime_compatibility_fixture.json.\n\n## Root cause\n\nThe public fixture threshold equals the original provisional measured maximum and has no explicit cross-platform floating-point margin. The hosted miss is 1.03882855106132e-09, about 0.66 percent of the threshold, with no evidence of a model, vector shape, normalization, or ranking change.\n\n## Scope\n\nUpdate only the existing compatibility fixture tolerance to a simple bound that includes the observed supported-runner envelope while remaining orders of magnitude below a material cosine change. Reuse the existing fixture loader, predicate, annotation, tests, and hosted x64 gate. Add no retry, alternate baseline, code path, workflow, cache behavior, runtime dependency, or new gate.\n\n## Acceptance criteria\n\n- The fixture tolerance admits the observed 1.5903882855106133e-07 x64 result with explicit bounded margin.\n- Existing fixture-schema/hash, compatibility, benchmark, public-reader, release-gate, docs-drift, public-safety, lint/format, full non-network, and exact installed-wheel checks remain green.\n- A fresh immutable exact-SHA hosted candidate passes MiniLM compatibility, the complete x64 and ARM installed-application jobs, all Python matrix jobs, and release-required.\n- Neighbor order remains identical and minimum paired cosine remains within the existing bound.\n\n## Rule Zero\n\nThe fixture is the sole owner. A one-value calibration has lower total complexity than retries, architecture-specific thresholds, or runtime changes. Cheapest falsifier: the next exact x64 candidate changes neighbor order, violates paired cosine, or exceeds the calibrated bound. Recovery: restore the fixture value and inspect the exact public annotation.\n\n## Hosted matrix follow-up — rc12\n\nExact rc12 SHA 6f95ebac42dca202e8330cb1d581d5f819a27fae passed native x64 and ARM installed-application jobs, MiniLM compatibility, package, lint, typecheck, dependency, and Gitleaks gates. All four Python matrix jobs failed only because 11 local-output tests in tests/test_code_retrieval_bench.py inherited GITHUB_ACTIONS=true after commit 41ae24c2 added the intended hosted failure annotation. Authenticated read-only job logs showed the identical assertion on Python 3.11–3.14: local tests expected empty stdout while the hosted annotation was correctly emitted.\n\nThe pytest command and workflow are unchanged from the last public-green SHA. A clean native Linux ARM64 full suite passed 4,476 tests. The smallest residual fix declares local mode at its existing test owner: remove ambient GITHUB_ACTIONS in test_runtime_predicate_cli_diagnostics_are_stable_and_bounded and from the copied environment in _run_compatibility_script. Dedicated hosted tests continue to set GITHUB_ACTIONS=true explicitly. No product, benchmark, workflow, dependency, gate, or annotation change is required.\n\nCheapest falsifier: GITHUB_ACTIONS=true python -m pytest tests/test_code_retrieval_bench.py -q -m 'not needs_network' must pass all 64 tests while the dedicated hosted annotation assertions remain green. Hosted closure still requires a fresh immutable candidate with Python 3.11–3.14 and release-required green. Recovery: restore the two test-environment removals and inspect the exact failing pytest node IDs before changing production behavior."
  - key: SEC-GITLEAKS-HISTORY-GATE
    summary: "Restore compact Gitleaks assurance guarantees"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, security, gitleaks, rule-zero]
    description: "## Symptom\n\nThe native changed-range and full-history scans remained intact after simplification, while machine-checked suppression rationale and the real-binary detector/redaction fixture were removed. That left two current release-assurance predicates unproved.\n\n## Steps to reproduce\n\nAt task opening, python scripts/gitleaks_scan.py validate-baseline and python scripts/gitleaks_scan.py fixture-smoke were absent, and an unreviewed exact-looking .gitleaksignore line passed the only generic uniqueness check. The compact local implementation now makes both commands executable; temporary-root tests reproduce malformed suppression and incomplete SARIF failures without changing repository policy.\n\n## Current status\n\nThe compact same-owner implementation is present locally and this release blocker remains open for parent qualification. scripts/gitleaks_scan.py now exposes validate-baseline and fixture-smoke; every scan validates suppression policy before invoking Gitleaks. The installed real binary has locally proved all five required classes with redacted disposable SARIF.\n\n## Scope\n\nKeep the existing native launcher, .gitleaksignore, tests, canonical gate inventory, quality scorecard, verify instructions, and the Gitleaks jobs in ci.yml, gitleaks-history.yml, and publish.yml as the only owners. Each exact fingerprint has strict adjacent JSON metadata with owner, rationale, and review_condition or nonexpired expiry. No current fingerprint value changes. fixture-smoke runs after the pinned installer and before the repository scan in all three workflows. validate-baseline stays an explicit manual command and is not duplicated as a workflow step. Imported Gitleaks config sources are forbidden.\n\n## Acceptance criteria\n\n- Orphan, incomplete, duplicate, expired, malformed, globbed, regex/broad, rule-disabled, imported, allowlisted, or ungoverned suppression input fails before a repository scan.\n- The parser and tests support any number of future reviewed exact fingerprints without literal fingerprint or count assertions.\n- Gitleaks exit 1 is fixture success only when bounded redacted SARIF proves PyPI token, GitHub token, AWS access key, private key, and mempalace-high-entropy-assignment filename/rule pairs.\n- Fixture source, worktree, and report live in a TemporaryDirectory outside the checkout and Gitleaks upload paths, are removed on success or failure, and never place complete generated values in retained SARIF, logs, or tracked source.\n- Exact ref validation, shallow-history rejection, changed-range and full-history behavior, pinned installation, redaction, SARIF uploads, bounded output, canonical command ownership, and all release gates remain intact.\n- Focused tests, real validate-baseline, real fixture-smoke, safe reachable changed-range, Actionlint, focused Ruff, gate inventory, scorecard freshness, working-tree Gitleaks, and public safety pass locally. Parent qualification owns full history, the full non-network suite, and hosted workflow evidence.\n\n## Rule Zero\n\nExtending the existing scanner, ignore, workflow, gate-inventory, and scorecard owners has the lowest total complexity and removal cost. Restoring the old wrapper, security/gitleaks-baseline.yml, PyYAML, release_direct_application_gate.py, workflow_security_gate.py, or deleted release machinery would recreate parallel owners and is forbidden. Cheapest falsifiers are an unreviewed temporary fingerprint rejected before _run, an imported config or allowlist rejected before scan, a missing or unredacted fixture SARIF class rejected after exit 1, and canonical installer-before-fixture-before-scan assertions.\n\n## Remaining closure evidence\n\nRun parent qualification and hosted workflows against the exact candidate SHA. Pinned detector rule-id drift fails closed by design; recover by reviewing the Gitleaks pin and expected filename/rule mapping, then update the mapping only when the maintained detector identity changed. Never weaken detection to make drift pass. Record the local Gitleaks version separately when it differs from tools/gitleaks/go.mod. Keep this item open until that evidence is complete."
