items:
  - key: REL-LINUX-X64-DIARY-SIGSEGV
    summary: "Expose native x64 golden failure and qualify fix"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, installed-golden, rule-zero]
    description: "## Symptom\n\nExact rc10 SHA ffff7fa1778d82cd9a33d57960f69c5a73236701, Tests run 33477621553, passed MiniLM compatibility, all four installer metadata contours, package, lint, typecheck, dependency upgrade, Gitleaks, and native ARM installed application. The native x64 installed application job 99760089353 failed only in `Run full golden CLI suite through the exact installed wheel`. Native x64 Python 3.11-3.14 jobs 99760089647, 99760089570, 99760089575, and 99760089616 each ran the full pytest step for roughly five to nine minutes and exited 1.\n\n## Steps to reproduce\n\nRead the credential-free public job metadata for run 33477621553. The x64 golden failure annotation and all four pytest annotations contain only `Process completed with exit code 1`; no failed golden row or recovery is exposed. The same exact wheel golden suite passes completely on macOS ARM64, and native Ubuntu ARM64 passes the installed application job. Emulated Linux x86_64 is diagnostic only: last hosted-green and current source both segfault under the same QEMU environment.\n\n## Current evidence\n\nThe MiniLM tolerance calibration is successful and unrelated to this remaining failure. The unchanged wake-up test and identical old/current emulated result do not support a post-release source regression. The native failure is x64-specific and occurs after successful setup. Public credential-free evidence cannot identify the first failed installed-golden row, while authenticated logs are outside the release credential boundary.\n\n## Scope\n\nExtend the existing `scripts/release_readiness_gate.py` result owner so a failed installed-golden execution on GitHub Actions emits one bounded, sanitized annotation naming the first existing failed row, its detail, and recovery command. Reuse `_make_row`, the existing JSON result, the existing x64 workflow step, and focused release-readiness/workflow tests. Add no new gate, workflow job, artifact format, log service, credential path, AI client, pytest wrapper, retry, storage hook, allocator override, or dependency change. After the native annotation selects the failure, implement only the smallest existing-owner repair it proves.\n\n## Expected vs actual\n\nExpected: a failed exact-wheel golden run exposes current status, one named failed predicate, and one recovery command through the public check annotation. Actual: the public annotation exposes only exit code 1, so a degraded operator or LLM cannot distinguish product failure, dependency teardown, or runner behavior without forbidden authenticated logs.\n\n## Root cause hypothesis\n\nThe product root cause remains unknown. The immediate diagnostic defect is confirmed: `release_readiness_gate.py` returns structured failed rows, but the hosted step does not surface one through the public check annotation. Fixing that observability boundary is the cheapest decisive action and does not weaken release admission.\n\n## Acceptance criteria\n\n- On GitHub Actions, a failed installed-golden result emits exactly one bounded sanitized annotation containing the first failed row id, detail, and existing recovery command; local output and exit status remain unchanged.\n- Malformed, newline-containing, path-containing, credential-shaped, duplicate-failure, empty-row, and success results cannot leak unsafe content or emit ambiguous annotations.\n- Existing release-readiness, workflow-admission, public-safety, docs-drift, Ruff/format, Pyright, full non-network, package, installer, direct golden, and Gitleaks gates pass.\n- A fresh immutable exact-SHA candidate either passes native x64 or exposes the named native failure without authenticated access. Any subsequent repair is limited to the owner selected by that evidence.\n- Release gates execute no external AI client and access no user credential.\n\n## Rule Zero\n\nThe existing readiness result and x64 workflow step are the sole owners. One fail-only sanitized annotation has lower total complexity than a new diagnostic job, artifact, public reader mode, or test wrapper. Cheapest falsifier: a deliberately failed readiness result on `GITHUB_ACTIONS=1` produces anything other than one bounded redacted annotation with the first failed row and recovery; recovery: rerun the same exact-SHA Tests workflow and read its public annotation."
  - key: REL-X64-MINILM-NUMERIC-TOLERANCE
    summary: "Calibrate MiniLM compatibility tolerance across supported CPU runners"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, minilm, rule-zero]
    description: "## Symptom\n\nExact rc9 SHA 3169c32af7c57d8dd6faa5f0559b7475fec4d70d, Tests run 33474182659, x64 job 99749887423 failed maximum_similarity_matrix_delta at 1.5903882855106133e-07 against 1.5800000000000001e-07. Exact rc6 and rc8 passed the same predicate. Five repeated direct measurements on macOS ARM64 and native Ubuntu 24.04 ARM64 are stable at 1.4243506515909665e-07 with identical neighbor order and minimum paired cosine 0.99999999999929745.\n\n## Steps to reproduce\n\nRead the exact public annotation with python scripts/release_public_read.py --check-run-annotations 99749887423 --expect-sha 3169c32af7c57d8dd6faa5f0559b7475fec4d70d. Compare the observed value with benchmarks/minilm_runtime_compatibility_fixture.json.\n\n## Root cause\n\nThe public fixture threshold equals the original provisional measured maximum and has no explicit cross-platform floating-point margin. The hosted miss is 1.03882855106132e-09, about 0.66 percent of the threshold, with no evidence of a model, vector shape, normalization, or ranking change.\n\n## Scope\n\nUpdate only the existing compatibility fixture tolerance to a simple bound that includes the observed supported-runner envelope while remaining orders of magnitude below a material cosine change. Reuse the existing fixture loader, predicate, annotation, tests, and hosted x64 gate. Add no retry, alternate baseline, code path, workflow, cache behavior, runtime dependency, or new gate.\n\n## Acceptance criteria\n\n- The fixture tolerance admits the observed 1.5903882855106133e-07 x64 result with explicit bounded margin.\n- Existing fixture-schema/hash, compatibility, benchmark, public-reader, release-gate, docs-drift, public-safety, lint/format, full non-network, and exact installed-wheel checks remain green.\n- A fresh immutable exact-SHA hosted candidate passes MiniLM compatibility, the complete x64 and ARM installed-application jobs, all Python matrix jobs, and release-required.\n- Neighbor order remains identical and minimum paired cosine remains within the existing bound.\n\n## Rule Zero\n\nThe fixture is the sole owner. A one-value calibration has lower total complexity than retries, architecture-specific thresholds, or runtime changes. Cheapest falsifier: the next exact x64 candidate changes neighbor order, violates paired cosine, or exceeds the calibrated bound. Recovery: restore the fixture value and inspect the exact public annotation."
  - key: SEC-GITLEAKS-HISTORY-GATE
    summary: "Restore compact Gitleaks assurance guarantees"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, security, gitleaks, rule-zero]
    description: "## Symptom\n\nThe native changed-range and full-history scans remained intact after simplification, while machine-checked suppression rationale and the real-binary detector/redaction fixture were removed. That left two current release-assurance predicates unproved.\n\n## Steps to reproduce\n\nAt task opening, python scripts/gitleaks_scan.py validate-baseline and python scripts/gitleaks_scan.py fixture-smoke were absent, and an unreviewed exact-looking .gitleaksignore line passed the only generic uniqueness check. The compact local implementation now makes both commands executable; temporary-root tests reproduce malformed suppression and incomplete SARIF failures without changing repository policy.\n\n## Current status\n\nThe compact same-owner implementation is present locally and this release blocker remains open for parent qualification. scripts/gitleaks_scan.py now exposes validate-baseline and fixture-smoke; every scan validates suppression policy before invoking Gitleaks. The installed real binary has locally proved all five required classes with redacted disposable SARIF.\n\n## Scope\n\nKeep the existing native launcher, .gitleaksignore, tests, canonical gate inventory, quality scorecard, verify instructions, and the Gitleaks jobs in ci.yml, gitleaks-history.yml, and publish.yml as the only owners. Each exact fingerprint has strict adjacent JSON metadata with owner, rationale, and review_condition or nonexpired expiry. No current fingerprint value changes. fixture-smoke runs after the pinned installer and before the repository scan in all three workflows. validate-baseline stays an explicit manual command and is not duplicated as a workflow step. Imported Gitleaks config sources are forbidden.\n\n## Acceptance criteria\n\n- Orphan, incomplete, duplicate, expired, malformed, globbed, regex/broad, rule-disabled, imported, allowlisted, or ungoverned suppression input fails before a repository scan.\n- The parser and tests support any number of future reviewed exact fingerprints without literal fingerprint or count assertions.\n- Gitleaks exit 1 is fixture success only when bounded redacted SARIF proves PyPI token, GitHub token, AWS access key, private key, and mempalace-high-entropy-assignment filename/rule pairs.\n- Fixture source, worktree, and report live in a TemporaryDirectory outside the checkout and Gitleaks upload paths, are removed on success or failure, and never place complete generated values in retained SARIF, logs, or tracked source.\n- Exact ref validation, shallow-history rejection, changed-range and full-history behavior, pinned installation, redaction, SARIF uploads, bounded output, canonical command ownership, and all release gates remain intact.\n- Focused tests, real validate-baseline, real fixture-smoke, safe reachable changed-range, Actionlint, focused Ruff, gate inventory, scorecard freshness, working-tree Gitleaks, and public safety pass locally. Parent qualification owns full history, the full non-network suite, and hosted workflow evidence.\n\n## Rule Zero\n\nExtending the existing scanner, ignore, workflow, gate-inventory, and scorecard owners has the lowest total complexity and removal cost. Restoring the old wrapper, security/gitleaks-baseline.yml, PyYAML, release_direct_application_gate.py, workflow_security_gate.py, or deleted release machinery would recreate parallel owners and is forbidden. Cheapest falsifiers are an unreviewed temporary fingerprint rejected before _run, an imported config or allowlist rejected before scan, a missing or unredacted fixture SARIF class rejected after exit 1, and canonical installer-before-fixture-before-scan assertions.\n\n## Remaining closure evidence\n\nRun parent qualification and hosted workflows against the exact candidate SHA. Pinned detector rule-id drift fails closed by design; recover by reviewing the Gitleaks pin and expected filename/rule mapping, then update the mapping only when the maintained detector identity changed. Never weaken detection to make drift pass. Record the local Gitleaks version separately when it differs from tools/gitleaks/go.mod. Keep this item open until that evidence is complete."
