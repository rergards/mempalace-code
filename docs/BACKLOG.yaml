items:
  - key: RELEASE-DIRECT-INSTALLED-APP-GATE
    summary: "Make direct exact-wheel application exercise the installed release gate"
    type: task
    status: open
    priority: highest
    size: L
    section_id: pre_release
    description: "## Goal\n\nRequire the existing release-readiness owner to execute the exact candidate wheel as installed applications and fail closed on any declared public surface without direct evidence.\n\n## Completed evidence\n\n- The installed-golden owner runs 26 ordered direct exact-wheel rows without pytest or test-module execution.\n- Installed argparse discovery reconciles 43 CLI command and mode members to direct candidate-console execution.\n- All five MCP profiles and 29 installed tools have direct semantic JSON-RPC evidence, palace-local post-state, and protected-root isolation.\n- Canonical venv, bootstrap-venv, pipx, and uv-tool contours install the exact wheel and prove metadata, import provenance, CLI version, alias, Agent Plugin, ordinary LanceDB runtime, recovery refusals, network denial, and disposable cleanup.\n\n## Scope\n\nReuse scripts/release_readiness_gate.py, scripts/release_install_metadata_smoke.py, their provenance/isolation/subprocess/result owners, and the existing hosted release workflow. Complete one independently testable residual at a time. Do not add a second runner, gate row, catalog, service, durable state owner, dependency unrelated to the declared extras, AI-client call, credential access, publication, tag, push, or remote mutation.\n\n## Acceptance criteria\n\n- AC-1: Install and directly exercise each declared optional extra and the public installed import surface through the existing installer-smoke owner. The smallest valid behavior or intended refusal must prove each extra; import success alone is insufficient where a public behavior exists.\n- AC-2: On a supported Linux user session, run the exact installed candidate through confirmed systemd-user scheduler install, status, and removal plus safe update-apply behavior. Record semantic post-state and cleanup. Unavailable systemd-user support must emit blocking UNRUN.\n\n## Continuation\n\nOptional extras and public installed imports are next. The Linux systemd-user contour follows after that residual is independently qualified and archived."
    assignee: locked
  - key: RELEASE-DIRECT-INSTALLED-LINUX-SYSTEMD
    summary: "Qualify exact-wheel Linux systemd-user update lifecycle"
    type: task
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Scope\n\nCurrent status: the updater ownership checks, exact-wheel staging, disposable-user systemd contour, lifecycle smoke, credential boundary, process-group TERM/KILL escalation, and focused security regressions are already implemented and remain unchanged. Exact SHA 143a0a4dff5cab41f6edbc752bd84ce18dedb1cf passed the macOS offline suite (4,263 passed, 2 skipped, 2 deselected), focused candidate suite (409 passed), three independent reviews, and fresh Ubuntu Python 3.12 CLI/golden qualification. The fresh Ubuntu full suite reached 2,529 passing tests before one existing teardown postcondition failed.\n\n## Exact residual\n\nThe existing _settle_owned_process_group helper can return settled=True after the direct parent is reaped but about 10 ms before the exact owned process group disappears. The focused regression is flaky for the same reason on both the current candidate (2/10 pass) and base dd42791107f4aba49bc6ff94698b915eb0328a3b (3/10 pass). Twenty timing samples showed every group disappeared, 17 after about 10.1 ms and three immediately.\n\nExtend the existing helper so a true settled result confirms the exact admitted group is absent before return, within the current bounded teardown budget. Reuse _owned_process_group_matches, _settle_owned_process_group, _default_run_subprocess, and test_default_subprocess_pipe_retention_is_bounded_and_reaped.\n\n## Allowed implementation paths\n\n- scripts/release_install_metadata_smoke.py\n- tests/test_release_install_metadata_smoke.py\n- docs/quality/scorecard.md and docs/quality/scorecard.json only when the existing deterministic generator requires regeneration\n\n## Exclusions\n\nDo not change the updater, scheduler, workflow, job topology, release row set, subprocess timeout values, signal escalation policy, CLI/product behavior, dependency bounds, public docs, or release credentials boundary. Do not add a supervisor, subreaper, service, process owner, helper family, retry, polling dependency, sleep-away test, timeout increase, new gate, AI-client invocation, credential access, push, tag, publication, or remote mutation. Operational qualification uses the existing Linux and hosted contours unchanged.\n\n## Acceptance criteria\n\n- A settled=True result means the exact owned process group is absent before return; inability to confirm remains settled=False and preserves the existing fail-closed recovery diagnostic.\n- Preserve exact ownership revalidation, start_new_session, TERM then KILL escalation, current bounded teardown budgets, stdout/stderr/status semantics, sanitization, and non-POSIX behavior.\n- The focused process-group regression passes 20 consecutive times on fresh Linux Python 3.12 without weakening its immediate post-return assertion.\n- The complete fresh Linux Python 3.12 offline suite passes at the exact corrected SHA.\n- Ruff, format, both Pyright gates, scorecard, public-safety, changed-range secret scan, and independent correctness, security, and Rule Zero reviews pass.\n- After the code residual is green, the unchanged public installed-application job must finish with all four exact-wheel installer receipts, linux_systemd_update_lifecycle=pass, and complete disposable-user/staging cleanup before this task closes. Missing hosted lifecycle evidence remains blocking UNRUN.\n\n## Falsifier and recovery\n\nCheapest falsifier: run python -m pytest tests/test_release_install_metadata_smoke.py::test_default_subprocess_pipe_retention_is_bounded_and_reaped -q -x twenty times on Linux; any exact group visible immediately after helper return rejects the change. Recovery: run that single command once, retain the task open, and do not push, tag, or publish."
    links:
      - type: subtask-of
        key: RELEASE-DIRECT-INSTALLED-APP-GATE
  - key: REL-SCHEDULE-SNIPPET-LINUX-MARKER
    summary: "Accept Linux cron evidence in installed schedule-snippet qualification"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nThe exact candidate hosted suite fails `test_installed_schedule_snippets_bind_to_invoked_launcher` on every supported Linux/Python job even though the invoked source console exits zero and renders the expected deterministic cron re-render and install guidance.\n\n## Steps to reproduce\n\nRun `python -m pytest tests/test_cli_golden_scenarios.py::test_installed_schedule_snippets_bind_to_invoked_launcher -q` on Linux. The release qualifier requires macOS `com.mempalace.*.plist` names in stderr for both platforms and rejects the valid cron output.\n\n## Scope\n\nCorrect only the existing installed schedule-snippet qualification in `scripts/release_readiness_gate.py` and its focused tests. Reuse the existing backup/watch renderers, invoked-launcher binding, quoting, determinism, mutation boundary, install refusal, sanitization, and recovery command. Do not add a scheduler renderer, platform abstraction, release row, workflow job, or user-facing behavior.\n\n## Expected vs actual\n\nExpected: Linux qualification requires the existing cron-specific install marker while Darwin qualification requires the existing plist name. Actual: both platforms require the Darwin plist name.\n\n## Root cause hypothesis\n\nThe qualifier stores one unconditional plist marker per case instead of selecting the existing platform-specific scheduler evidence.\n\n## Acceptance criteria\n\n- The focused source-console scenario passes on Linux only when backup and watch output retain the exact invoked launcher, target quoting, deterministic output, cron install guidance, clean stderr/stdout bounds, refusal behavior, unchanged state, and cleanup.\n- Darwin still requires the exact `com.mempalace.backup.plist` and `com.mempalace.watch.plist` evidence.\n- Removing either platform marker or substituting the ambient launcher makes the focused test fail closed.\n- Focused tests, Ruff, scorecard generation/check, public safety, and the hosted Python matrix pass. Recovery: revert only the platform-marker qualification hunk."
  - key: REL-PY314-HOSTED-MATRIX-FAILURE
    summary: "Resolve fresh Linux CLI shutdown race and golden environment leak"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nExact public candidate `dd42791107f4aba49bc6ff94698b915eb0328a3b`, Tests run `33202518999`, passed Python 3.11, 3.13, and 3.14 but failed Python 3.12 and installed-application qualification. A fresh unlocked Ubuntu Python 3.12 source golden run prints correct CLI output and intermittently exits with SIGSEGV during interpreter shutdown. The same environment also creates `.nv/ComputeCache` inside the disposable HOME unless CUDA compilation caching is disabled.\n\n## Steps to reproduce\n\nInstall the exact candidate in a clean Linux Python 3.12 environment with unlocked dependencies, then run `python -m pytest tests/test_cli_golden_scenarios.py -q -x`. For the shutdown falsifier, prepare the rollback no-candidate fixture and repeat its real `python -m mempalace_code.cli --palace PALACE repair --rollback --dry-run` subprocess up to 30 times with `PYTHONFAULTHANDLER=1`. For the environment leak, run the non-regular source scenario with and without `CUDA_CACHE_DISABLE=1` and compare the disposable HOME snapshot.\n\n## Reproduction evidence\n\nThe fatal process reports no Python frame and Linux kernel evidence identifies a `lancedb-tokio-worker` crash at CPython `context_tp_dealloc`. Import-only processes passed, while `lancedb.connect(...)` alone reproduced the shutdown SIGSEGV. The fresh resolver pair LanceDB 0.37.1 plus PyArrow 25.0.1 failed on repetition 7; LanceDB 0.33.0 plus PyArrow 24.0.0 failed on repetition 8. LanceDB 0.36.0 also crashed. Explicit background-loop stop plus join still failed on repetition 2. Explicitly releasing the connection and running `gc.collect()` before interpreter finalization passed 50 of 50 minimal runs; the real CLI followed by one collection passed 100 of 100 on both tested dependency pairs. Dependency caps are therefore rejected. Separately, the non-regular scenario failed only because `.nv/ComputeCache` appeared under disposable HOME; `CUDA_CACHE_DISABLE=1` produced an exact PASS with no leaked path.\n\n## Scope\n\nOutcome: every one-shot MemPalace CLI process exits cleanly after LanceDB use, and release qualification leaves its disposable HOME unchanged. Existing behavior owners are `mempalace_code/cli.py` for CLI lifetime and the existing environment builders in `tests/test_cli_golden_scenarios.py` and `scripts/release_readiness_gate.py` for qualification isolation. DRY: extend those owners. KISS: collect unreachable handles at the one-shot CLI boundary and set the one proven cache-disable variable in both existing builders. YAGNI: no dependency pin, private LanceDB runtime reset, new gate, helper module, retry, sleep, timeout increase, skip, reorder, or ignored leaked path. Duplicates/Garbage: one CLI-lifecycle implementation and the two required producer envs only; remove no still-used path. Drunk-user/LLM: preserve command output, exit meanings, reusable in-process imports, and one recovery command. Cheapest falsifier: the control repeat must still reproduce on the unmodified candidate and the corrected exact wheel must complete 100 repetitions without SIGSEGV or `.nv` artifacts.\n\n## Expected vs actual\n\nExpected: successful CLI commands return their documented exit status, failure commands preserve their documented nonzero status, and release scenarios leave only declared disposable artifacts. Actual: otherwise correct commands intermittently return 139 during native teardown, while CUDA creates an undeclared cache directory.\n\n## Acceptance criteria\n\n- The existing one-shot CLI entry boundary releases unreachable LanceDB/native handles before CPython finalization on normal return and `SystemExit`, without stopping or resetting private LanceDB runtimes and without changing documented stdout, stderr, or exit status.\n- Direct reusable in-process CLI imports remain usable; no global event loop is stopped and no process-wide behavior is added outside the one-shot command boundary.\n- Both existing golden environment builders set `CUDA_CACHE_DISABLE=1`; the non-regular scenario proves `.nv/ComputeCache` is absent instead of ignoring it.\n- On fresh Linux Python 3.12 with the unlocked resolver, the rollback no-candidate real CLI contour passes 100 consecutive processes, the complete golden-scenario file passes twice consecutively, and the complete offline suite passes.\n- Fresh Linux Python 3.14 source qualification and exact-wheel installed qualification pass without weakening supported-version, output, mutation, cleanup, or credential boundaries.\n- Ruff, format, both Pyright gates, scorecard, public-safety, dependency/security checks, release-readiness, and every supported hosted Python/installed-application job pass on the exact candidate SHA.\n- Recovery: run `python -m pytest tests/test_cli_golden_scenarios.py -q -x`; any SIGSEGV, leaked `.nv` path, stderr pollution, or order-dependent failure blocks the release."
  - key: STORAGE-CREATE-FALSE-NONMUTATING
    summary: "Make create=False storage opens fail without filesystem mutation"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nA clean root Linux Python 3.14 full-suite run on candidate ec067163688bd404d0244995e6ca8feeaca34f83 failed tests/test_searcher.py::TestSearchMemories::test_no_palace_returns_error. A direct writable-temp falsifier proved that search_memories on a missing palace creates the path and returns a false-success empty result.\n\n## Steps to reproduce\n\nCreate a writable temporary directory, choose a missing nested palace path, call search_memories(\"anything\", path), and inspect both the result and path existence. Current behavior changes path existence from false to true and returns results=[] without an error.\n\n## Scope\n\nRepair the existing storage factory contract. open_store(create=False) must not create the palace or Lance directory and must fail before lancedb.connect when the canonical Lance table directory lance/mempalace_drawers.lance is absent. Preserve create=True creation, existing-palace writable migration, read_only behavior, Chroma migration refusal, and current public error/recovery payloads. Reuse existing storage and search tests; do not add a second factory or search-specific storage probe. The implementation plan must include the existing mixed-marker owner tests/test_storage_lance.py because its stale empty-Lance success expectation is superseded by this contract.\n\n## Expected vs actual\n\nExpected: missing writable palace returns the existing No palace found error and leaves the filesystem unchanged. Actual: open_store creates the path despite create=False, then search returns a misleading successful empty result.\n\n## Failed attempt evidence\n\nThe first implementation checked only whether palace/lance was a directory. A direct empty-Lance falsifier created palace/lance without lance/mempalace_drawers.lance; open_store(create=False) still called lancedb.connect, wrote Lance manifest/transaction metadata, and returned a LanceStore with _table=None. The guard must use the existing _LANCE_TABLE owner and reject this contour before connect. Update the stale mixed Lance/Chroma marker regression in tests/test_storage_lance.py so an empty Lance marker is not treated as a valid writable store; keep Chroma refusal and valid mixed-palace behavior covered. A later plan omitted this required owning path while implementation changed it; the next plan must name the path before implementation.\n\n## Acceptance criteria\n\n- Add a writable tmp-path regression proving search_memories returns the existing error and creates no filesystem path.\n- Add or extend storage-factory regressions proving create=False refuses missing palace, empty palace, and empty Lance directory before directory creation or lancedb.connect, while existing writable stores still open and migrate as before.\n- Focused storage/search regressions, full offline suite on macOS and clean Linux Python 3.14, both Pyright contours, Ruff, scorecard, public-safety, and release-readiness artifact/installed surfaces pass.\n- Do not change CLI/MCP error wording, add flags, weaken read-only behavior, or invoke AI clients/credentials. Symlink policy is not changed by this task.\n- Recovery: remove the disposable temp root and rerun the writable missing-path and empty-Lance falsifiers; no new path or Lance metadata may appear.\n\n## Full-suite contract correction\n\nAfter the table-level fix, the macOS full suite reached tests/test_e2e.py::test_mcp_session_lifecycle and exposed one stale pre-init assertion: it expected tool_search on a missing palace to return a results key. The accepted public contract now returns the existing No palace found error and hint without creating storage. Update only that existing tests/test_e2e.py assertion and comment; preserve add, found-search, delete, and gone-search steps. The next implementation plan must name tests/test_e2e.py. Cheapest falsifier: the focused lifecycle test passes with the exact error payload, then the full offline suite continues past this point.\n"
