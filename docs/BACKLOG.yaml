items:
  - key: REL-LINUX-ARM-TORCH-CUDA-RESOLVER
    summary: "Harden FastEmbed provenance and complete native ARM qualification"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nThe default FastEmbed migration is already landed. Independent security review found one remaining write-path defect: `_write_canonical_provenance()` follows a hostile pre-existing `.mempalace-model.tmp` symlink and can overwrite an external file before atomic replacement. Native ARM qualification also still needs one complete exact-wheel receipt after the already-landed narrow ONNX diagnostic classifier.\n\n## Steps to reproduce\n\nCreate a canonical disposable cache with valid model revision and tokenizer evidence. Point `.mempalace-model.tmp` at a disposable external file, invoke `_write_canonical_provenance()`, and compare the external bytes. Current code follows the symlink. For the remaining release receipt, run the exact 1.13.5 wheel through the existing Ubuntu 24 aarch64 Python 3.12 installed-application contour; require the four installer paths, systemd-user lifecycle, and all 26 installed-golden rows.\n\n## Scope\n\nThe FastEmbed/ONNX default-runtime migration, optional custom-model boundary, compatibility fixture, dependency evidence, release-gate integration, Linux ARM diagnostic classifier, and public documentation are completion evidence, not implementation scope. Do not rewrite or regenerate those owners.\n\nExtend only `mempalace_code/storage.py::_write_canonical_provenance()` and its existing owner `tests/test_embedding_runtime.py`. Create the provenance temporary exclusively without following an existing symlink. Before atomic replace, require that the temporary remains an owned regular file inside the resolved canonical cache root. Add the exact hostile-symlink regression with byte-identical external content and no accepted provenance.\n\nKeep one provenance writer and the current cache/recovery contract. Add no helper module, cache mode, dependency, workflow, release gate, task, migration, or documentation surface. The already-landed exact Linux ARM ONNX warning classifier remains unchanged unless the native run produces a new falsifier. Any new product defect stops this attempt for evidence-backed replanning in this same task.\n\n## Acceptance criteria\n\n- The hostile temp-symlink regression fails on the current code and passes after the bounded fix; the external target bytes remain unchanged.\n- The complete owning embedding-runtime tests, public-safety scan, Ruff, format, and both Pyright contours pass without unrelated file changes.\n- A fresh exact 1.13.5 wheel passes the existing local installed-golden application owner.\n- On native Ubuntu 24 aarch64 Python 3.12, the same exact wheel passes venv, bootstrap-venv, pipx, uv-tool, Linux systemd-user lifecycle, and all 26 installed-golden rows with terminal `ok: true`; real embedding, search, old-palace append, watcher exit, and disposable user/cache/root cleanup are observed.\n- The final candidate keeps FastEmbed/ONNX in the default graph and keeps Torch, CUDA, NVIDIA, Triton, Chroma extras, and ChromaDB absent. Existing compatibility, docs, security, and release gates pass at one final SHA.\n\n## Recovery\n\nRemove only the disposable hostile cache root, rerun `python -m pytest tests/test_embedding_runtime.py -q`, rebuild the exact wheel, and rerun the existing installed-golden command. Do not resume or merge the superseded broad Autopilot plan."
