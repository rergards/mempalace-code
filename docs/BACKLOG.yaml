items:
  - key: REL-ARM-ONNX-PCIBUS-DIAGNOSTIC-CLASSIFIER
    summary: "Classify the bounded ONNX PCI warning on hosted ARM"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, release-gate, rule-zero]
    description: "## Symptom\n\nExact rc5 run 33399496356 job 99512031771 passed every ARM installer contour, then installed_golden_fetch_model failed because a successful cached fetch emitted one ANSI-wrapped ONNX Runtime GetPciBusId warning on stderr.\n\n## Steps to reproduce\n\nRun the installed golden suite on hosted ubuntu-24.04-arm with ONNX Runtime 1.29.0 and a cached MiniLM model; the cached fetch returns success while device_discovery reports that a dynamic ACPI PCI path does not match the expected PCI-address pattern.\n\n## Expected vs actual\n\nExpected: the existing release diagnostic classifier consumes only that complete known successful Linux ARM warning and the fetch-model scenario continues. Actual: the classifier recognizes only the older cpuid_info warning, so require_success rejects the otherwise successful command.\n\n## Root cause hypothesis\n\nConfirmed in the hosted log and independent review: scripts/release_readiness_gate.py already owns one fail-closed ARM ONNX diagnostic exception, but its exact allowlist lacks the new GetPciBusId shape emitted by ONNX Runtime 1.29.0.\n\n## Scope\n\nExtend only the existing _classify_installed_golden_diagnostic owner and its existing tests. Accept the complete anchored GetPciBusId warning shape only when returncode is zero, platform is Linux, machine is ARM64, and stderr contains no additional byte or line. Preserve dynamic-path bounding and ANSI handling without a global warning suppression. Regenerate the existing quality scorecard artifacts if test-line telemetry changes. Do not change fetch-model, dependencies, model cache, thresholds, workflows, runtime logging, or add a helper/sanitizer/gate.\n\n## Acceptance criteria\n\n- The exact hosted warning is consumed only for a successful Linux ARM64 result.\n- Non-ARM, non-Linux, nonzero exit, altered case/format, duplicate warning, extra byte, and additional stderr remain fail-closed and visible.\n- Existing cpuid_info classification remains unchanged.\n- Focused readiness tests, full non-network suite, scorecard check, public safety, formatting, and diff checks pass.\n- A fresh exact-SHA hosted ARM job passes installed_golden_fetch_model; final release closure remains owned by REL-LINUX-ARM-INSTALLER-HANDSHAKE."
  - key: REL-X64-MINILM-COMPATIBILITY-DIAGNOSTIC
    summary: "Report the exact hosted x64 MiniLM compatibility predicate"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, benchmark, rule-zero]
    description: "## Symptom\n\nExact rc5 run 33399496356 job 99512031696 reached the installed MiniLM compatibility gate and returned only the generic message that the fixture is invalid or drifted. The same exact wheel, FastEmbed 0.8.0, ONNX Runtime 1.29.0, and read-only model cache pass on macOS and disposable amd64 Ubuntu, where minimum paired cosine is 0.999999999999444, maximum matrix delta is 1.3975815787992119e-07, and neighbor order matches.\n\n## Steps to reproduce\n\nRun python benchmarks/code_retrieval_bench.py --check-minilm-runtime-compatibility in hosted ubuntu-latest x64 for the exact rc5 wheel and cache.\n\n## Expected vs actual\n\nExpected: a failed gate names whether generic fixture schema, fixture hash, current vector shape/norm, paired cosine, matrix delta, or neighbor order failed and reports the bounded observed value plus one recovery command. Actual: all failures collapse to one generic fixture message, so dependency, cache, threshold, and hardware-runtime causes cannot be distinguished safely.\n\n## Root cause hypothesis\n\nThe existing _validate_current_vectors owner raises the same _fixture_error for immutable fixture defects and runtime metric drift. The adjacent GetPciBusId warning is incidental because this benchmark does not reject stderr.\n\n## Scope\n\nExtend only the existing benchmark validation/error owner and its existing tests. Keep one generic fixture_schema diagnostic, add one fixture_hash diagnostic, and name the five runtime classes: current vector shape, current vector norm, minimum paired cosine, maximum similarity-matrix delta, and neighbor order. Do not create a per-field fixture diagnostic taxonomy. Runtime failures must use exactly mempalace-code fetch-model --model all-MiniLM-L6-v2 --force, described as cache refresh-and-retry; a persistent predicate remains a runtime/dependency compatibility blocker and the text must not imply that refresh guarantees a repair. Keep fixture validation fail-closed and do not expose vectors or local paths. Regenerate the existing quality scorecard artifacts only if test-line telemetry changes. Do not alter the fixture, thresholds, model, dependencies, cache policy, workflow, runtime behavior, or add a second validator/helper/gate.\n\n## Acceptance criteria\n\n- Generic fixture schema and fixture hash failures remain distinct from the five runtime failure classes.\n- Metric diagnostics are deterministic, bounded, public-safe, and contain the single bounded cache refresh-and-retry command without printing vectors or machine paths or promising that refresh fixes persistent runtime drift.\n- Existing passing macOS and disposable amd64 Ubuntu compatibility checks remain green with unchanged thresholds.\n- Focused benchmark tests, full non-network suite, scorecard check, public safety, formatting, and diff checks pass.\n- The next exact-SHA hosted x64 run either passes or yields the exact failing predicate and observed value needed for an evidence-based repair; no threshold or dependency change is authorized by this task."
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Make hosted ARM installer smoke establish its owned identity"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, installer, rule-zero]
    description: "## Symptom\n\nPublic candidate run 33328559281 failed before installer execution because the disposable child wrote its temporary identity with a mode that did not satisfy the immediate 0600 postcondition. The later missing-identity and cleanup messages were secondary.\n\n## Steps to reproduce\n\nRun the installed-application job on ubuntu-24.04-arm for the exact candidate wheel and observe the embedded launcher fail at test \"$(stat -c %a \"$2\")\" = 600 before atomic identity publication.\n\n## Expected vs actual\n\nExpected: the temporary identity passes its existing 0600 check, publishes atomically, and the job reaches all-installers and installed-golden execution. Actual: the child exits at the mode check and the outer job reports missing identity.\n\n## Root cause hypothesis\n\nConfirmed by hosted x64 and ARM output: the embedded launcher relies on umask alone, while the exact post-write mode observed by the hosted shell does not equal 600. Existing native ARM evidence completed every installer, the 26-row golden suite, systemd lifecycle, and cleanup, so product installers and the downstream smoke are not the first failing owner.\n\n## Scope\n\nExtend the existing embedded launcher in .github/workflows/ci.yml with an explicit chmod 0600 -- \"$2\" immediately after the identity write and before the existing regular-file, owner, mode, and atomic mv checks. Extend the smallest existing workflow admission assertion for this ordering. Inspect prior attempt b660e2bd as evidence only; do not merge it wholesale. Do not add a deadline protocol, diagnostic receipt, new cleanup behavior, blind sleep, helper, or second handshake owner.\n\n## Acceptance criteria\n\n- The temporary identity is explicitly mode 0600 after write and before existing validation and same-directory atomic publication.\n- Existing identity, PGID, interpreter, signal, cleanup, exact-wheel, installer, and golden behavior is otherwise byte-for-byte unchanged.\n- The smallest existing workflow admission test proves write then chmod then mode check then mv; focused workflow tests, Actionlint, diff checks, and public safety pass.\n- One exact-SHA public candidate run reaches and completes the hosted Ubuntu 24.04 ARM64 installed-application job and release-required. Record that receipt when closing this task; do not create a second evidence task."
  - key: REL-DIRECT-APPLICATION-COMPLETE-GATE
    summary: "Restore exact publish workflow security predicates"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: quality
    description: "## Symptom\n\nThe v1.13.5 review proved that the current actionlint and Zizmor checks accept an extra publish job, a removed adjacent action-version comment, and an added id-token write permission. The previous workflow security owner rejected these mutations and was deleted in the release delta.\n\n## Steps to reproduce\n\nRun actionlint and Zizmor 1.29.0 against temporary copies of the workflows containing each mutation. Mutable action references fail Zizmor; the three repository-specific contract mutations pass.\n\n## Expected vs actual\n\nExpected: the existing workflow-shape owner rejects drift from the approved three-job publish boundary, exact job permissions, immutable action refs, and adjacent version comments. Actual: exact permissions for known jobs remain tested, while the exact job set and version-comment predicates are absent.\n\n## Root cause hypothesis\n\nThe release preparation deleted scripts/workflow_security_gate.py and relied on generic analyzers plus focused workflow tests. Generic analyzers do not own repository-specific job-set or comment invariants, and the focused tests did not retain both predicates.\n\n## Scope\n\nExtend tests/test_release_workflow_admission.py as the existing workflow-shape owner. Add exact publish job-set coverage and apply immutable-reference plus adjacent-version-comment coverage to every tracked workflow uses node. Correct the inaccurate enforcement comment in .github/dependabot.yml. Reuse current permission assertions and actionlint/Zizmor; do not restore the deleted 245-line gate, add a script, add a new gate, or change workflow behavior.\n\n## Acceptance criteria\n\n- A temporary extra publish job fails the existing workflow-shape suite.\n- A missing adjacent version comment on any external workflow action fails the suite.\n- Existing exact permissions and full-SHA behavior remain covered.\n- The Dependabot comment names the actual owners truthfully.\n- Focused workflow tests, actionlint, Zizmor, Ruff, format, gate inventory, public safety, diff checks, and backlog validation pass."
