items:
  - key: RELEASE-DIRECT-INSTALLED-APP-GATE
    summary: "Make direct exact-wheel application exercise the installed release gate"
    type: task
    status: open
    priority: highest
    size: L
    section_id: pre_release
    description: "## Goal\n\nRequire the existing release-readiness owner to execute the exact candidate wheel as installed applications and fail closed on any declared public surface without direct evidence.\n\n## Completed evidence\n\n- The installed-golden owner runs 26 ordered direct exact-wheel rows without pytest or test-module execution.\n- Installed argparse discovery reconciles 43 CLI command and mode members to direct candidate-console execution.\n- All five MCP profiles and 29 installed tools have direct semantic JSON-RPC evidence, palace-local post-state, and protected-root isolation.\n- Canonical venv, bootstrap-venv, pipx, and uv-tool contours install the exact wheel and prove metadata, import provenance, CLI version, alias, Agent Plugin, ordinary LanceDB runtime, recovery refusals, network denial, and disposable cleanup.\n\n## Scope\n\nReuse scripts/release_readiness_gate.py, scripts/release_install_metadata_smoke.py, their provenance/isolation/subprocess/result owners, and the existing hosted release workflow. Complete one independently testable residual at a time. Do not add a second runner, gate row, catalog, service, durable state owner, dependency unrelated to the declared extras, AI-client call, credential access, publication, tag, push, or remote mutation.\n\n## Acceptance criteria\n\n- AC-1: Install and directly exercise each declared optional extra and the public installed import surface through the existing installer-smoke owner. The smallest valid behavior or intended refusal must prove each extra; import success alone is insufficient where a public behavior exists.\n- AC-2: On a supported Linux user session, run the exact installed candidate through confirmed systemd-user scheduler install, status, and removal plus safe update-apply behavior. Record semantic post-state and cleanup. Unavailable systemd-user support must emit blocking UNRUN.\n\n## Continuation\n\nOptional extras and public installed imports are next. The Linux systemd-user contour follows after that residual is independently qualified and archived."
    assignee: locked
  - key: RELEASE-DIRECT-INSTALLED-LINUX-SYSTEMD
    summary: "Qualify exact-wheel Linux systemd-user update lifecycle"
    type: task
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Scope\n\nExtend the existing exact-wheel installer smoke, updater, and Ubuntu installed-application job to qualify the supported Linux systemd-user scheduler and safe update lifecycle from the exact candidate. The installer smoke remains the lifecycle evidence owner and blocks the existing release-required aggregate. Use one disposable Linux user whose systemd-user manager and HOME share an ownership boundary. Refuse before mutation for foreign, ambiguous, partial, symlinked, non-regular, escaped, or wrong-owner unit paths. Reuse current candidate provenance, credential-free environments, update and scheduler commands, semantic post-state, cleanup, sanitization, subprocess bounds, and aggregate job result. Do not add a second runner, gate row, service manager, updater, package manager, durable state owner, AI-client call, credential access, publication, tag, or unrelated remote mutation.\n\n## Acceptance criteria\n\n- AC-1: On supported Linux with functional systemd --user and matching HOME, install the exact candidate and directly exercise scheduler install, status, repeat, and removal through the installed executable. Prove candidate provenance, fragment path and content, enabled and active semantics, and complete cleanup.\n- AC-2: Existing canonical unit paths with non-matching content, partial ownership, symlinks, non-regular files, foreign uid, path escape, or an incongruent manager and HOME boundary refuse before write, enable, disable, delete, or daemon reload. Matching owned files support bounded idempotent install and removal.\n- AC-3: Directly exercise update status, confirmation refusal, and confirmed safe update apply behavior. Require bounded noninteractive behavior, exact semantic result, and no credential or AI-client access. A deterministic unpublished-candidate or blocked-network result is valid only when it proves zero package and user-unit mutation.\n- AC-4: Preserve unsupported-platform and unavailable-systemd refusals. Missing supported Linux evidence remains blocking UNRUN with one recovery command; mocks, source-only tests, and non-Linux refusal evidence cannot pass it.\n- AC-5: Keep the existing release readiness gate and installed-golden row set unchanged. Require focused false-PASS and ownership regressions, affected and full suites, direct exact-installed Linux evidence in the current Ubuntu job, static workflow and public-safety gates, and independent correctness, security, and Rule Zero reviews.\n\n## Current evidence\n\nThe exact candidate wheel SHA-256 is 48eba064520a75afbfec266caa197c9cd3f50445b86923caa1bbfe90977e29cf. It passed all 26 direct installed-golden rows offline. The full source suite passed 4,234 tests with 4 skipped and 2 deselected; focused, artifact, public-safety, secret, static, workflow, and independent reviews passed. Non-Linux release-readiness passed every supported installer surface and correctly retained the Linux lifecycle result as UNRUN. A bounded local Linux attempt exhausted its available memory before complete lifecycle evidence, so it cannot establish PASS or product FAIL.\n\n## Next action\n\nRun the unchanged public installed-application job for the exact pushed candidate commit. Require one terminal release-required PASS with all four installers, linux_systemd_update_lifecycle=pass, and complete disposable-user cleanup. A hosted PASS closes this residual. A hosted out-of-memory or nonzero lifecycle result blocks closure and requires a separate architecture or operations decision. Recovery: delete only the remote candidate branch and retain blocking UNRUN; do not create a tag or publication.\n\n## Hosted failure — 2026-08-27\n\nExact candidate SHA `52ca56703217ffa938a543f250dcdd2bf7470ed6` reached the cache-miss bootstrap and exact-wheel provisioning in public run `33098437503`, then failed before the smoke script started: the disposable user could not open `scripts/release_install_metadata_smoke.py` through the private GitHub workspace path. Repair only the existing workflow staging boundary: materialize the exact read-only smoke script and wheel in one disposable user-readable contour, prove regular-file identity and readability before invocation, preserve credential-free `env -i`, and remove the contour in the existing cleanup path. Do not chmod the checkout, weaken exact-wheel provenance, add a job, or claim lifecycle PASS until the terminal aggregate and cleanup pass. Recovery: remove only the staged contour and disposable user, then rerun the same installed-application job.\n\n## Current attempt boundary\n\nChange only `.github/workflows/ci.yml`, the existing workflow-admission regression in `tests/test_release_workflow_admission.py`, and deterministic `docs/quality/scorecard.{md,json}` output required by the existing scorecard owner. Stage the exact script and wheel under an atomically created `mktemp -d /var/tmp/mempalace-installed-application.XXXXXX` contour because paths beneath `/home/runner` may remain untraversable to the disposable user. Preserve the wheel's canonical basename; renaming it to `candidate.whl` or another non-wheel filename is invalid. Prove source/staged byte identity, regular non-symlink files, root ownership, read-only modes, disposable-user readability, exact-file cleanup without recursive deletion, and unchanged credential-free invocation. Do not change `scripts/release_install_metadata_smoke.py`, product code, installer orchestration, release docs, scorecard logic, job topology, or manager coverage. The prior local OOM is not evidence for an orchestration change; only a hosted OOM after the staging repair may reopen that decision.\n\n## Hosted rerun — 2026-08-27\n\nPublic Tests run `33108172230` on exact SHA `bb4713598c68c5cca249be61b4fa65ce6ef61ac4` passed cache bootstrap, build/provisioning, lint, package, typecheck, Chroma migration, dependency, Gitleaks, and Python 3.11/3.12/3.13. The installed-application step entered the existing four-installer smoke and was canceled after 7m40 without terminal JSON; the public annotation says only `The operation was canceled`. This is blocking UNKNOWN: it neither proves a staging/product failure nor lifecycle PASS. Python 3.14 failed concurrently in pytest and is tracked separately. Recovery: reproduce the exact installed step on a supported Linux runner with captured terminal output, then require all four installer receipts, `linux_systemd_update_lifecycle=pass`, and complete user/staging cleanup before closure."
    links:
      - type: subtask-of
        key: RELEASE-DIRECT-INSTALLED-APP-GATE
  - key: CHROMA-MIGRATION-ADVISORY-SUNSET
    summary: "Remove the advisory-affected ChromaDB migration dependency from the release"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nThe current-hash v1.13.5 dependency audit blocks chromadb 0.6.3 on GHSA-2wm9-hf6c-p5cr, GHSA-36p7-vc44-83pf, and GHSA-xph7-9rjv-w5fr. GitHub Advisory Database marks chromadb >=0.4.17 through the latest 1.5.9 affected, with no patched release. The release cannot regenerate successful dependency evidence while the deprecated migration extra remains.\n\n## Steps to reproduce\n\nRun the existing dependency audit for current runtime, dev, chroma, and chroma-migration targets. It exits nonzero before resolver execution and reports the three advisories for chromadb 0.6.3; the canonical report remains stale.\n\n## Evidence\n\nChromaDB is already retired from normal runtime; LanceDB is the sole storage backend and Chroma is imported only by the one-way migration bridge. A clean Python 3.14 resolver and direct smoke showed that chromadb 0.4.16 requires numpy<2 and a source build, while a 0.4.16 PersistentClient cannot read a synthetic palace created by 0.6.3 (`no such column: collections.topic`). A safe compatible pin is therefore unavailable. Do not weaken the dependency audit or suppress the advisories.\n\n## Scope\n\nRemove the advisory-affected chromadb dependency, canonical chroma-migration extra, deprecated chroma alias, packaged migration implementation, and obsolete migration-only tests/docs from the current release. Reuse the existing migrate-storage CLI and Chroma-only palace detection owners as a fail-closed retirement/tombstone path that names current status, requires a backup, gives one concrete pre-upgrade recovery command using the last public bridge release (`mempalace-code[chroma]==1.13.4`) in an isolated local environment, and never deletes or mutates user data. Keep LanceDB runtime, ordinary installs, existing palace detection, and unrelated migration/history evidence unchanged. Do not add a replacement parser, service, store, dependency waiver, advisory suppression, network server, automatic data conversion, or user-data cleanup.\n\n## Acceptance criteria\n\n- AC-1: Fresh default, dev, and every remaining optional-extra resolver/audit surface contains no chromadb package and passes the existing advisory gate; v1.13.5 report regeneration succeeds against current pyproject.toml and uv.lock hashes.\n- AC-2: Core install, wheel, sdist, import, CLI, MCP, watcher, backup, and LanceDB behavior remain unchanged; installed-artifact inspection proves chromadb is absent.\n- AC-3: `mempalace-code migrate-storage` and automatic Chroma-only palace detection fail before mutation with explicit retirement/advisory status, backup requirement, one isolated pre-upgrade recovery command, and no suggestion to install a current Chroma extra. Repeated, malformed, stale-context, and mixed Lance/Chroma calls remain safe and deterministic.\n- AC-4: Remove superseded migration implementation, extras, lock entries, smoke owners, package exports, and public docs without leaving aliases, dead imports, duplicate guidance, generated residue, or private evidence. Historical changelog and archived reports remain historical.\n- AC-5: Focused CLI/storage/package/docs regressions, fresh Python 3.11-3.14 resolution, full offline suite, Ruff, both Pyright contours, scorecard, public-safety, Gitleaks, artifact checks, and direct exact-wheel installed paths pass. Recovery: restore only this task's reviewed files; never delete a palace, backup, or archive."
  - key: REL-DEPENDENCY-REPORT-CURRENT-HASH
    summary: "Regenerate the v1.13.5 dependency report for current hashes"
    type: task
    status: open
    priority: high
    size: S
    section_id: pre_release
    description: "## Scope\n\nRegenerate docs/dependency-upgrade-reports/v1.13.5-release.json with the existing scripts/dependency_upgrade_gate.py audit path and the established REL-DEPENDENCY-AUDIT-1-13-5 contract. Keep pyproject.toml, uv.lock, dependency bounds, gate code, CI behavior, and report schema unchanged. Use one transient manifest covering default, dev, and every remaining optional extra with exact current locked targets after Chroma retirement. Commit only the sanitized successful report; retain no manifest, resolver output, cache path, hostname, credential, token, or temporary artifact.\n\n## Acceptance criteria\n\n- verify-report accepts the report against the current pyproject.toml and uv.lock hashes.\n- resolver_audits contains successful default, dev, and every remaining optional-extra row in the established manifest order, with no chromadb row.\n- ci-check passes against publish/main while the existing stale-report regression still fails closed.\n- public-safety and Gitleaks find no private or secret material.\n- Any advisory or resolver failure blocks replacement of the current report and returns one recovery command."
  - key: REL-SCHEDULE-SNIPPET-LINUX-MARKER
    summary: "Accept Linux cron evidence in installed schedule-snippet qualification"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nThe exact candidate hosted suite fails `test_installed_schedule_snippets_bind_to_invoked_launcher` on every supported Linux/Python job even though the invoked source console exits zero and renders the expected deterministic cron re-render and install guidance.\n\n## Steps to reproduce\n\nRun `python -m pytest tests/test_cli_golden_scenarios.py::test_installed_schedule_snippets_bind_to_invoked_launcher -q` on Linux. The release qualifier requires macOS `com.mempalace.*.plist` names in stderr for both platforms and rejects the valid cron output.\n\n## Scope\n\nCorrect only the existing installed schedule-snippet qualification in `scripts/release_readiness_gate.py` and its focused tests. Reuse the existing backup/watch renderers, invoked-launcher binding, quoting, determinism, mutation boundary, install refusal, sanitization, and recovery command. Do not add a scheduler renderer, platform abstraction, release row, workflow job, or user-facing behavior.\n\n## Expected vs actual\n\nExpected: Linux qualification requires the existing cron-specific install marker while Darwin qualification requires the existing plist name. Actual: both platforms require the Darwin plist name.\n\n## Root cause hypothesis\n\nThe qualifier stores one unconditional plist marker per case instead of selecting the existing platform-specific scheduler evidence.\n\n## Acceptance criteria\n\n- The focused source-console scenario passes on Linux only when backup and watch output retain the exact invoked launcher, target quoting, deterministic output, cron install guidance, clean stderr/stdout bounds, refusal behavior, unchanged state, and cleanup.\n- Darwin still requires the exact `com.mempalace.backup.plist` and `com.mempalace.watch.plist` evidence.\n- Removing either platform marker or substituting the ambient launcher makes the focused test fail closed.\n- Focused tests, Ruff, scorecard generation/check, public safety, and the hosted Python matrix pass. Recovery: revert only the platform-marker qualification hunk."
  - key: REL-PY314-HOSTED-MATRIX-FAILURE
    summary: "Resolve hosted Python 3.14 matrix failure"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nPublic Tests run `33127928427` failed the Python 3.14 matrix job on exact candidate SHA `2830b75d3180ac047bf6dd6343e58af052af09fa`; the installed-application job was canceled. A fresh unlocked Linux Python 3.14.7 resolver reproduced one failure after 4,259 passes: `tests/test_cli_golden_scenarios.py::test_cli_non_regular_source_guard` returned `forbidden subprocess output detected`.\n\n## Steps to reproduce\n\nInstall the exact candidate in a clean Linux Python 3.14.7 environment with `pip install --no-cache-dir -e \".[dev,treesitter]\"`, then run `python -m pytest tests/ -v -m \"not needs_network\"`. For the cheaper order falsifier, run `python -m pytest tests/test_cli_golden_scenarios.py -q -x`.\n\n## Reproduction evidence\n\nThe fresh environment resolved pytest 9.1.1, lancedb 0.37.1, sentence-transformers 6.0.0, MCP 2.1.1, pyarrow 25.0.1, and torch 2.13.0. The complete offline suite finished with 1 failed, 4,259 passed, 6 skipped, and 2 deselected. The focused non-regular scenario passed in isolation. The complete golden-scenario file failed at that test in two ordinary runs, while each half of the preceding scenarios plus the failing test passed. A timing-instrumented run passed. A later diagnostic run also exposed a separate watcher race: the composite workflow observed one change but shut down with zero re-mine cycles. This is an accumulated isolation/timing failure in the existing golden-scenario lifecycle, not evidence that FIFO rejection itself is broken.\n\n## Scope\n\nReuse the existing scenario and watcher lifecycle owners in `scripts/release_readiness_gate.py` and `tests/test_cli_golden_scenarios.py`. Identify the leaked state, output, process, descriptor, or readiness boundary and make the smallest deterministic correction. Preserve all non-regular source diagnostics, forbidden-output markers, direct CLI behavior, supported Python versions, dependency bounds, matrix topology, timeouts, and release aggregate unless a narrower falsifier proves one of those owners is wrong. Do not skip, reorder, xfail, retry-away, or weaken the scenario.\n\n## Expected vs actual\n\nExpected: the exact source golden scenarios are order-independent and the fresh Linux Python 3.14 suite passes. Actual: the non-regular guard passes alone and fails after the complete predecessor set; timing instrumentation changes the result.\n\n## Acceptance criteria\n\n- Capture the exact leaked marker or lifecycle state and its existing owner without using AI clients or release credentials.\n- Apply Rule Zero to that proven owner; no new runner, gate row, abstraction, dependency pin, timeout increase, skip, reorder, or retry loop.\n- The focused scenario, the complete golden-scenario file twice consecutively, and the complete offline suite pass in a fresh unlocked Linux Python 3.14 environment.\n- Ruff, Pyright, scorecard, public-safety, release-readiness, and all supported hosted Python jobs pass on the exact candidate SHA.\n- Recovery: run `python -m pytest tests/test_cli_golden_scenarios.py -q -x`; any order-dependent failure blocks the release."
    links:
      - type: is-blocked-by
        key: CLARIFY-REL-PY314-HOSTED-MATRIX-FAILURE
  - key: CLARIFY-REL-PY314-HOSTED-MATRIX-FAILURE
    summary: "Clarify scope for REL-PY314-HOSTED-MATRIX-FAILURE before planning can proceed"
    type: task
    status: done
    priority: highest
    size: XS
    section_id: immediate
    assignee: owner
    description: "## Scope\n\nResolve the evidence clarification for REL-PY314-HOSTED-MATRIX-FAILURE only. The parent remains the implementation owner.\n\n## Answer\n\nA clean Linux Python 3.14.7 run against exact candidate bb4713598c68c5cca249be61b4fa65ce6ef61ac4 reproduced the first failure:\n\n- Test: tests/test_release_install_metadata_smoke.py::test_pipx_smoke_install_failure_is_diagnostic_not_ok\n- Assertion: expected at least one STATUS_FAIL surface, but none was present.\n- Root cause: run_pipx_smoke calls find_pipx_executable before the injected subprocess seam. The failing test does not patch discovery, so an environment without ambient pipx returns the legitimate missing-tool STATUS_ERROR and never reaches the simulated install failure.\n- Existing owner: tests/test_release_install_metadata_smoke.py. The adjacent disposable-pipx test already patches find_pipx_executable to a fake executable.\n- Smallest correction: make this existing unit test patch find_pipx_executable, leaving product behavior, dependencies, CI topology, and supported versions unchanged.\n- Cheapest falsifier: run this focused test in clean Linux Python 3.14 without ambient pipx; it must reach the simulated install failure and report STATUS_FAIL.\n\n## Acceptance criteria\n\n- The exact failing test, traceback cause, existing owner, and smallest correction are recorded.\n- This clarification is done while REL-PY314-HOSTED-MATRIX-FAILURE remains open."
    resolution: "2026-08-27: Captured exact clean Linux Python 3.14.7 failure, test owner, ambient-pipx root cause, and deterministic test-only correction; parent remains open."
    done_summary: "Captured exact clean Linux Python 3.14.7 failure, test owner, ambient-pipx root cause, and deterministic test-only correction; parent remains open."
  - key: STORAGE-CREATE-FALSE-NONMUTATING
    summary: "Make create=False storage opens fail without filesystem mutation"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Symptom\n\nA clean root Linux Python 3.14 full-suite run on candidate ec067163688bd404d0244995e6ca8feeaca34f83 failed tests/test_searcher.py::TestSearchMemories::test_no_palace_returns_error. A direct writable-temp falsifier proved that search_memories on a missing palace creates the path and returns a false-success empty result.\n\n## Steps to reproduce\n\nCreate a writable temporary directory, choose a missing nested palace path, call search_memories(\"anything\", path), and inspect both the result and path existence. Current behavior changes path existence from false to true and returns results=[] without an error.\n\n## Scope\n\nRepair the existing storage factory contract. open_store(create=False) must not create the palace or Lance directory and must fail before lancedb.connect when the canonical Lance table directory lance/mempalace_drawers.lance is absent. Preserve create=True creation, existing-palace writable migration, read_only behavior, Chroma migration refusal, and current public error/recovery payloads. Reuse existing storage and search tests; do not add a second factory or search-specific storage probe. The implementation plan must include the existing mixed-marker owner tests/test_storage_lance.py because its stale empty-Lance success expectation is superseded by this contract.\n\n## Expected vs actual\n\nExpected: missing writable palace returns the existing No palace found error and leaves the filesystem unchanged. Actual: open_store creates the path despite create=False, then search returns a misleading successful empty result.\n\n## Failed attempt evidence\n\nThe first implementation checked only whether palace/lance was a directory. A direct empty-Lance falsifier created palace/lance without lance/mempalace_drawers.lance; open_store(create=False) still called lancedb.connect, wrote Lance manifest/transaction metadata, and returned a LanceStore with _table=None. The guard must use the existing _LANCE_TABLE owner and reject this contour before connect. Update the stale mixed Lance/Chroma marker regression in tests/test_storage_lance.py so an empty Lance marker is not treated as a valid writable store; keep Chroma refusal and valid mixed-palace behavior covered. A later plan omitted this required owning path while implementation changed it; the next plan must name the path before implementation.\n\n## Acceptance criteria\n\n- Add a writable tmp-path regression proving search_memories returns the existing error and creates no filesystem path.\n- Add or extend storage-factory regressions proving create=False refuses missing palace, empty palace, and empty Lance directory before directory creation or lancedb.connect, while existing writable stores still open and migrate as before.\n- Focused storage/search regressions, full offline suite on macOS and clean Linux Python 3.14, both Pyright contours, Ruff, scorecard, public-safety, and release-readiness artifact/installed surfaces pass.\n- Do not change CLI/MCP error wording, add flags, weaken read-only behavior, or invoke AI clients/credentials. Symlink policy is not changed by this task.\n- Recovery: remove the disposable temp root and rerun the writable missing-path and empty-Lance falsifiers; no new path or Lance metadata may appear.\n\n## Full-suite contract correction\n\nAfter the table-level fix, the macOS full suite reached tests/test_e2e.py::test_mcp_session_lifecycle and exposed one stale pre-init assertion: it expected tool_search on a missing palace to return a results key. The accepted public contract now returns the existing No palace found error and hint without creating storage. Update only that existing tests/test_e2e.py assertion and comment; preserve add, found-search, delete, and gone-search steps. The next implementation plan must name tests/test_e2e.py. Cheapest falsifier: the focused lifecycle test passes with the exact error payload, then the full offline suite continues past this point.\n"
