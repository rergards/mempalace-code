items:
  - key: REL-CUSTOM-MODELS-LINUX-CPU-INSTALL
    summary: "Make CPU-only Linux custom-model installation bounded and recoverable"
    type: bug
    status: open
    priority: high
    size: S
    section_id: pre_release
    description: "## Symptom\n\nOn Ubuntu 24.04 ARM64 CPU-only, a fresh install of the exact wheel with [custom-models] resolved PyTorch plus multi-gigabyte CUDA/NVIDIA dependencies, filled a 7.1 GiB temporary filesystem, and failed with Errno 28. The installed-golden gate reported only that the custom-models contour installation failed. The first repair also put a release-gate command using a source checkout and WHEEL variable into the ordinary agent installation path, where it cannot run.\n\n## Steps to reproduce\n\nRun the exact candidate wheel installed-golden gate on Ubuntu ARM64 with TMPDIR on a constrained filesystem, or install the wheel [custom-models] extra with fresh pip resolution from PyPI. Then inspect AGENTS.md, README.md, docs/AGENT_INSTALL.md, docs/OFFLINE_USAGE.md, and docs/RELEASING.md for executable authority and recovery consistency.\n\n## Scope\n\nExtend the existing custom-model documentation and installed-golden owner. Keep the default FastEmbed dependency graph unchanged. Add no external AI client, credential access, service, mode, or second release gate. Keep user/agent installation authority separate from source-checkout release qualification authority.\n\n## Expected vs actual\n\nExpected: CPU-only Linux users, installation agents, and release operators each get an executable CPU PyTorch contour, an explicit scratch-space requirement, and one recovery action valid in their environment. Actual: the one-step extra may select accelerator dependencies, the gate discards the decisive pip error, and the first agent-facing recovery assumes release-only files and variables.\n\n## Root cause hypothesis\n\nSentence Transformers requires PyTorch; the default PyPI Linux resolver may choose a build with CUDA/NVIDIA dependencies. Public instructions do not consistently name the official CPU wheel index or scratch-space recovery. install_extra replaces pip stderr with a generic exception. The first documentation repair treated user installation and release qualification as one authority.\n\n## Acceptance criteria\n\n- docs/OFFLINE_USAGE.md owns the canonical CPU-only Linux user installation and ENOSPC recovery; its commands require no repository checkout, release script, or WHEEL variable.\n- docs/AGENT_INSTALL.md gives an agent-executable equivalent or an unambiguous canonical handoff, states authority, and never sends an ordinary installer to a release-gate command.\n- README.md and AGENTS.md no longer present a bare one-step CPU-only Linux custom-model install as sufficient; they route users and agents to the canonical safe contour without duplicating a competing recovery.\n- docs/RELEASING.md separately owns exact-wheel qualification and may use the installed-golden gate plus WHEEL because that authority has a source checkout.\n- The existing installed-golden gate uses the documented CPU-only Linux contour without changing macOS behavior or the default dependency graph.\n- Optional-extra installation failures preserve a bounded, sanitized decisive diagnostic; Errno 28 emits current status and one exact retry command appropriate to release qualification.\n- Focused tests cover CPU-contour selection, ENOSPC recovery, output bounds, private-path redaction, all five documentation surfaces, and separation of user/agent from release recovery authority.\n- The exact rebuilt wheel passes installed-golden on macOS and Ubuntu ARM64; the default graph still excludes Torch, CUDA, NVIDIA, Triton, and Chroma.\n- Existing documentation, public-safety, artifact, static, and full non-network gates pass; no new gate is added."
