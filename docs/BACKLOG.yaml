items:
  - key: REL-LINUX-ARM-TORCH-CUDA-RESOLVER
    summary: "Replace unsafe Torch default with compatible ONNX embeddings"
    type: bug
    status: open
    priority: highest
    size: L
    section_id: quality
    description: "## Symptom\n\nA fresh unlocked Python 3.12 install on Linux aarch64 resolves sentence-transformers and PyPI torch 2.13 with CUDA, NVIDIA, and Triton dependencies, exhausting disk before MemPalace installs. The original torch<2.11 workaround is rejected: torch 2.10 is affected by GHSA-rrmf-rvhw-rf47 and high-severity PYSEC-2026-139, while public package metadata cannot transparently select the official PyTorch CPU index.\n\n## Steps to reproduce\n\nOn a clean Ubuntu 24 aarch64 Python 3.12 environment, install the current exact wheel with ordinary unlocked pip and no preinstalled packages. Inspect installed distributions and disk use. PyPI torch 2.13 selects Linux-wide CUDA, NVIDIA, and Triton dependencies. A torch<2.11 candidate avoids those packages but fails the existing dependency advisory gate.\n\n## Scope\n\nReplace only the canonical default all-MiniLM-L6-v2 implementation inside the existing storage embedder owner with FastEmbed/ONNX. Remove sentence-transformers and Torch from default runtime dependencies. Preserve arbitrary Hugging Face model names and local SentenceTransformer paths through one optional custom-models extra and the existing embed_model contract; when the extra is absent, fail before table creation, schema migration, cache mutation, or row mutation with one exact install/recovery command. Do not add a backend flag, second store, service, index override, durable selector, schema migration, embedding-model change, second benchmark baseline, provider-owned CHANGELOG edit, or sibling/prerequisite backlog item. Preserve the completed Chroma retirement: do not reintroduce chroma-migration, chroma, or chromadb into current package metadata.\n\nCanonical MiniLM aliases must never execute trust_remote_code. Keep trust_remote_code confined to the explicitly selected custom-models path, document that trust boundary, and preserve exact offline behavior. The FastEmbed cache must have one authoritative root, owned-artifact identity/provenance, symlink-safe force-deletion boundary, and exact recovery command shared by runtime, fetch-model, installed gates, CI, and docs. Retain the old SentenceTransformer cache only for custom models; do not convert it or report it as a valid default FastEmbed cache.\n\nRule Zero evidence: the insecure version cap and transparent CPU-index route are falsified. FastEmbed 0.8.0 supports the same 384d MiniLM model; an isolated five-text A/B measured paired cosine >=0.9999999268, maximum similarity-matrix delta 1.58e-7, and identical nearest-neighbor order. Treat those measurements as provisional until a committed public-safe fixture records the exact texts, former-runtime vectors, model identity/revision, runtime versions, normalization and dimension facts, and generation command; derive tolerances and neighbor order from that fixture rather than a hand-written threshold. The existing _EmbedderProtocol, storage.py embedder, fetch-model command, installed-wheel smoke, retrieval_quality_facts.json benchmark baseline, dependency report, and public docs remain the owners. Existing tests that import torch, including tests/test_miner.py, must follow the optional custom-model boundary rather than restoring Torch to dev/default dependencies. Existing direct owners tests/test_cli_golden_scenarios.py, tests/test_cli_command_modules.py, tests/test_offline.py, tests/test_watcher_resource_subprocess.py, and tests/test_installed_artifact_behavior.py must update their SentenceTransformer/HF-cache assumptions or record focused proof that a file remains valid unchanged; strict plan scope must name each owner. Cheapest decisive falsifier: the full pinned retrieval corpus regresses, an old SentenceTransformer-built palace changes ranking materially, offline cached load makes a network call, an unavailable custom backend mutates table/schema/cache/rows, the exact candidate Chroma tombstone mutates or stops naming the isolated 1.13.4 bridge as historical recovery, current metadata reintroduces a Chroma extra/dependency, or an exact Linux aarch64 wheel installs torch/cuda/nvidia/triton.\n\n## Acceptance criteria\n\n- Default wheel metadata and fresh pip, pipx, uv-tool, and bootstrap installs contain FastEmbed/ONNX and no torch, cuda-, nvidia-, or triton distribution on supported platforms, including native Linux aarch64 Python 3.12.\n- The canonical all-MiniLM-L6-v2 names route deterministically through the existing embedder owner to CPU FastEmbed, never use trust_remote_code, retain 384 dimensions and normalized vectors, and add no user backend/config mode.\n- Existing stored vector bytes remain untouched. A committed public-safe compatibility fixture contains the exact five texts, former-runtime vectors, model identifier and revision, runtime versions, normalization and dimension facts, and generation command; the regression test derives the numerical tolerance and nearest-neighbor order from it. New FastEmbed vectors meet that tolerance, the existing retrieval_quality_facts.json corpus identity and R@5/R@10 baseline pass fail-closed, and representative old SentenceTransformer-generated palaces remain searchable and writable without reindexing or schema migration.\n- Existing arbitrary model names and local SentenceTransformer paths work when custom-models is installed. Without that extra, model preflight happens before table creation/open migration/cache deletion/row writes and prints one exact recovery command. A stale old default HF cache cannot produce a false already-available result.\n- fetch-model, init, mine, search, MCP stdio, watcher, tests/test_miner.py, all four installed application surfaces, and the existing direct owners tests/test_cli_golden_scenarios.py, tests/test_cli_command_modules.py, tests/test_offline.py, tests/test_watcher_resource_subprocess.py, and tests/test_installed_artifact_behavior.py directly execute the real default FastEmbed runtime for runtime, installation, and cache behavior. Deterministic fakes are allowed only for isolated unit seams that cannot safely execute the runtime in that test environment; they cannot satisfy or replace direct application evidence. Cached operation with HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE performs no network call; cache miss, force, retry, immutable provenance, symlink/ownership refusal, and cleanup behavior remain explicit and idempotent.\n- uv.lock and the v1.13.5 dependency report are regenerated through existing owners. Fresh advisory/resolver evidence covers every published runtime/optional graph and the dev group, or proves an unchanged graph is already covered; it must include custom-models, spellcheck, watch, and treesitter. Exact-candidate metadata and installed behavior prove that chroma-migration, chroma, and chromadb remain absent, while migrate-storage still fails before source/destination mutation and names the intentionally historical 1.13.4 bridge recovery command.\n- The complete candidate passes artifact/Twine, public-safety, Gitleaks, lint, format, Pyright, architecture, scorecard, benchmark, docs-drift, and release gates at one final SHA.\n- The existing release-critical package job runs the exact wheel on ubuntu-latest Python 3.11 and native ubuntu-24.04-arm Python 3.12 using the existing installed-smoke owner; no sibling release authority or backlog item is created. Native ARM evidence is part of this task's release acceptance; release admission remains blocked and reports one recovery action when the public-preview runner is unavailable.\n- Public human and LLM documentation names the default cache/runtime truth, immutable model provenance, custom-model extra and trusted-code boundary, current Chroma retirement plus historical 1.13.4 recovery boundary, current status, one action, authority, and one recovery command without retaining SentenceTransformer-only default claims or private paths.\n\n## Native ARM qualification finding — 2026-08-29\n\nThe exact 1.13.5 wheel passed fresh native Ubuntu 24 aarch64 installs through venv, bootstrap-venv, pipx, and uv-tool; the Linux systemd-user lifecycle also passed with no Torch/CUDA/NVIDIA/Triton distributions and complete cleanup. The full installed-golden run then reached cached fetch-model and failed because ONNX Runtime 1.29.0 emitted exactly `onnxruntime cpuid_info warning: Unknown CPU vendor. cpuinfo_vendor value: 0` on stderr in the OrbStack ARM VM. The process returned success and model provisioning completed, but the existing golden owner correctly rejects unexpected stderr. Upstream classifies this diagnostic as cosmetic on some ARM systems while separate Jetson reports correlate the same warning with a native crash, so a global stderr ignore or suppression is forbidden.\n\nKeep the existing installed-golden owner. On Linux ARM only, classify exactly this one line as an allowed upstream diagnostic only when the command exits 0; any additional stderr or nonzero exit remains a failure. The same exact-wheel run must then execute real embedding, search, old-palace append, watcher, and clean process exit before the task can close. Re-run the complete native ARM 26-row installed-golden suite and require terminal `ok: true` plus disposable user/cache/root cleanup.\n\n## Provenance temp-file symlink finding — 2026-08-29\n\nIndependent security review found that `_write_canonical_provenance()` writes `.mempalace-model.tmp` through `Path.write_text()`. A hostile pre-existing symlink at that temporary path can redirect the write outside the canonical cache before the atomic replace. Reuse the existing provenance writer and cache ownership boundary; do not add a second writer or cache mode. Create the temporary file exclusively without following symlinks, verify it remains an owned regular file inside the canonical cache, and replace only after those checks. Add the exact regression: point `.mempalace-model.tmp` at a disposable external file, invoke the writer, require fail-closed behavior, byte-identical external content, and no accepted provenance. Recovery: remove only the disposable hostile cache root and rerun the symlink falsifier."
