items:
  - key: RELEASE-LIVE-UPSTREAM-PRETAG-RECOVERY
    summary: "Move live upstream review before immutable release tags"
    type: bug
    status: done
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    labels: [release, upstream, documentation, versioning, quality]
    description: "## Symptom\n\nThe v1.13.2 tag passed the local static release preflight and all branch-hosted quality workflows, then the tag-triggered Publish to PyPI workflow stopped before building because upstream develop had advanced from the reviewed 8516db7fbc7f0840bf67132c5bf95c6e446d6acc snapshot to b2104238d4491654f17118d12cf876ac5e41a0cf. The tag is now public and immutable, while PyPI and GitHub Releases were not changed. The public upstream comparison also omits capabilities advertised by the new upstream snapshot and contains one duplicated sentence.\n\n## Steps to reproduce\n\n1. Run python scripts/release_preflight.py --tag v1.13.2 --require-clean before creating the tag; observe a passing static result.\n2. Push v1.13.2 and inspect Publish to PyPI run 31537499487.\n3. Observe upstream_comparison_guard.py --check-live report upstream head b2104238d4491654f17118d12cf876ac5e41a0cf instead of the pinned 8516db7fbc7f0840bf67132c5bf95c6e446d6acc.\n4. Compare the pinned and current upstream README, CHANGELOG, pyproject metadata, Codex plugin manifests, MCP configuration, and relevant RFCs.\n\n## Scope\n\nMake the canonical pre-tag release path execute the existing read-only live upstream guard before an immutable tag can be created. Refresh the public upstream comparison and manifest at upstream develop b2104238d4491654f17118d12cf876ac5e41a0cf, including the newly advertised OpenAI-compatible embeddings, date-window search, Hermes provider core, explicit source adapters, logstream sync foundation, and Codex plugin metadata. Correct stale or duplicated comparison text and preserve explicit evidence limits. Prepare version 1.13.3 as the collision-safe recovery release because v1.13.2 already exists as a public tag.\n\n## Expected vs actual\n\nExpected: the canonical local pre-tag command fails on upstream drift before a tag is created, the reviewed comparison matches the pinned upstream head, and every distinct public tag uses a fresh package version.\nActual: live drift is first checked inside the tag-triggered publication workflow, the review snapshot is stale, and the failed publication consumed v1.13.2.\n\n## Root cause hypothesis\n\nStatic preflight and hosted branch checks validate the pinned comparison internally but omit the existing live head lookup. The only mandatory live check runs after tag creation. Release procedure and executable gate topology therefore permit a known post-tag failure class.\n\n## Acceptance criteria\n\n- The canonical documented pre-tag release command executes scripts/upstream_comparison_guard.py --check-live and fails before tag creation on an upstream head mismatch or an untrusted live response.\n- Tests cover a matching head, drifted head, and live lookup failure without relying on the public network; existing static release preflight remains deterministic and network-free where required.\n- The public upstream snapshot pins develop at b2104238d4491654f17118d12cf876ac5e41a0cf with reviewed_date 2026-08-11, and docs/UPSTREAM_COMPARISON.md plus docs/quality/upstream-comparison.json remain guard-consistent.\n- The comparison accurately records upstream 3.7.0 surfaces observed in its pinned README, CHANGELOG, pyproject metadata, .codex-plugin/plugin.json, .agents/plugins/marketplace.json, .mcp.json, and relevant RFCs. It distinguishes advertised behavior from measured behavior and records the upstream README 44-tool claim separately from any plugin-manifest wording where relevant.\n- The comparison and manifest cover OpenAI-compatible embeddings, date-window search, Hermes provider core, explicit source adapters, logstream sync foundation, and Codex plugin metadata; the fork column records its standards-conformant Agent Plugins 1.0 portable package and four-tool minimal default.\n- Duplicate or stale prose in the comparison is removed, public links point to the new full commit, and README pointers remain accurate.\n- Project, lockfile, Agent Plugin, changelog, README, and every version-bearing public surface are synchronized to 1.13.3 through existing sources and drift guards.\n- The v1.13.2 tag is never moved or deleted. The task creates no tag, push, GitHub Release, PyPI publication, deployment, or remote mutation.\n- Focused guard and metadata tests, the complete non-network and network-marked suites, Pyright basic and strict, docs/public-safety/quality/architecture/performance gates, build, Twine, artifact-member checks, disposable venv and pipx smoke, and installed Agent Plugin MCP protocol checks pass.\n\n## Planner constraints\n\n- CHANGELOG.md is runner-owned completion metadata. Exclude it from provider files, touched_files, implementation scope, and verification outputs.\n- Keep the existing upstream live lookup read-only and bounded. Do not add a second network client or an automatic manifest rewrite.\n- Preserve v1.13.2 as immutable public evidence of the blocked run. Do not force-push or rewrite public history.\n- Implement the prevention at the shared release-readiness boundary and test reusable behavior; do not rely only on prose or a one-off shell command.\n- Preserve the portable Agent Plugins 1.0 package shape and exact four-tool minimal profile.\n- Every task_contract.verification row and every regression_plan.checks row must use class post_landing; provider and configured_runner are rejected by this repository's plan contract validator."
    resolution: "2026-08-12: completed through Autopilot planning plus bounded hybrid provider recovery after deterministic plan-result verification blockers; added the opt-in live pre-tag upstream gate, refreshed the pinned 3.7.0 comparison, synchronized v1.13.3 release surfaces, and enforced command parity across all release documents; focused and complete non-network suites, 2 network tests, Pyright basic/strict, public safety, scorecard, docs, architecture, performance, live upstream, 14-row artifact/install readiness, Twine, venv/pipx, watcher resource, and installed minimal MCP stress checks passed; watcher late disk growth was -10 bytes with stable 240 FDs, while 100 installed MCP requests had zero RSS, FD, and disk growth"
    done_summary: "Prepared the collision-safe v1.13.3 recovery release with a reusable live pre-tag upstream gate and refreshed public comparison; all canonical source, artifact, install, protocol, network, type, performance, documentation, and resource checks passed."
  - key: AGENT-PLUGIN-HOTFIX-RELEASE-INTEGRITY
    summary: "Prepare a collision-safe v1.13.2 Agent Plugin hotfix"
    type: bug
    status: done
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    labels: [release, agent-plugins, versioning, quality]
    description: "## Symptom\n\nPyPI already contains mempalace-code 1.13.1 and tag v1.13.1 points to fd37f397, while the portable Agent Plugins implementation and release-gate hardening landed four commits later without changing the package version. A locally rebuilt wheel therefore contains unreleased behavior under an already published immutable version. The current release preflight reports green because it checks version syntax and tree cleanliness without rejecting a same-version tag that points to another commit.\n\n## Steps to reproduce\n\n1. Confirm PyPI reports 1.13.1 as the latest published release.\n2. Run git rev-list -n 1 v1.13.1 and compare it with HEAD.\n3. Build the current checkout and inspect wheel metadata.\n4. Observe that the wheel still declares 1.13.1 although HEAD contains the Agent Plugins commits after the v1.13.1 tag.\n\n## Scope\n\nPrepare one v1.13.2 hotfix increment for all canonical package, lock, plugin, documentation, and release surfaces. Add a local release-integrity fitness function that fails when the current version already has a repository tag pointing to another commit, while preserving valid pre-tag and matching-tag release flows. Rebuild and install the exact wheel, then rerun canonical release, functional, network, and resource-boundary validation.\n\n## Expected vs actual\n\nExpected: every distinct published artifact has a new immutable version, and local preflight detects post-tag changes that retain a released version.\nActual: the Agent Plugins artifact can be built as 1.13.1 after v1.13.1 was tagged and published, and the existing local preflight does not report the collision.\n\n## Root cause hypothesis\n\nRelease metadata drift checks keep version-bearing files aligned with each other but do not bind the declared version to Git tag identity. Post-release feature commits can therefore remain internally consistent while reusing an immutable published version.\n\n## Acceptance criteria\n\n- The canonical project version is 1.13.2 and every derived lock, package, Agent Plugin manifest, changelog, README, About, installation, and release surface is synchronized through the existing version source and drift guards.\n- Release preflight fails with a stable diagnostic when v{current_version} exists and resolves to a commit other than HEAD; tests cover the conflicting-tag, matching-tag, and not-yet-tagged cases without network access.\n- The guard does not require PyPI access and does not create, move, or delete tags.\n- A wheel and sdist built from the final checkout pass Twine, artifact-member, Agent Plugin schema/version, public-safety, and disposable venv/pipx install gates.\n- The installed v1.13.2 wheel exposes the exact four-tool minimal Agent Plugin default, the richer explicit profiles, the 2026-07-28 MCP discovery path, and the invalid-profile fail-closed guard from a neutral directory.\n- The complete non-network suite, network-marked suite, basic and strict Pyright, canonical quality gates, watcher resource subprocess regression, and repeated installed MCP RSS/file-descriptor/disk stress check pass.\n- Tag creation, push, publication, and deployment remain separate operator-authorized steps.\n\n## Planner constraints\n\n- CHANGELOG.md is runner-owned completion metadata. Exclude it from provider files, touched_files, implementation scope, and verification outputs.\n- Every task_contract.verification row must use class post_landing.\n- Implement the version/tag identity check in the shared release-preflight boundary and test the reusable behavior; do not add a one-off shell release wrapper.\n- Preserve the portable Agent Plugins 1.0 package shape and exact minimal profile.\n- Do not create or move v1.13.2, push, publish, or deploy in this task."
    resolution: "2026-08-11: prepared v1.13.2 with synchronized package, lock, README, and Agent Plugin metadata; added a fail-closed Git tag identity guard with conflicting, matching, missing, error, and empty-output coverage; the final local release matrix, artifact installation, MCP profiles, protocol discovery, and resource checks passed after bounded hybrid recovery from Autopilot command-classifier failures."
    done_summary: "Prepared the collision-safe v1.13.2 Agent Plugin hotfix; version surfaces and release identity enforcement are synchronized, with final artifact, installed-behavior, protocol, and resource validation recorded in the release run."
  - key: PALACE-SCOPE-RESOURCE-BOUNDARY
    summary: "Keep scoped palace operations isolated and resource-bounded"
    type: bug
    status: done
    priority: highest
    size: L
    section_id: storage_reliability
    assignee: bot
    description: "## Symptom\n\nA CLI invocation scoped with --palace can copy the default global knowledge graph into scoped backup and pre-optimize archives. A palace with two drawers and no local graph produced a 12 MB backup and restored a 62 MB graph whose digest matched the global graph. Repeated no-op mine runs load the embedding model and create then prune those archives. A ten-event watch run grew RSS from about 655 MB to about 910 MB while palace and model-cache disk usage stayed flat. Search results using the canonical macOS /private/tmp spelling cannot be read back through the equivalent /tmp spelling.\n\n## Steps to reproduce\n\n1. Create an isolated palace and distinct default-global and palace-local graph fixtures.\n2. Run the built wheel CLI with --palace through mine, no-op mine, backup, restore, search, read, and watch.\n3. Compare archive members and graph digests, archive directory size, canonical source paths, process RSS after warm-up, and process shutdown.\n\n## Scope\n\nFix the shared palace-scope and lifecycle boundaries used by CLI backup, restore, mining, optimization, reader path resolution, and watcher remine cycles. Cover the reusable APIs and installed CLI behavior. Preserve archive safety and ambiguous-path rejection.\n\n## Expected vs actual\n\nExpected: explicit palace selection is a complete data boundary; absent local state is omitted; no-op work creates no backup or optimization churn; equivalent canonical paths round-trip; repeated watcher updates have bounded memory and disk use after warm-up.\nActual: scoped operations read global graph state, no-op work creates large archives and model churn, equivalent macOS paths diverge, and watcher RSS grows materially per event.\n\n## Root cause hypothesis\n\nThe backup API defaults an omitted graph path to process-global state, callers do not bind graph scope to the selected palace, incremental orchestration performs expensive lifecycle work before proving a delta exists, path identity is normalized incompletely, and watcher cycles retain per-mine state.\n\n## Acceptance criteria\n\n- Explicit --palace backup and pre-optimize paths include only that palace local graph, or omit the graph when absent; tests use distinct global and local digests and fail on cross-scope reads.\n- Restore round-trips the scoped archive without importing default-global graph data.\n- A true no-op incremental mine does not load the embedder, create an archive, optimize storage, or increase palace disk usage.\n- Search-to-read accepts filesystem-equivalent canonical spellings such as macOS /tmp and /private/tmp while retaining traversal, ambiguity, and external-path guards.\n- A real subprocess watcher stress test exercises at least 20 sequential edits and asserts bounded post-warm-up RSS, file descriptors where observable, palace size, archive count, and clean SIGINT shutdown.\n- Installed-wheel CLI regression coverage exercises init, mine, no-op mine, backup, restore, search, read, and watch outside the repository working directory.\n- Document measured before and after resource evidence and exact reproduction commands in a public-safe quality artifact."
    resolution: "2026-08-10: completed through reviewed Autopilot implementation plus bounded hybrid recovery; explicit palace KG isolation, no-op preflight, macOS path aliasing, watcher-owned model lifecycle, a real 20-event resource regression, and an installed-wheel golden workflow landed; task-closure snapshot: 2953 non-network tests and 2 network tests passed alongside Pyright basic/strict, public safety, quality/architecture/docs/performance, build/Twine/artifact inspection, pipx installation, and the installed CLI workflow; watcher RSS growth fell from 346.11 MiB to 5.94 MiB, file descriptors stayed at 190, and late combined palace-plus-backup disk growth was 40 bytes"
    done_summary: "completed through reviewed Autopilot implementation plus bounded hybrid recovery; scoped storage and no-op lifecycle boundaries, canonical path round-tripping, bounded watcher resources, and installed-wheel end-to-end behavior are enforced; watcher RSS growth fell from 346.11 MiB to 5.94 MiB with file descriptors at 190 and late combined disk growth of 40 bytes"
  - key: AUTOPILOT-DEMO-END-TO-END-GATE-CLOSURE
    summary: "Make demo quality claims enforce built artifacts and installed behavior"
    type: bug
    status: done
    priority: highest
    size: L
    section_id: autopilot_demo
    assignee: bot
    description: "## Symptom\n\nThe completed AUTOPILOT-DEMO backlog claims stronger release and verification gates, but the live enforcement topology and built artifacts disagree. Autopilot runs only Ruff, Ruff format, and pytest; CI and the verification instructions claim additional Pyright, public-safety, scorecard, docs, architecture, and performance gates. The committed public-safety scan currently fails on its own test fixture. Basic Pyright reports ten errors. The source distribution includes a tracked local-only .codex-local artifact. The repository pipx smoke assumes sys.executable -m pipx and fails under a valid Homebrew layout although the external pipx executable works.\n\n## Steps to reproduce\n\n1. Compare the commands in autopilot.toml, CI workflows, verification instructions, release documentation, and the quality scorecard.\n2. Run basic and strict Pyright, public_safety_scan.py --committed --tracked --staged, all scorecard and drift checks, package build, twine check, archive-content inspection, neutral-directory venv install, and pipx install smoke.\n3. Audit every archived AUTOPILOT-DEMO item against the roadmap promises of measurable delta, stronger automated gate, public-safe explanation, and real CLI, MCP, or API evidence where behavior changed.\n\n## Scope\n\nCreate one canonical release and quality gate topology consumed or mechanically checked by Autopilot, CI, local verification, scorecard generation, and release smoke. Close current failures at their shared boundaries. Validate built wheel and sdist behavior without source-tree shadowing. Produce an evidence ledger for all AUTOPILOT-DEMO items; fix systemic enforcement gaps rather than rewriting historical summaries.\n\n## Expected vs actual\n\nExpected: each claimed gate is executable, green, aligned across entry points, and proves the distributable artifact and installed behavior.\nActual: claimed gates can be bypassed by Autopilot, several are red, package contents leak local-only material, and the pipx smoke rejects a supported environment.\n\n## Root cause hypothesis\n\nGate definitions are duplicated across configuration, workflow, docs, and scorecard code; checks focus on source-tree fixtures instead of built-artifact boundaries; packaging has no explicit public allowlist; install smoke couples pipx invocation to the target interpreter.\n\n## Acceptance criteria\n\n- One canonical command inventory, or an equivalent parity fitness test, keeps Autopilot, CI, local verification, scorecard metadata, and release documentation aligned for Ruff, formatting, basic and strict Pyright, the complete intended pytest marker set, public safety, scorecard, docs drift, architecture, performance, package build, artifact inspection, and installed smoke.\n- Basic and strict Pyright pass from the declared environment with optional-dependency handling documented and tested.\n- Public-safety tracked, staged, and committed modes pass the repository while scanner fixtures still prove secret detection without committing a scanner-triggering literal.\n- Wheel and sdist content checks reject local-only control artifacts including .codex-local, task state, protocol state, caches, and operator audit residue; both artifacts pass twine check.\n- The release install smoke discovers and invokes a working pipx executable independently of the target Python module set, covers the Homebrew layout, and also validates an isolated venv from the wheel.\n- Installed CLI and MCP checks run from a neutral directory and prove import provenance points to the built artifact rather than the checkout.\n- Audit every AUTOPILOT-DEMO archived item against the quality roadmap and commit a public-safe pass/gap ledger with exact commands, before and after metrics, behavioral evidence, and the enforcing gate.\n- A single documented release-readiness command fails when any canonical gate or artifact check fails and passes after remediation.\n\n## Planner constraints\n\n- CHANGELOG.md is runner-owned completion metadata. Exclude it from provider files, touched_files, implementation scope, and verification outputs.\n- autopilot.toml is an ignored local configuration input for this task. Read it for parity evidence but do not plan, edit, stage, or publish it. Enforce the shared contract through tracked scripts, tests, CI configuration, release documentation, or other tracked public paths.\n- Put public evidence in a tracked docs/quality or docs/task-evidence path. Do not use ignored or task-local output paths as release evidence."
    resolution: "2026-08-10: completed through reviewed Autopilot implementation plus bounded hybrid recovery after terminal-result contract rejection; landed commits 99c24c3..c6bc04f; task-closure snapshot at c6bc04f: canonical gates, built wheel/sdist inspection, Twine, disposable venv/pipx install, Pyright basic/strict, public safety, quality/architecture/docs/performance, 2900 non-network tests, 2 slow tests, and 2 network tests passed"
    done_summary: "completed through reviewed Autopilot implementation plus bounded hybrid recovery after terminal-result contract rejection; landed commits 99c24c3..c6bc04f; the task-closure snapshot at c6bc04f passed canonical quality, artifact, install, and test gates"
  - key: RELEASE-VERSION-COUPLED-UPDATER-FIXTURES
    summary: "Decouple updater release fixtures from the package version"
    type: bug
    status: done
    priority: high
    size: S
    section_id: quality
    assignee: bot
    description: "## Symptom\n\nBumping project.version from 1.12.1 to 1.13.0 makes the updater eligibility and rollback suite fail because tests/test_updater.py hard-codes 1.12.1 as the installed version and 1.12.2 as the eligible target.\n\n## Steps to reproduce\n\n1. Update pyproject.toml and uv.lock to 1.13.0.\n2. Run python -m pytest tests/ -x -q -m \"not needs_network\".\n3. Observe TestUpdateStatus.test_status_reports_eligibility_provenance_and_next_run_without_mutation fail because the hard-coded target is older than the package version.\n\n## Scope\n\nReplace release-coupled updater fixtures and assertions with versions derived from the package version. Preserve stable same-major target selection, prerelease rejection, incompatible-major rejection, install command construction, and rollback coverage.\n\n## Expected vs actual\n\nExpected: an ordinary version bump keeps updater tests meaningful without manual search-and-replace.\nActual: every release bump invalidates the fixture and produces a false eligibility failure.\n\n## Root cause hypothesis\n\nThe updater fixture encodes one historical release transition instead of deriving current, next-patch, prerelease, and incompatible-major cases from mempalace_code.__version__.\n\n## Acceptance criteria\n\n- tests/test_updater.py derives current, eligible next-patch, prerelease, and incompatible-major versions from the package version.\n- Eligibility, install command, rollback, prerelease rejection, and compatible-major assertions remain explicit.\n- No production updater behavior changes.\n- The updater module, release metadata tests, and complete not-needs_network suite pass for v1.13.0."
    resolution: "2026-08-10: derived current, eligible next-patch, prerelease, and incompatible-major updater fixtures from the package version without production changes; task-closure snapshot recorded in release-prep commit 1bab66a: 39 focused updater tests, the complete non-network suite (2952 passed, 3 skipped, 2 deselected), and both network tests passed for v1.13.0"
    done_summary: "derived release fixtures from the package version; the task-closure snapshot recorded in release-prep commit 1bab66a passed 39 focused updater tests, 2952 non-network tests, and 2 network tests for v1.13.0"
  - key: UPDATE-SCHEDULER-SELF-CONTAINED-NOOP
    summary: "Keep systemd-user auto-updates self-contained and healthy when current"
    type: bug
    status: done
    priority: highest
    size: L
    section_id: quality
    assignee: bot
    labels: [updater, systemd, reliability, hotfix]
    description: "## Symptom\n\nThe opt-in Linux systemd-user auto-update path is enabled but cannot complete reliably for supported isolated installs. A uv-tool installation ran the daily timer for 20 consecutive days and failed before mutation because the generated service did not make the absolute package manager executable discoverable under the systemd user-manager PATH. After supplying that PATH operationally, an already-current scheduled run still exited with code 2 and left the oneshot service failed.\n\n## Steps to reproduce\n\n1. Install mempalace-code as a uv tool with uv under the user-local bin directory.\n2. Install the generated systemd-user scheduler and run the service under the default user-manager environment.\n3. Observe preflight report that the uv tool environment exists but the uv executable is unavailable.\n4. Add the manager directory to PATH, update to the latest release, and start the service again.\n5. Observe the exact no-newer-stable-wheel result exit nonzero and mark the service failed.\n\n## Scope\n\nMake generated systemd-user update units self-contained for every supported isolated installer and make an already-current scheduled execution a successful no-op. Preserve the updater's watcher coordination, exclusive lease, provenance checks, rollback, disk and backup gates, and fail-closed behavior for real errors. Cover installed-artifact and service-shaped behavior; do not encode a host-specific path or suppress all preflight exit codes.\n\n## Expected vs actual\n\nExpected: the installed scheduler locates the same supported manager that was admitted at install time; a daily run with no eligible release exits zero without touching the watcher, package, state, log, lease, or palace; actionable failures remain nonzero.\nActual: the generated service depends on an ambient PATH that omits the user-local manager, and the ordinary already-current state is reported as a failed systemd service.\n\n## Root cause hypothesis\n\nScheduler rendering records only the package Python in ExecStart while installation detection later re-discovers uv or pipx through PATH. The systemd user manager has a narrower environment than the interactive shell. UpdateManager.apply also routes every ineligible provenance result through one preflight error path and does not distinguish the exact scheduled already-current case from failures.\n\n## Acceptance criteria\n\n- Generated Linux systemd-user units make the admitted absolute uv or pipx manager discoverable without inheriting an arbitrary interactive-shell PATH; tests cover both supported installers and paths containing characters that require unit escaping.\n- apply(scheduled=True) returns ok with exit code 0 and a stable up-to-date stage only for the exact already-current stable-wheel result.\n- The scheduled up-to-date path does not stop or restart a watcher, acquire the exclusive update lease, invoke an installer, write update state or logs, or touch palace data.\n- Manual apply with no eligible target retains its explicit refusal, and scheduled network/provenance, unsupported-install, unsafe-watcher, missing-extra, disk, backup, and lock failures remain nonzero and observable.\n- A service-shaped regression proves a generated unit succeeds with a minimal systemd user-manager environment and remains fail-closed for a missing manager or unexpected provenance result.\n- The update runbook documents successful scheduled no-op semantics and self-contained manager discovery.\n- Focused updater tests, the complete non-network suite, release-readiness build/Twine/member/install gates, and a clean Linux systemd-user control run pass.\n\n## Planner constraints\n\n- CHANGELOG.md is runner-owned completion metadata. Exclude it from provider files, touched_files, implementation scope, and verification outputs.\n- Do not edit ignored autopilot.toml or host-specific operational overrides.\n- Prefer the smallest durable contract change in updater rendering and transaction semantics; do not introduce a wrapper daemon, cron path, or machine-wide service."
    resolution: "2026-08-10: Implemented self-contained uv/pipx scheduler PATH rendering, fail-closed unit/provenance validation, and zero-effect scheduled current no-op; focused, full non-network, network, static, performance, and leak checks passed."
    done_summary: "Implemented self-contained uv/pipx scheduler PATH rendering, fail-closed unit/provenance validation, and zero-effect scheduled current no-op; focused, full non-network, network, static, performance, and leak checks passed."
  - key: AGENT-PLUGINS-PORTABLE-PACKAGE
    summary: "Ship a portable Agent Plugins package for MemPalace"
    type: feature
    status: done
    priority: high
    size: M
    section_id: mcp_developer_tools
    assignee: bot
    labels: [agent-plugins, mcp, distribution, compatibility]
    description: "## Problem\n\nmempalace-code currently requires client-specific MCP registration plus manual copying of usage rules. Agent Plugins 1.0.0 provides a portable package for an MCP server and Agent Skill, but the project ships no conformant plugin directory or stable portable MCP launcher. Existing examples also default to all tools, increasing tool-schema cost for clients that only need core memory operations.\n\n## Scope\n\nShip a standards-conformant Agent Plugins 1.0.0 package for mempalace-code. Package the MCP connection and a concise LLM-execution skill derived from the canonical usage rules. Provide a stable installed launcher with no source-tree PYTHONPATH or machine-specific absolute path. Use the minimal MCP profile as the portable default and preserve explicit existing profile/tool selection outside the portable default.\n\n## Non-goals\n\n- Implementing an Agent Plugins marketplace, installer, updater, or OAuth flow.\n- Adding Agent Plugins client support to Autopilot.\n- Publishing the full 29-tool MCP surface by default.\n- Replacing existing direct Claude, Codex, or generic MCP registration paths.\n- Creating client-specific Codex or Claude plugin formats in place of the portable Agent Plugins package.\n\n## Acceptance criteria\n\n- A canonical installed plugin directory contains root plugin.json, mcp.json, and skills/mempalace/SKILL.md conforming to Agent Plugins 1.0.0.\n- plugin.json and mcp.json use the pinned canonical 1.0.0 schema identifiers and pass offline schema validation; any vendored schema carries required license attribution.\n- mcp.json declares stdio explicitly and launches the installed package without absolute paths, checkout-only imports, shell command strings, runtime network installation, or embedded credentials.\n- The portable default exposes exactly mempalace_status, mempalace_search, mempalace_check_duplicate, and mempalace_add_drawer through --profile=minimal.\n- The bundled skill is concise and executable by an LLM, references only tools in the minimal profile, defines search/write triggers and secret/deletion guards, and is mechanically checked against the canonical minimal profile to prevent drift.\n- The wheel and sdist include the complete plugin directory; a neutral-directory installed-wheel test locates the plugin, validates both manifests, starts its declared MCP command, completes initialize and tools/list, and proves source-checkout shadowing is absent.\n- Plugin paths and subprocess containment comply with Agent Plugins rules; plugin metadata contains no secrets and does not rely on unspecified ambient variables beyond resolving the installed launcher.\n- One documented command prints or locates the installed Agent Plugin directory for compatible clients, with direct MCP registration retained as a supported fallback.\n- README, agent installation guidance, package-content gates, and release documentation describe the portable package, minimal default, compatibility boundary, and explicit path to richer profiles.\n- Focused tests plus the canonical non-network release-readiness suite pass.\n\n## Files to touch\n\npyproject.toml; mempalace_code package data and CLI/launcher surfaces; the new Agent Plugins package directory; focused manifest/MCP/installed-artifact tests; package-content gates; README.md and docs/AGENT_INSTALL.md.\n\n## Planner constraints\n\n- CHANGELOG.md is runner-owned completion metadata. Exclude it from provider files, touched_files, implementation scope, and verification outputs.\n- Every task_contract.verification row must use class post_landing. The plan contract validator rejects provider and every other verification class.\n- Run installed-artifact and MCP protocol checks after landing through post_landing verification.\n- Keep the portable default bound to the existing minimal profile and its exact four-tool allowlist; do not duplicate profile selection logic."
    resolution: "2026-08-11: Shipped a portable Agent Plugins 1.0.0 package with an installed stdio launcher, exact four-tool minimal MCP default, packaged LLM skill, offline schemas and attribution, wheel/sdist and installed-artifact gates, version and secret drift guards, and user-facing documentation; canonical release readiness, committed preflight, 3006 non-network tests, and independent follow-up review passed through bounded hybrid recovery after Autopilot command-classifier and source-proof finalization blockers."
