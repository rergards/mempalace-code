items:
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Make hosted ARM installer smoke establish its owned identity"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, installer, rule-zero]
    description: "## Symptom\n\nGitHub run 33328559281 job 99302917340 failed before the installed application smoke could be observed: /home/mempalace-ci-33328559281-1/.mempalace-release-smoke.identity was absent, then cleanup reported the missing timer/mail spool.\n\n## Steps to reproduce\n\nRun the installed-application job on ubuntu-24.04-arm for the exact candidate wheel and observe the identity handshake before --all-installers.\n\n## Scope\n\nReuse the existing installed-application workflow and release_install_metadata_smoke.py owner. Inspect the prior REL-LINUX-ARM-INSTALLER-HANDSHAKE attempt branches and native ARM receipt before writing. Fix the earliest proven failing boundary; do not weaken identity/process-group/cleanup checks or add arbitrary sleeps.\n\n## Expected vs actual\n\nExpected: the disposable user atomically publishes its identity, runs all installer and golden contours, and is fully removed. Actual: the owner process exits or races before the identity file is available.\n\n## Root cause hypothesis\n\nThe hosted ARM launcher/identity handshake has a scheduling or executable-access assumption not exercised by the prior native receipt.\n\n## Acceptance criteria\n\n- Hosted Ubuntu 24.04 ARM64 reaches and completes all supported installer and golden rows for the exact wheel.\n- Identity is atomic, owned by the disposable uid, tied to the expected process group and interpreter, and bounded by an explicit deadline.\n- Early child failure reports its sanitized primary diagnostic instead of a secondary missing-file error.\n- Timer, user, process group, stage directory, identity files, and package artifacts are absent after success and failure.\n- Focused workflow/smoke tests, shell/static checks, public safety, and native or hosted ARM evidence pass."
  - key: REL-LINUX-SANITIZER-PATH-BOUNDARY
    summary: "Preserve executable recovery commands while redacting Linux temp paths"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux, drunk-path, rule-zero]
    description: "## Symptom\n\nAll hosted Python test jobs in run 33328559281 failed test_installed_custom_models_enospc_has_one_owned_tmpdir_retry because Linux tempfile root /tmp was substring-replaced inside TMPDIR=\"$HOME/.cache/mempalace/tmp\", producing a non-executable [REDACTED-PATH] recovery command.\n\n## Steps to reproduce\n\nRun TMPDIR=/tmp python -m pytest tests/test_release_readiness_gate.py::test_installed_custom_models_enospc_has_one_owned_tmpdir_retry -q.\n\n## Scope\n\nExtend the existing release_install_metadata_smoke.sanitize owner with path-boundary-aware explicit local-path replacement. Do not add a second sanitizer, a new mode, or a special-case recovery string.\n\n## Expected vs actual\n\nExpected: concrete /tmp/private-build is redacted and the literal $HOME/.cache/mempalace/tmp recovery path remains copy-pasteable exactly once. Actual: both are redacted by raw substring replacement.\n\n## Root cause hypothesis\n\nExplicit local paths are sanitized with str.replace without token/path boundaries.\n\n## Acceptance criteria\n\n- The exact TMPDIR=/tmp reproduction passes.\n- Concrete /tmp and other configured local paths remain redacted at path boundaries, including punctuation and end-of-string cases.\n- Embedded suffixes such as $HOME/.cache/mempalace/tmp remain unchanged.\n- The ENOSPC diagnostic retains one status, one executable recovery command, no private path, and bounded output.\n- Focused sanitizer/readiness/status tests, Ruff, formatting, and full non-network tests pass."
  - key: REL-CHANGELOG-PUBLIC-TRUTH
    summary: "Make the v1.13.5 changelog truthful at publication"
    type: task
    status: open
    priority: low
    size: XS
    section_id: pre_release
    labels: [release-blocker, documentation, drunk-llm]
    description: "## Scope\n\nImmediately before the final public candidate, update the existing v1.13.5 CHANGELOG.md header to the actual publication date and remove the v1.0.0 bullet that names docs/STORAGE.md, a file absent from the tracked history. Reuse CHANGELOG.md; do not create a replacement storage document or change historical feature claims.\n\n## Acceptance criteria\n\n- The v1.13.5 header contains the actual local publication date and remains the only header for that version.\n- The nonexistent docs/STORAGE.md path is absent while the rest of the v1.0.0 historical entry is unchanged.\n- Changelog shape tests, docs drift, public safety, and git diff checks pass.\n- The final wheel and sdist expose the corrected changelog and contain no private or local-only paths."
