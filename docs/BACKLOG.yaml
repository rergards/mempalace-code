items:
  - key: RELEASE-DIRECT-INSTALLED-APP-GATE
    summary: "Make direct exact-wheel application exercise the installed release gate"
    type: task
    status: open
    priority: highest
    size: L
    section_id: pre_release
    description: "## Goal\n\nRequire the existing release-readiness owner to execute the exact candidate wheel as installed applications and fail closed on any declared public surface without direct evidence.\n\n## Completed evidence\n\n- The installed-golden owner runs 26 ordered direct exact-wheel rows without pytest or test-module execution.\n- Installed argparse discovery reconciles 43 CLI command and mode members to direct candidate-console execution.\n- All five MCP profiles and 29 installed tools have direct semantic JSON-RPC evidence, palace-local post-state, and protected-root isolation.\n- Canonical venv, bootstrap-venv, pipx, and uv-tool contours install the exact wheel and prove metadata, import provenance, CLI version, alias, Agent Plugin, ordinary LanceDB runtime, recovery refusals, network denial, and disposable cleanup.\n\n## Scope\n\nReuse scripts/release_readiness_gate.py, scripts/release_install_metadata_smoke.py, their provenance/isolation/subprocess/result owners, and the existing hosted release workflow. Complete one independently testable residual at a time. Do not add a second runner, gate row, catalog, service, durable state owner, dependency unrelated to the declared extras, AI-client call, credential access, publication, tag, push, or remote mutation.\n\n## Acceptance criteria\n\n- AC-1: Install and directly exercise each declared optional extra and the public installed import surface through the existing installer-smoke owner. The smallest valid behavior or intended refusal must prove each extra; import success alone is insufficient where a public behavior exists.\n- AC-2: On a supported Linux user session, run the exact installed candidate through confirmed systemd-user scheduler install, status, and removal plus safe update-apply behavior. Record semantic post-state and cleanup. Unavailable systemd-user support must emit blocking UNRUN.\n\n## Continuation\n\nOptional extras and public installed imports are next. The Linux systemd-user contour follows after that residual is independently qualified and archived."
    assignee: locked
  - key: RELEASE-DIRECT-INSTALLED-LINUX-SYSTEMD
    summary: "Qualify exact-wheel Linux systemd-user update lifecycle"
    type: task
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Scope\n\nExtend the existing exact-wheel installer smoke, updater, and Ubuntu installed-application job to qualify the supported Linux systemd-user scheduler and safe update lifecycle from the exact candidate. The installer smoke remains the lifecycle evidence owner and blocks the existing release-required aggregate. Use one disposable Linux user whose systemd-user manager and HOME share an ownership boundary. Refuse before mutation for foreign, ambiguous, partial, symlinked, non-regular, escaped, or wrong-owner unit paths. Reuse current candidate provenance, credential-free environments, update and scheduler commands, semantic post-state, cleanup, sanitization, subprocess bounds, and aggregate job result. Do not add a second runner, gate row, service manager, updater, package manager, durable state owner, AI-client call, credential access, publication, tag, or unrelated remote mutation.\n\n## Acceptance criteria\n\n- AC-1: On supported Linux with functional systemd --user and matching HOME, install the exact candidate and directly exercise scheduler install, status, repeat, and removal through the installed executable. Prove candidate provenance, fragment path and content, enabled and active semantics, and complete cleanup.\n- AC-2: Existing canonical unit paths with non-matching content, partial ownership, symlinks, non-regular files, foreign uid, path escape, or an incongruent manager and HOME boundary refuse before write, enable, disable, delete, or daemon reload. Matching owned files support bounded idempotent install and removal.\n- AC-3: Directly exercise update status, confirmation refusal, and confirmed safe update apply behavior. Require bounded noninteractive behavior, exact semantic result, and no credential or AI-client access. A deterministic unpublished-candidate or blocked-network result is valid only when it proves zero package and user-unit mutation.\n- AC-4: Preserve unsupported-platform and unavailable-systemd refusals. Missing supported Linux evidence remains blocking UNRUN with one recovery command; mocks, source-only tests, and non-Linux refusal evidence cannot pass it.\n- AC-5: Keep the existing release readiness gate and installed-golden row set unchanged. Require focused false-PASS and ownership regressions, affected and full suites, direct exact-installed Linux evidence in the current Ubuntu job, static workflow and public-safety gates, and independent correctness, security, and Rule Zero reviews.\n\n## Current evidence\n\nThe exact candidate wheel SHA-256 is 48eba064520a75afbfec266caa197c9cd3f50445b86923caa1bbfe90977e29cf. It passed all 26 direct installed-golden rows offline. The full source suite passed 4,234 tests with 4 skipped and 2 deselected; focused, artifact, public-safety, secret, static, workflow, and independent reviews passed. Non-Linux release-readiness passed every supported installer surface and correctly retained the Linux lifecycle result as UNRUN. A bounded local Linux attempt exhausted its available memory before complete lifecycle evidence, so it cannot establish PASS or product FAIL.\n\n## Next action\n\nRun the unchanged public installed-application job for the exact pushed candidate commit. Require one terminal release-required PASS with all four installers, linux_systemd_update_lifecycle=pass, and complete disposable-user cleanup. A hosted PASS closes this residual. A hosted out-of-memory or nonzero lifecycle result blocks closure and requires a separate architecture or operations decision. Recovery: delete only the remote candidate branch and retain blocking UNRUN; do not create a tag or publication.\n\n## Hosted failure — 2026-08-27\n\nExact candidate SHA `52ca56703217ffa938a543f250dcdd2bf7470ed6` reached the cache-miss bootstrap and exact-wheel provisioning in public run `33098437503`, then failed before the smoke script started: the disposable user could not open `scripts/release_install_metadata_smoke.py` through the private GitHub workspace path. Repair only the existing workflow staging boundary: materialize the exact read-only smoke script and wheel in one disposable user-readable contour, prove regular-file identity and readability before invocation, preserve credential-free `env -i`, and remove the contour in the existing cleanup path. Do not chmod the checkout, weaken exact-wheel provenance, add a job, or claim lifecycle PASS until the terminal aggregate and cleanup pass. Recovery: remove only the staged contour and disposable user, then rerun the same installed-application job.\n\n## Current attempt boundary\n\nChange only `.github/workflows/ci.yml`, the existing workflow-admission regression in `tests/test_release_workflow_admission.py`, and deterministic `docs/quality/scorecard.{md,json}` output required by the existing scorecard owner. Stage the exact script and wheel under an atomically created `mktemp -d /var/tmp/mempalace-installed-application.XXXXXX` contour because paths beneath `/home/runner` may remain untraversable to the disposable user. Preserve the wheel's canonical basename; renaming it to `candidate.whl` or another non-wheel filename is invalid. Prove source/staged byte identity, regular non-symlink files, root ownership, read-only modes, disposable-user readability, exact-file cleanup without recursive deletion, and unchanged credential-free invocation. Do not change `scripts/release_install_metadata_smoke.py`, product code, installer orchestration, release docs, scorecard logic, job topology, or manager coverage. The prior local OOM is not evidence for an orchestration change; only a hosted OOM after the staging repair may reopen that decision.\n\n## Hosted rerun — 2026-08-27\n\nPublic Tests run `33108172230` on exact SHA `bb4713598c68c5cca249be61b4fa65ce6ef61ac4` passed cache bootstrap, build/provisioning, lint, package, typecheck, Chroma migration, dependency, Gitleaks, and Python 3.11/3.12/3.13. The installed-application step entered the existing four-installer smoke and was canceled after 7m40 without terminal JSON; the public annotation says only `The operation was canceled`. This is blocking UNKNOWN: it neither proves a staging/product failure nor lifecycle PASS. Python 3.14 failed concurrently in pytest and is tracked separately. Recovery: reproduce the exact installed step on a supported Linux runner with captured terminal output, then require all four installer receipts, `linux_systemd_update_lifecycle=pass`, and complete user/staging cleanup before closure.\n\n## Hosted rerun — 2026-08-28\n\nPublic Tests run `33177897530` on exact SHA `18f224afd48b8a7413ea48783992e2c365ba6dc8` passed staging, readability, exact-wheel build/provisioning, lint, package, typecheck, Gitleaks, dependency, and Python 3.11/3.12/3.13. The installed-application job started the existing all-installers smoke at about 14:00:45 and produced no terminal lifecycle JSON. Cleanup later reported `Failed to disable unit: Unit file mempalace-update.timer does not exist`, then `userdel: user mempalace-ci-33177897530-1 is currently used by process 2633`, followed by `disposable systemd-user or staging cleanup failed` and GitHub cancellation. The job-level timeout is 45 minutes; the nested smoke default subprocess bound is 300 seconds and dependency installation bound is 600 seconds. Current result is blocking UNKNOWN: staging is fixed, while exact evidence does not yet distinguish a live descendant retaining pipes/session from an idle/cancellation boundary or a cleanup ownership defect.\n\n## Current residual boundary — 2026-08-28\n\nReuse the existing installed-application workflow, `scripts/release_install_metadata_smoke.py` process owner, progress/result protocol, and disposable-user cleanup. Capture bounded phase progress and the exact descendant identity before cleanup so a degraded operator or LLM can see current phase, one recovery action, and terminal ownership. Preserve the four-installer contour, dependency/install timeouts, exact-wheel provenance, credential-free environment, product scheduler behavior, job topology, and release row set. Do not add a second runner, job, retry, timeout increase, AI client, credential probe, package-manager owner, or broad process cleanup. Cheapest falsifier: the same hosted job emits terminal installer/lifecycle JSON, `linux_systemd_update_lifecycle=pass`, and proves the disposable user and staged contour are absent; any surviving exact descendant or missing terminal phase remains release-blocking. Recovery: terminate only the exact disposable-user process tree after identity verification, remove its staged contour, and rerun the same installed-application job.\n\n## Independent review blockers — 2026-08-28\n\nCorrectness and Rule Zero reviews rejected provider commit fac27dbc because `_default_run_subprocess()` starts no dedicated process group/session, kills only the direct child on timeout, then calls unbounded `communicate()`. A descendant retaining stdout/stderr can therefore keep the smoke and outer cleanup blocked. Extend this existing subprocess owner to terminate and reap only its exact controlled group within a bounded teardown interval; preserve the original exit and timeout semantics. Cheapest falsifier: a child forks a descendant that retains both pipes, and the helper must return within the configured timeout plus bounded teardown.\n\nSecurity review also rejected the lifecycle boundary because `console_bin` accepts an existing absolute symlink, directory, FIFO, non-executable, or wrong-owner path, while `MEMPALACE_SOCKET_GUARD_LOADED` and `MEMPALACE_SOCKET_ATTEMPTS` accept arbitrary external paths; the attempts path can unlink an attacker-selected disposable-user file. Reuse the existing staging/lifecycle path owner. Require regular non-symlink executable identity and expected ownership for the installed console; constrain guard/attempt files to the owned disposable staging contour with regular non-symlink ownership checks before unlink/read/write. Cheapest falsifiers: a symlink/FIFO `console_bin`, and an attempts path to an existing file outside staging, must refuse without mutation. No new runner, helper family, job, timeout increase, retry, credential access, AI-client call, or broad cleanup. Recovery: remove only the exact disposable staging contour and rerun the three focused falsifiers plus the existing hosted job."
