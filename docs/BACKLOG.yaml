items:
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Repair the hosted ARM installer identity handshake"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nHosted ARM64 installed-application job 99121175976 in run 33260376052 fails before the application starts: the disposable-user launcher produces no `.mempalace-release-smoke.identity`, then cleanup reports secondary timer/mail-spool noise. Earlier runs 33202518999 and 33195680169 show the same boundary.\n\n## Steps to reproduce\n\nRun the existing `.github/workflows/ci.yml` disposable-user/systemd wrapper on native Ubuntu ARM64/Python 3.12 with the exact candidate wheel. Preserve bounded launcher stderr and exit status before reading the identity file.\n\n## Scope\n\nRepair the existing workflow launch/handshake and cleanup owner. Do not modify product installer behavior until evidence proves the installed script is reached. Do not add another gate, AI client, authentication, credential access, or raw unbounded log exposure.\n\n## Expected vs actual\n\nExpected: identity is atomically published, the real all-installers aggregate runs, and the exact user/systemd/staging state is cleaned. Actual: launcher exits before identity publication and the current workflow hides the primary cause behind `cat`.\n\n## Root cause hypothesis\n\nDecision-critical unknown inside the sudo/env/setsid/bash pre-handshake wrapper; current observability loses the child failure.\n\n## Acceptance criteria\n\n- AC-1: A first diagnostic reproduction identifies the inner cause before implementation.\n- AC-2: The smallest same-owner repair makes two consecutive native ARM wrapper runs reach the installed aggregate and clean all user, unit, process, and staging state.\n- AC-3: A forced pre-handshake failure reports bounded actionable state before any `cat`, and the hosted ARM job passes."
