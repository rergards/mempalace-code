items:
  - key: REL-CUSTOM-MODELS-LINUX-CPU-INSTALL
    summary: "Make CPU-only Linux custom-model installation bounded and recoverable"
    type: bug
    status: open
    priority: high
    size: XS
    section_id: pre_release
    description: "## Symptom\n\nOn Ubuntu 24.04 ARM64 CPU-only, a fresh install of the exact wheel with [custom-models] resolved PyTorch plus multi-gigabyte CUDA/NVIDIA dependencies, filled a 7.1 GiB temporary filesystem, and failed with Errno 28. The installed-golden gate reported only that the custom-models contour installation failed. The first repair also put a release-gate command using a source checkout and WHEEL variable into the ordinary agent installation path, where it cannot run.\n\n## Steps to reproduce\n\nRun the exact candidate wheel installed-golden gate on Ubuntu ARM64 with TMPDIR on a constrained filesystem, or install the wheel [custom-models] extra with fresh pip resolution from PyPI. Then inspect AGENTS.md, README.md, docs/AGENT_INSTALL.md, docs/OFFLINE_USAGE.md, and docs/RELEASING.md for executable authority and recovery consistency.\n\n## Scope\n\nExtend the existing custom-model documentation and installed-golden owner. Keep the default FastEmbed dependency graph unchanged. Add no external AI client, credential access, service, mode, or second release gate. Keep user/agent installation authority separate from source-checkout release qualification authority.\n\n## Expected vs actual\n\nExpected: CPU-only Linux users, installation agents, and release operators each get an executable CPU PyTorch contour, an explicit scratch-space requirement, and one recovery action valid in their environment. Actual: the one-step extra may select accelerator dependencies, the gate discards the decisive pip error, and the first agent-facing recovery assumes release-only files and variables.\n\n## Root cause hypothesis\n\nSentence Transformers requires PyTorch; the default PyPI Linux resolver may choose a build with CUDA/NVIDIA dependencies. Public instructions do not consistently name the official CPU wheel index or scratch-space recovery. install_extra replaces pip stderr with a generic exception. The first documentation repair treated user installation and release qualification as one authority.\n\n## Acceptance criteria\n\n- docs/OFFLINE_USAGE.md owns the canonical CPU-only Linux user installation and ENOSPC recovery; its commands require no repository checkout, release script, or WHEEL variable.\n- docs/AGENT_INSTALL.md gives an agent-executable equivalent or an unambiguous canonical handoff, states authority, and never sends an ordinary installer to a release-gate command.\n- README.md and AGENTS.md no longer present a bare one-step CPU-only Linux custom-model install as sufficient; they route users and agents to the canonical safe contour without duplicating a competing recovery.\n- docs/RELEASING.md separately owns exact-wheel qualification and may use the installed-golden gate plus WHEEL because that authority has a source checkout.\n- The existing installed-golden gate uses the documented CPU-only Linux contour without changing macOS behavior or the default dependency graph.\n- Optional-extra installation failures preserve a bounded, sanitized decisive diagnostic; Errno 28 emits current status and one exact retry command appropriate to release qualification.\n- Focused tests cover CPU-contour selection, ENOSPC recovery, output bounds, private-path redaction, all five documentation surfaces, and separation of user/agent from release recovery authority.\n- The exact rebuilt wheel passes installed-golden on macOS and Ubuntu ARM64; the default graph still excludes Torch, CUDA, NVIDIA, Triton, and Chroma.\n- Existing documentation, public-safety, artifact, static, and full non-network gates pass; no new gate is added.\n\n## Verified residual after integration\n\nRuntime CPU-contour behavior and sanitized diagnostics are already present in af0763e1. The user/agent authority split is integrated as 3b29f6ec. Focused docs and packaging tests pass. The only current failure is scripts/docs_drift_guard.py reporting that the README Optional extras block is missing custom-models. Extend only README.md and its existing docs-drift test with a non-executable custom-models comment that points to the canonical docs/OFFLINE_USAGE.md contour. Preserve the current sdist exclusions and every runtime, dependency, release-gate, workflow, and other documentation owner."
  - key: DOC-AGENT-EXTRAS-INVENTORY
    summary: "Synchronize the agent-facing optional-extra inventory"
    type: bug
    status: open
    priority: high
    size: XS
    section_id: pre_release
    description: "## Symptom\n\nAGENTS.md lists only the spellcheck optional extra although current package metadata also exposes custom-models, treesitter, watch, and the development extra. A tired or stale installation agent can infer an incomplete supported installation surface.\n\n## Steps to reproduce\n\nCompare the existing Optional extras section in AGENTS.md with project.optional-dependencies in pyproject.toml, then run the existing documentation drift guard.\n\n## Scope\n\nExtend the existing AGENTS.md optional-extra inventory and the existing documentation drift owner. Keep one inventory, distinguish development from runtime extras, and point custom-models to its canonical CPU-only Linux guide. Add no document, gate, dependency, installer, workflow, or runtime behavior.\n\n## Expected vs actual\n\nExpected: AGENTS.md names every supported extra in one unambiguous inventory and directs agents to the canonical safe custom-model path. Actual: only spellcheck is listed, while the package declares additional supported extras.\n\n## Root cause hypothesis\n\nThe package extras evolved while the agent-facing inventory and its missing-extra predicate remained incomplete.\n\n## Acceptance criteria\n\n- AGENTS.md has one concise optional-extra inventory synchronized with pyproject.toml.\n- The development extra remains clearly tied to development setup; runtime extras do not duplicate install procedures.\n- custom-models points to docs/OFFLINE_USAGE.md and does not expose a bare CPU-only Linux one-step install.\n- The existing docs drift guard rejects a missing or stale supported extra without creating a new gate.\n- Focused docs tests, docs drift, public safety, artifact checks, static checks, and full non-network tests pass.\n- No runtime, dependency, release workflow, credential, external AI client, or publication behavior changes."
