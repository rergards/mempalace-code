items:
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Repair the hosted ARM installer identity handshake"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nHosted ARM64 installed-application job 99121175976 in run 33260376052 failed before the application started: the disposable-user launcher produced no `.mempalace-release-smoke.identity`, then cleanup reported secondary timer/mail-spool noise. Earlier runs 33202518999 and 33195680169 showed the same boundary.\n\n## Diagnostic evidence\n\nCredential-free candidate run 33267484778 at exact SHA e20ef6924d35187c6f1675ae6c8d69a74e882c6a preserved bounded launcher stderr. ARM64 job 99140031166 and x64 job 99140031201 both failed on the same pre-handshake command: `test \"$(stat -c %a \"$2\")\" = 600`. The installed application was not reached. The existing wrapper relied on `umask 077` but the hosted identity temp file did not satisfy the required 0600 postcondition; the repair must set the required mode explicitly and retain the owner/mode checks before atomic publication.\n\n## Steps to reproduce\n\nRun the existing `.github/workflows/ci.yml` disposable-user/systemd wrapper on native Ubuntu ARM64/Python 3.12 with the exact candidate wheel. Preserve bounded launcher stderr and exit status before reading the identity file.\n\n## Scope\n\nRepair the existing workflow launch/handshake and cleanup owner. Do not modify product installer behavior: the evidence proves the installed script is not reached. Do not add another gate, AI client, authentication, credential access, or raw unbounded log exposure.\n\n## Expected vs actual\n\nExpected: identity is atomically published with owner and mode 0600, the real all-installers aggregate runs, and the exact user/systemd/staging state is cleaned. Actual: the temp identity mode postcondition fails before atomic publication on both hosted architectures.\n\n## Root cause\n\nThe wrapper treats `umask 077` as sufficient to establish the identity temp file mode. Hosted runners violate that assumed postcondition. The existing explicit owner/mode check correctly fails closed.\n\n## Acceptance criteria\n\n- AC-1: Satisfied by run 33267484778: bounded diagnostics identify the failing inner command before repair.\n- AC-2: The smallest same-owner repair makes two consecutive native ARM wrapper runs reach the installed aggregate and clean all user, unit, process, and staging state.\n- AC-3: A forced pre-handshake failure reports bounded actionable state before any `cat`, and the hosted ARM job passes."
