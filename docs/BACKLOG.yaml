items:
  - key: REL-LINUX-ARM-TORCH-CUDA-RESOLVER
    summary: "Qualify the minimal provenance fix and clean watcher-ready shutdown on native ARM"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: |
      ## Symptom

      Commit 91593424 is the minimal product fix. Exclusive no-follow creation refuses every
      pre-existing fixed provenance temporary before content write, including symlinks, hardlinks,
      FIFOs, directories, devices, and regular files. This closes the reported external-overwrite
      and irregular-entry class without changing the cache layout or supported runtime.

      The broader same-user path-exchange design is rejected. An actor able to mutate this cache
      can directly alter model, tokenizer, or provenance files after any validation, so hardening
      one JSON writer does not create an integrity boundary. The rejected +700/-63 candidate still
      had check-to-rename and check-to-unlink races, leaked a directory descriptor on exceptional
      validation, could leave tokenizer and provenance in a mixed state, and broke unqualified
      Windows provisioning. No part of that candidate is release material.

      ## Steps to reproduce

      Run the exact 1.13.5 wheel through the existing local installed-golden owner and the native
      Ubuntu 24 aarch64 installer, systemd-user, and installed-golden owners. Any non-green row or
      differing wheel hash leaves the task open. On exact wheel SHA-256
      7c88ea3113c6997a5b25d2cabc9bd28305f48cf9be4ed90b2af44c8b5ae85019, native
      ARM passed all four installer contours and the real systemd-user lifecycle, then the
      non-regular-source direct row exposed a startup race: immediate SIGINT after `watch-ready`
      reached `_emit_run_state` before the surrounding `KeyboardInterrupt` guard and printed a
      traceback instead of the normal clean stop summary.

      ## Scope

      Keep commit 91593424 as the complete provenance fix. In both existing watcher entry points,
      bring the `watch-ready` emission under the already-owned
      `try`/`except KeyboardInterrupt`/signal-restoration lifecycle and add the smallest existing-owner
      regression for immediate SIGINT at that boundary. Do not add a signal abstraction, platform
      branch, option, or release gate. Build one fresh exact 1.13.5 wheel from the final candidate
      SHA and qualify that identical wheel through the existing local and native Ubuntu 24 aarch64
      release owners.

      ## Acceptance criteria

      - The complete embedding-runtime owner, public-safety scan, Ruff, format, both Pyright
        contours, and full non-network suite pass at one final SHA.
      - A fresh exact 1.13.5 wheel passes all 26 local installed-golden application rows.
      - On native Ubuntu 24 aarch64 Python 3.12, the identical wheel passes venv,
        bootstrap-venv, pipx, uv-tool, Linux systemd-user lifecycle, and all 26 installed-golden
        rows with terminal ok true; real embedding, search, old-palace append, watcher exit, and
        disposable user/cache/root cleanup are observed.
      - Immediate SIGINT after each watcher emits `watch-ready` produces no traceback, restores
        installed signal handlers, and reports the normal clean stop summary.
      - The final default graph contains FastEmbed and ONNX and excludes Torch, CUDA, NVIDIA,
        Triton, Chroma extras, and ChromaDB. Existing compatibility, docs, security, artifact, and
        release gates pass at that SHA.

      ## Recovery

      Remove only disposable qualification roots, rebuild the exact wheel from the same SHA, and
      rerun `MEMPALACE_TEST_HF_HOME=<cache> python scripts/release_readiness_gate.py
      --installed-golden-wheel <wheel> --json` on native ARM. Do not resume the rejected provenance
      rewrite.
