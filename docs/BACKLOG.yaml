items:
  - key: AUTOPILOT-COMMIT-ATTRIBUTION-REPO-BOUNDARY
    summary: "Disable Autopilot commit attribution for this repository"
    type: bug
    status: open
    priority: highest
    size: XS
    section_id: immediate
    description: "## Symptom\n\n`autopilot config show --format json` resolves `commit_attribution.enabled=true` with a Claude Co-Authored-By trailer, while AGENTS.md forbids that trailer in every repository commit. Autopilot launch is unsafe until this is false.\n\n## Steps to reproduce\n\nFrom the exact v1.14.0 candidate checkout, run `autopilot config show --format json | jq .commit_attribution`.\n\n## Scope\n\nUse the existing Autopilot repository-config merge owner. Add only the smallest repo-local attribution override needed to disable trailers. Preserve the effective global profile and every phase model/effort route; add no model or profile override. This blocker may be repaired manually because Autopilot cannot safely commit its own enabling configuration.\n\n## Expected vs actual\n\nExpected: attribution disabled and no trailer instructions. Actual: default Claude co-author attribution is enabled.\n\n## Root cause hypothesis\n\nThe repository has no Autopilot config override, so the enabled default wins despite the public AGENTS.md boundary.\n\n## Acceptance criteria\n\n- AC-1: `autopilot config validate` passes and resolved `commit_attribution.enabled` is false.\n- AC-2: Resolved profile remains `operator-luna-sol` and the phase routing table is byte-equivalent before and after.\n- AC-3: No Claude Co-Authored-By trailer appears in new commits."
  - key: REL-CI-UPSTREAM-INVENTORY-CLEAN-CHECKOUT
    summary: "Make exact upstream inventory work in a public clean checkout"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nHosted Tests run 33260376052 at SHA 3f76fa5a0c363032505aae059bed6c5346a85162 fails lint, package, and all Python 3.11-3.14 test jobs because `git rev-list dfba59b0..a9f345cc` cannot resolve the upstream-only commits.\n\n## Steps to reproduce\n\nClone public branch `release/v1.14.0-public-final-20260829` with `--depth 1`; run `python scripts/upstream_comparison_guard.py`, `python scripts/release_preflight.py`, or the full non-network suite. The Linux suite reaches 4086 passed before `test_repository_manifest_and_document_agree` fails on the same invalid revision range.\n\n## Scope\n\nExtend the existing upstream comparison/CI preparation owner. Preserve exact 43-commit inventory validation and the live head check. Do not silently skip, weaken, or treat missing Git objects as PASS. Avoid repeated equivalent setup across jobs when one existing owner can provide the evidence at lower total cost.\n\n## Expected vs actual\n\nExpected: credential-free public clean checkout supplies or verifies the pinned exact upstream range. Actual: only the developer shared object store contains it, which masked the hosted failure.\n\n## Root cause hypothesis\n\nThe guard requires upstream Git objects, while GitHub Actions checks out only the fork and never obtains the canonical upstream range.\n\n## Acceptance criteria\n\n- AC-1: Fresh public shallow-clone guard and release preflight pass with exact inventory still enforced.\n- AC-2: Focused guard tests pass and the full hosted Python matrix, lint, and package jobs reach their later steps.\n- AC-3: Documentation accurately names any network boundary and one recovery command."
  - key: REL-MINILM-PUBLIC-CORPUS-PIN
    summary: "Move MiniLM compatibility corpus to a publicly reproducible commit"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nHosted x64 installed-application job 99121176043 stops before embedding with `pinned MiniLM compatibility commit is unavailable` for 3ad086bfd15bab032e86bef3e9deec207c13c17b.\n\n## Steps to reproduce\n\nFrom a fresh clone of `rergards/mempalace-code`, build/install the exact wheel and run `python benchmarks/code_retrieval_bench.py --check-minilm-runtime-compatibility`.\n\n## Scope\n\nExtend the existing benchmark contract in `benchmarks/retrieval_quality_facts.json` and its owning runner/tests. Select a commit already reachable from the public repository and remeasure the compatibility facts. Do not publish the old private/local commit, weaken missing-history refusal, substitute the current SHA without measurement, or claim the 469-chunk headline was rerun.\n\n## Expected vs actual\n\nExpected: the committed reproduction command runs from a public clean clone. Actual: the pin exists only on a local/private feature branch and is not an ancestor of the public candidate.\n\n## Root cause hypothesis\n\nThe historical benchmark commit was retained across the public-history squash without checking public reachability.\n\n## Acceptance criteria\n\n- AC-1: The pin resolves from a fresh public clone and no private commit or tree is published.\n- AC-2: The exact installed wheel runs the compatibility benchmark offline against the seeded MiniLM cache.\n- AC-3: Query and chunk counts plus R@5 and R@10 are measured and committed truthfully; focused tests and x64 installed-application pass."
