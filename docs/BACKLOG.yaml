items: [{key: REL-LINUX-X64-DIARY-SIGSEGV, summary: "Accept exact native Linux ONNX PCI discovery warning", type: bug, status: open, priority: highest, size: XS, section_id: quality, description: "## Symptom\n\nExact rc14 SHA c77b0502504fe52b390a88ed06f24640397c484e, Tests run 33512054608, failed native Linux x64 installed_golden_fetch_model after a successful cached-model command emitted the bounded ONNX Runtime GetPciBusId warning for /sys/devices/LNXSYSTM:00/LNXSYBUS:00/ACPI0004:00/VMBUS:00/<uuid>. Native ARM and all completed Python, package, lint, typecheck, dependency, and Gitleaks jobs passed.\n\n## Steps to reproduce\n\nRead public check-run annotations for job 99869880770 at exact SHA c77b0502504fe52b390a88ed06f24640397c484e. The installed command returned success; the release classifier rejected the VMBUS:00 sysfs topology.\n\n## Expected vs actual\n\nExpected: the existing exact full-message classifier accepts both observed Hyper-V device owners, MSFT1000:00 and VMBUS:00, after exit 0. Actual: its hardcoded MSFT1000:00 segment rejects the otherwise identical VMBUS:00 warning.\n\n## Root cause\n\nThe recent release diagnostic classifier was intentionally narrow but overfit the first observed sysfs topology. ONNX Runtime device_discovery.cc treats a non-PCI canonical target filename as optional metadata, logs the warning, and returns success.\n\n## Scope\n\nExtend only the existing regex path segment to an exact MSFT1000|VMBUS alternation and add one positive VMBUS case plus a hostile unobserved-owner case at the existing test owner. Preserve the full message, UUID backreference, Linux/native architecture, return-code, ANSI framing, newline, duplicate, extra-stderr, and unknown-path refusals. Regenerate only existing scorecard artifacts if line counts change.\n\n## Acceptance criteria\n\n- Exact successful MSFT1000:00 and VMBUS:00 warnings pass on supported native Linux architectures.\n- Unobserved owners, owner suffix drift, malformed paths/messages, nonzero exits, unsupported platforms/architectures, duplicate warnings, and extra stderr fail.\n- Focused, full non-network, static, public-safety, Gitleaks, artifact, direct installed, and fresh immutable exact-SHA hosted gates pass.\n- Release gates execute no external AI client and access no user credential.\n\n## Rule Zero\n\nThe existing compiled regex and parameterized tests are the sole owners. One exact alternation has lower total complexity than warning suppression, retry, runtime changes, or a second classifier. Cheapest falsifier: the exact VMBUS annotation still fails or an unobserved path owner passes. Recovery: restore the prior regex and inspect the next exact public annotation before any broader change."}]
