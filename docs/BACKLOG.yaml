items:
  - key: REL-LINUX-X64-DIARY-SIGSEGV
    summary: "Expose and resolve the hosted x64 MiniLM compatibility failure"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-x64, installed-golden, rule-zero]
    description: "## Symptom\n\nHosted native Ubuntu x64 MiniLM compatibility failed on rc4 (run 33328559281), rc5 (33399496356), and rc7 (33464799199 job 99722321144), while rc6 (33456968750 job 99698892809) passed that step and failed later in installed golden. The rc6 and rc7 workflow plus compatibility benchmark source are byte-identical. This is an intermittent or environment-sensitive release blocker, not a source regression between rc6 and rc7. The exact rc7 candidate passed hosted ARM, local macOS all-installers and 26-row golden, native ARM all-installers/systemd/26-row golden, and every other required hosted job.\n\n## Steps to reproduce\n\nRead the exact-SHA public job metadata for rc7 without authentication. Job 99722321144 fails at Verify pinned MiniLM runtime compatibility with exit 2. The anonymous step-log endpoint returns 404 and the current generic check annotation does not expose the bounded BenchError text.\n\n## Public evidence ceiling\n\nThe public Checks API exposes check-run metadata and annotations without authentication for public repositories, but the repository's sole credential-free release reader does not yet own those endpoints. An annotation ID alone does not prove the reviewed candidate SHA. Release preparation must not bypass the sterile reader with ambient curl, gh, cookies, tokens, or authenticated logs.\n\n## Root cause hypothesis\n\nUnknown. Candidate-source identity plus the alternating fail/fail/pass/fail hosted history proves environment sensitivity but does not distinguish cache/runtime load failure from vector shape, norm, cosine, matrix-delta, or neighbor-order failure. The earlier amd64-emulated diary signal and raw LanceDB control remain non-native evidence and cannot authorize a product fix.\n\n## Scope\n\nExtend the existing compatibility benchmark BenchError boundary and its focused tests so check-minilm-runtime-compatibility emits one bounded GitHub error annotation to stdout only when GITHUB_ACTIONS=true. Preserve existing local stderr byte-for-byte and exit 2. Annotate the exact existing bounded compatibility failure text. Never expose exception causes, traceback, paths, environment, or credentials. Keep every currently reachable compatibility annotation message below 640 characters; focused tests cover each failure category. Escape workflow-command percent, carriage-return, and newline characters. Emit no annotation on success or other benchmark modes.\n\nExtend the existing scripts/release_public_read.py sterile network owner and its focused tests with one closed-set check-run-annotations query and CLI operation. It accepts only the fixed public repository, a check-run ID bounded by 10**12, and an expected 40-hex SHA. It performs exactly two bounded credential-free GETs with no redirects/proxies/auth/cookies/retries: first verify the fixed x64 installed-application check name and exact head SHA from check-run metadata, then fetch page 1 with per_page=100. Reject a full page as incomplete. Require exactly one failure annotation with the static MiniLM title and bounded `ERROR: MiniLM` message; print only deterministic normalized expected SHA, check-run ID, fixed check name, annotation level, title, and message fields. Reject stale/wrong-SHA/wrong-name IDs, zero/negative/too-large IDs, empty/no-match/duplicate matches, alternate targets, malformed/extra-unbounded fields, redirects, and oversized responses. Document the one recovery command in docs/RELEASING.md. Regenerate the existing deterministic scorecard pair if test metrics change.\n\nAdd no workflow step, annotation framework, arbitrary URL/client, artifact, log retention, credential access, cache mutation, retry, dependency/model/threshold/runtime change, second gate, or new backlog item. Build a fresh immutable candidate and read its annotation through the existing public-reader owner. Only that native evidence may authorize a later smallest owning-path correction; replan before any runtime edit.\n\n## Acceptance criteria\n\n- Every currently reachable compatibility BenchError under GITHUB_ACTIONS=true retains current bounded stderr byte-for-byte and exit 2 and emits exactly one public-safe stdout annotation under 640 characters containing the exact existing bounded compatibility failure text and one recovery command.\n- Predicate-bearing and non-predicate compatibility failures are covered. Success, non-compatibility modes, and ordinary local execution emit no annotation. Percent, carriage-return, and newline characters cannot create another workflow command.\n- The public reader performs exactly two closed-set anonymous GETs for a realistic positive check-run ID and expected 40-hex SHA, proves fixed x64 check name plus exact head SHA, rejects alternate repositories/invalid IDs/stale or wrong SHA/wrong name/redirects/oversized or malformed responses, requires exactly one bounded matching failure annotation and complete pagination, sends no Authorization or Cookie header, and exposes one deterministic CLI command.\n- Focused benchmark and public-reader tests, path-specific Ruff/format for both changed owners, full non-network suite, configured Ruff/format, Pyright, architecture guard, docs drift, Gitleaks fixture smoke, scorecard, public safety, diff checks, changed-range Gitleaks, and full-history Gitleaks pass.\n- A fresh exact-SHA hosted x64 job exposes the bounded compatibility failure through `python scripts/release_public_read.py --check-run-annotations <CHECK_RUN_ID> --expect-sha <40-HEX-SHA>`. The task remains open until the proved owner is corrected or exact-SHA x64 installed-application and release-required both pass.\n- No external AI client, credential, API key, OAuth token, keychain, authenticated log endpoint, or paid-account state is accessed by any release gate.\n\nRecovery: `python scripts/release_public_read.py --check-run-annotations <CHECK_RUN_ID> --expect-sha <40-HEX-SHA>`, then replan only the correction justified by that annotation."
  - key: SEC-GITLEAKS-HISTORY-GATE
    summary: "Restore compact Gitleaks assurance guarantees"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, security, gitleaks, rule-zero]
    description: "## Symptom\n\nThe native changed-range and full-history scans remained intact after simplification, while machine-checked suppression rationale and the real-binary detector/redaction fixture were removed. That left two current release-assurance predicates unproved.\n\n## Steps to reproduce\n\nAt task opening, python scripts/gitleaks_scan.py validate-baseline and python scripts/gitleaks_scan.py fixture-smoke were absent, and an unreviewed exact-looking .gitleaksignore line passed the only generic uniqueness check. The compact local implementation now makes both commands executable; temporary-root tests reproduce malformed suppression and incomplete SARIF failures without changing repository policy.\n\n## Current status\n\nThe compact same-owner implementation is present locally and this release blocker remains open for parent qualification. scripts/gitleaks_scan.py now exposes validate-baseline and fixture-smoke; every scan validates suppression policy before invoking Gitleaks. The installed real binary has locally proved all five required classes with redacted disposable SARIF.\n\n## Scope\n\nKeep the existing native launcher, .gitleaksignore, tests, canonical gate inventory, quality scorecard, verify instructions, and the Gitleaks jobs in ci.yml, gitleaks-history.yml, and publish.yml as the only owners. Each exact fingerprint has strict adjacent JSON metadata with owner, rationale, and review_condition or nonexpired expiry. No current fingerprint value changes. fixture-smoke runs after the pinned installer and before the repository scan in all three workflows. validate-baseline stays an explicit manual command and is not duplicated as a workflow step. Imported Gitleaks config sources are forbidden.\n\n## Acceptance criteria\n\n- Orphan, incomplete, duplicate, expired, malformed, globbed, regex/broad, rule-disabled, imported, allowlisted, or ungoverned suppression input fails before a repository scan.\n- The parser and tests support any number of future reviewed exact fingerprints without literal fingerprint or count assertions.\n- Gitleaks exit 1 is fixture success only when bounded redacted SARIF proves PyPI token, GitHub token, AWS access key, private key, and mempalace-high-entropy-assignment filename/rule pairs.\n- Fixture source, worktree, and report live in a TemporaryDirectory outside the checkout and Gitleaks upload paths, are removed on success or failure, and never place complete generated values in retained SARIF, logs, or tracked source.\n- Exact ref validation, shallow-history rejection, changed-range and full-history behavior, pinned installation, redaction, SARIF uploads, bounded output, canonical command ownership, and all release gates remain intact.\n- Focused tests, real validate-baseline, real fixture-smoke, safe reachable changed-range, Actionlint, focused Ruff, gate inventory, scorecard freshness, working-tree Gitleaks, and public safety pass locally. Parent qualification owns full history, the full non-network suite, and hosted workflow evidence.\n\n## Rule Zero\n\nExtending the existing scanner, ignore, workflow, gate-inventory, and scorecard owners has the lowest total complexity and removal cost. Restoring the old wrapper, security/gitleaks-baseline.yml, PyYAML, release_direct_application_gate.py, workflow_security_gate.py, or deleted release machinery would recreate parallel owners and is forbidden. Cheapest falsifiers are an unreviewed temporary fingerprint rejected before _run, an imported config or allowlist rejected before scan, a missing or unredacted fixture SARIF class rejected after exit 1, and canonical installer-before-fixture-before-scan assertions.\n\n## Remaining closure evidence\n\nRun parent qualification and hosted workflows against the exact candidate SHA. Pinned detector rule-id drift fails closed by design; recover by reviewing the Gitleaks pin and expected filename/rule mapping, then update the mapping only when the maintained detector identity changed. Never weaken detection to make drift pass. Record the local Gitleaks version separately when it differs from tools/gitleaks/go.mod. Keep this item open until that evidence is complete."
