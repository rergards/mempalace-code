items:
  - key: RELEASE-DIRECT-INSTALLED-APP-GATE
    summary: "Make direct exact-wheel application exercise the installed release gate"
    type: task
    status: open
    priority: highest
    size: L
    section_id: pre_release
    description: "## Goal\n\nRequire the existing release-readiness owner to execute the exact candidate wheel as installed applications and fail closed on any declared public surface without direct evidence.\n\n## Completed evidence\n\n- The installed-golden owner runs 26 ordered direct exact-wheel rows without pytest or test-module execution.\n- Installed argparse discovery reconciles 43 CLI command and mode members to direct candidate-console execution.\n- All five MCP profiles and 29 installed tools have direct semantic JSON-RPC evidence, palace-local post-state, and protected-root isolation.\n- Canonical venv, bootstrap-venv, pipx, and uv-tool contours install the exact wheel and prove metadata, import provenance, CLI version, alias, Agent Plugin, ordinary LanceDB runtime, recovery refusals, network denial, and disposable cleanup.\n\n## Scope\n\nReuse scripts/release_readiness_gate.py, scripts/release_install_metadata_smoke.py, their provenance/isolation/subprocess/result owners, and the existing hosted release workflow. Complete one independently testable residual at a time. Do not add a second runner, gate row, catalog, service, durable state owner, dependency unrelated to the declared extras, AI-client call, credential access, publication, tag, push, or remote mutation.\n\n## Acceptance criteria\n\n- AC-1: Install and directly exercise each declared optional extra and the public installed import surface through the existing installer-smoke owner. The smallest valid behavior or intended refusal must prove each extra; import success alone is insufficient where a public behavior exists.\n- AC-2: On a supported Linux user session, run the exact installed candidate through confirmed systemd-user scheduler install, status, and removal plus safe update-apply behavior. Record semantic post-state and cleanup. Unavailable systemd-user support must emit blocking UNRUN.\n\n## Continuation\n\nOptional extras and public installed imports are next. The Linux systemd-user contour follows after that residual is independently qualified and archived."
    assignee: locked
  - key: RELEASE-DIRECT-INSTALLED-LINUX-SYSTEMD
    summary: "Qualify exact-wheel Linux systemd-user update lifecycle"
    type: task
    status: open
    priority: highest
    size: M
    section_id: pre_release
    assignee: bot
    description: "## Scope\n\nExtend the existing exact-wheel installer smoke, updater, and Ubuntu installed-application job to qualify the supported Linux systemd-user scheduler and safe update lifecycle from the exact candidate. The installer smoke remains the lifecycle evidence owner and blocks the existing release-required aggregate. Use one disposable Linux user whose systemd-user manager and HOME share an ownership boundary. Refuse before mutation for foreign, ambiguous, partial, symlinked, non-regular, escaped, or wrong-owner unit paths. Reuse current candidate provenance, credential-free environments, update and scheduler commands, semantic post-state, cleanup, sanitization, subprocess bounds, and aggregate job result. Do not add a second runner, gate row, service manager, updater, package manager, durable state owner, AI-client call, credential access, publication, tag, or unrelated remote mutation.\n\n## Acceptance criteria\n\n- AC-1: On supported Linux with functional systemd --user and matching HOME, install the exact candidate and directly exercise scheduler install, status, repeat, and removal through the installed executable. Prove candidate provenance, fragment path and content, enabled and active semantics, and complete cleanup.\n- AC-2: Existing canonical unit paths with non-matching content, partial ownership, symlinks, non-regular files, foreign uid, path escape, or an incongruent manager and HOME boundary refuse before write, enable, disable, delete, or daemon reload. Matching owned files support bounded idempotent install and removal.\n- AC-3: Directly exercise update status, confirmation refusal, and confirmed safe update apply behavior. Require bounded noninteractive behavior, exact semantic result, and no credential or AI-client access. A deterministic unpublished-candidate or blocked-network result is valid only when it proves zero package and user-unit mutation.\n- AC-4: Preserve unsupported-platform and unavailable-systemd refusals. Missing supported Linux evidence remains blocking UNRUN with one recovery command; mocks, source-only tests, and non-Linux refusal evidence cannot pass it.\n- AC-5: Keep the existing release readiness gate and installed-golden row set unchanged. Require focused false-PASS and ownership regressions, affected and full suites, direct exact-installed Linux evidence in the current Ubuntu job, static workflow and public-safety gates, and independent correctness, security, and Rule Zero reviews.\n\n## Current evidence\n\nThe exact candidate wheel SHA-256 is 48eba064520a75afbfec266caa197c9cd3f50445b86923caa1bbfe90977e29cf. It passed all 26 direct installed-golden rows offline. The full source suite passed 4,234 tests with 4 skipped and 2 deselected; focused, artifact, public-safety, secret, static, workflow, and independent reviews passed. Non-Linux release-readiness passed every supported installer surface and correctly retained the Linux lifecycle result as UNRUN. A bounded local Linux attempt exhausted its available memory before complete lifecycle evidence, so it cannot establish PASS or product FAIL.\n\n## Next action\n\nRun the unchanged public installed-application job for the exact pushed candidate commit. Require one terminal release-required PASS with all four installers, linux_systemd_update_lifecycle=pass, and complete disposable-user cleanup. A hosted PASS closes this residual. A hosted out-of-memory or nonzero lifecycle result blocks closure and requires a separate architecture or operations decision. Recovery: delete only the remote candidate branch and retain blocking UNRUN; do not create a tag or publication."
    links:
      - type: subtask-of
        key: RELEASE-DIRECT-INSTALLED-APP-GATE
