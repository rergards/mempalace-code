items:
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Make hosted ARM installer smoke establish its owned identity"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, installer, rule-zero]
    description: "## Symptom\n\nPublic candidate run 33328559281 failed before installer execution because the disposable child wrote its temporary identity with a mode that did not satisfy the immediate 0600 postcondition. The later missing-identity and cleanup messages were secondary.\n\n## Steps to reproduce\n\nRun the installed-application job on ubuntu-24.04-arm for the exact candidate wheel and observe the embedded launcher fail at test \"$(stat -c %a \"$2\")\" = 600 before atomic identity publication.\n\n## Expected vs actual\n\nExpected: the temporary identity passes its existing 0600 check, publishes atomically, and the job reaches all-installers and installed-golden execution. Actual: the child exits at the mode check and the outer job reports missing identity.\n\n## Root cause hypothesis\n\nConfirmed by hosted x64 and ARM output: the embedded launcher relies on umask alone, while the exact post-write mode observed by the hosted shell does not equal 600. Existing native ARM evidence completed every installer, the 26-row golden suite, systemd lifecycle, and cleanup, so product installers and the downstream smoke are not the first failing owner.\n\n## Scope\n\nExtend the existing embedded launcher in .github/workflows/ci.yml with an explicit chmod 0600 -- \"$2\" immediately after the identity write and before the existing regular-file, owner, mode, and atomic mv checks. Extend the smallest existing workflow admission assertion for this ordering. Inspect prior attempt b660e2bd as evidence only; do not merge it wholesale. Do not add a deadline protocol, diagnostic receipt, new cleanup behavior, blind sleep, helper, or second handshake owner.\n\n## Acceptance criteria\n\n- The temporary identity is explicitly mode 0600 after write and before existing validation and same-directory atomic publication.\n- Existing identity, PGID, interpreter, signal, cleanup, exact-wheel, installer, and golden behavior is otherwise byte-for-byte unchanged.\n- The smallest existing workflow admission test proves write then chmod then mode check then mv; focused workflow tests, Actionlint, diff checks, and public safety pass.\n- One exact-SHA public candidate run reaches and completes the hosted Ubuntu 24.04 ARM64 installed-application job and release-required. Record that receipt when closing this task; do not create a second evidence task."
  - key: REL-LINUX-SANITIZER-PATH-BOUNDARY
    summary: "Preserve executable recovery commands while redacting Linux temp paths"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux, drunk-path, rule-zero]
    description: "## Symptom\n\nAll hosted Python test jobs in run 33328559281 failed test_installed_custom_models_enospc_has_one_owned_tmpdir_retry because Linux tempfile root /tmp was substring-replaced inside TMPDIR=\"$HOME/.cache/mempalace/tmp\", producing a non-executable [REDACTED-PATH] recovery command.\n\n## Steps to reproduce\n\nRun TMPDIR=/tmp python -m pytest tests/test_release_readiness_gate.py::test_installed_custom_models_enospc_has_one_owned_tmpdir_retry -q.\n\n## Scope\n\nExtend the existing release_install_metadata_smoke.sanitize owner with path-boundary-aware explicit local-path replacement. Do not add a second sanitizer, a new mode, or a special-case recovery string. Treat scripts/release_readiness_gate.py as a read-only consumer and verification target; do not include it in changed files or task-contract surfaces.\n\n## Expected vs actual\n\nExpected: concrete /tmp/private-build is redacted and the literal $HOME/.cache/mempalace/tmp recovery path remains copy-pasteable exactly once. Actual: both are redacted by raw substring replacement.\n\n## Root cause hypothesis\n\nExplicit local paths are sanitized with str.replace without token/path boundaries.\n\n## Acceptance criteria\n\n- The exact TMPDIR=/tmp reproduction passes.\n- Concrete /tmp and other configured local paths remain redacted at path boundaries, including punctuation and end-of-string cases.\n- Embedded suffixes such as $HOME/.cache/mempalace/tmp remain unchanged.\n- The ENOSPC diagnostic retains one status, one executable recovery command, no private path, and bounded output.\n- Focused sanitizer/readiness/status tests, Ruff, formatting, and full non-network tests pass; the provider must run Ruff formatting before creating its implementation commit."
  - key: REL-CHANGELOG-PUBLIC-TRUTH
    summary: "Make the v1.13.5 changelog truthful at publication"
    type: task
    status: open
    priority: low
    size: XS
    section_id: future
    labels: [release-blocker, documentation, drunk-llm]
    description: "## Scope\n\nImmediately before the final public candidate, update the existing v1.13.5 CHANGELOG.md header to the actual publication date, remove the v1.0.0 bullet that names docs/STORAGE.md which is absent from tracked history, and delete the completed non-authoritative docs/plans/REL-DEPENDENCY-AUDIT-1-13-5.md whose executable-looking contract still requires retired Chroma extras. Reuse CHANGELOG.md and the backlog archive as the historical owner; do not create replacement documents or change historical feature claims.\n\n## Acceptance criteria\n\n- The v1.13.5 header contains the actual local publication date and remains the only header for that version.\n- The nonexistent docs/STORAGE.md path is absent while the rest of the v1.0.0 historical entry is unchanged.\n- The superseded Chroma dependency plan is absent, with its completed task history retained in docs/BACKLOG-archived.yaml.\n- Changelog and plan lifecycle contract tests, docs drift, public safety, and git diff checks pass.\n- The final Git tree, wheel, and sdist expose the corrected documentation and contain no private or local-only paths."
