items:
  - key: REL-LINUX-ARM-TORCH-CUDA-RESOLVER
    summary: "Complete provenance hardening and native ARM qualification"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    description: "## Symptom\n\nCommit 91593424 fixes the original hostile pre-existing `.mempalace-model.tmp` symlink overwrite with exclusive creation and a focused regression. Fresh security review found one remaining path-exchange gap in the same writer: an attacker with write access to the cache directory can exchange the temporary after identity validation and before replace or cleanup. The current unconditional cleanup may then unlink an unrelated replacement entry. Native ARM qualification also still needs one complete exact-wheel receipt.\n\n## Steps to reproduce\n\nCreate a valid disposable canonical cache, invoke `_write_canonical_provenance()`, and exchange `.mempalace-model.tmp` with an unrelated regular file after the created inode is validated but before replace or cleanup. The unrelated entry must remain byte-identical and the operation must fail without accepted provenance. Also exercise replacement of the validated cache directory entry where the platform permits it. For the remaining release receipt, run the exact 1.13.5 wheel through the existing Ubuntu 24 aarch64 Python 3.12 installed-application contour.\n\n## Scope\n\nExtend only `mempalace_code/storage.py::_write_canonical_provenance()` and its existing owner `tests/test_embedding_runtime.py`. Keep the landed exclusive-creation regression. Bind replacement and failure cleanup to the created temporary identity and canonical cache directory so an exchanged path cannot be installed or unlinked. Use the lowest-complexity supported-platform mechanism that proves this contract; preserve the current payload, final path, atomic publication, and recovery behavior.\n\nThe FastEmbed runtime migration, dependency graph, cache layout, optional custom-model boundary, compatibility fixture, ONNX warning classifier, workflows, release gates, generated evidence, and public documentation remain completion evidence and must not change. Add no helper module, cache mode, dependency, workflow, gate, task, migration, or public interface. A new product finding stops implementation for review in this same task.\n\n## Acceptance criteria\n\n- A pre-existing temporary symlink, hardlink, FIFO, device, directory, or regular file is refused before content write; the original hostile-symlink sentinel remains byte-identical.\n- Exchanging the temporary after creation cannot install or unlink the replacement. Cleanup removes only the created temporary identity, and unrelated external or sibling bytes remain unchanged.\n- Cache-directory replacement cannot redirect creation, publication, or cleanup outside the validated canonical cache on supported platforms; unsupported primitives fail closed rather than weaken the contract.\n- The complete embedding-runtime owner, public-safety scan, Ruff, format, both Pyright contours, and full non-network suite pass with only the same two implementation paths changed.\n- A fresh exact 1.13.5 wheel passes the existing local 26-row installed-golden application owner.\n- On native Ubuntu 24 aarch64 Python 3.12, the same exact wheel passes venv, bootstrap-venv, pipx, uv-tool, Linux systemd-user lifecycle, and all 26 installed-golden rows with terminal `ok: true`; real embedding, search, old-palace append, watcher exit, and disposable user/cache/root cleanup are observed.\n- The final candidate keeps FastEmbed/ONNX in the default graph and keeps Torch, CUDA, NVIDIA, Triton, Chroma extras, and ChromaDB absent. Existing compatibility, docs, security, and release gates pass at one final SHA.\n\n## Recovery\n\nRemove only the disposable hostile cache root, rerun `python -m pytest tests/test_embedding_runtime.py -q`, rebuild the exact wheel, and rerun the existing installed-golden command. Never unlink or replace a path whose identity is no longer the writer-created temporary."
