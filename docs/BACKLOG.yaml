items:
  - key: REL-LINUX-ARM-TORCH-CUDA-RESOLVER
    summary: "Replace unsafe Torch default with compatible ONNX embeddings"
    type: bug
    status: open
    priority: highest
    size: L
    section_id: quality
    description: "## Symptom\n\nA fresh unlocked Python 3.12 install on Linux aarch64 resolves sentence-transformers and PyPI torch 2.13 with CUDA, NVIDIA, and Triton dependencies, exhausting disk before MemPalace installs. The original torch<2.11 workaround is rejected: torch 2.10 is affected by GHSA-rrmf-rvhw-rf47 and high-severity PYSEC-2026-139, while public package metadata cannot transparently select the official PyTorch CPU index.\n\n## Steps to reproduce\n\nOn a clean Ubuntu 24 aarch64 Python 3.12 environment, install the current exact wheel with ordinary unlocked pip and no preinstalled packages. Inspect installed distributions and disk use. PyPI torch 2.13 selects Linux-wide CUDA, NVIDIA, and Triton dependencies. A torch<2.11 candidate avoids those packages but fails the existing dependency advisory gate.\n\n## Scope\n\nReplace only the canonical default all-MiniLM-L6-v2 implementation inside the existing storage embedder owner with FastEmbed/ONNX. Remove sentence-transformers and Torch from default runtime dependencies. Preserve arbitrary Hugging Face model names and local SentenceTransformer paths through one optional custom-models extra and the existing embed_model contract; when the extra is absent, fail before state mutation with one exact install/recovery command. Do not add a backend flag, second store, service, index override, durable selector, schema migration, or embedding-model change.\n\nRule Zero evidence: the insecure version cap and transparent CPU-index route are falsified. FastEmbed 0.8.0 supports the same 384d MiniLM model; an isolated five-text A/B measured paired cosine >=0.9999999268, maximum similarity-matrix delta 1.58e-7, and identical nearest-neighbor order. The existing _EmbedderProtocol, storage.py embedder, fetch-model command, installed-wheel smoke, benchmark, dependency report, and public docs remain the owners. Cheapest decisive falsifier: the full pinned retrieval corpus regresses, an old SentenceTransformer-built palace changes ranking materially, offline cached load makes a network call, or an exact Linux aarch64 wheel installs torch/cuda/nvidia/triton.\n\n## Acceptance criteria\n\n- Default wheel metadata and fresh pip, pipx, uv-tool, and bootstrap installs contain FastEmbed/ONNX and no torch, cuda-, nvidia-, or triton distribution on supported platforms, including native Linux aarch64 Python 3.12.\n- The canonical all-MiniLM-L6-v2 names route deterministically through the existing embedder owner to CPU FastEmbed, retain 384 dimensions and normalized vectors, and add no user backend/config mode.\n- The existing pinned code-retrieval benchmark meets or beats the committed MiniLM R@5/R@10 baseline, and representative old SentenceTransformer-generated palaces remain searchable and writable without reindexing or schema migration.\n- Existing arbitrary model names and local SentenceTransformer paths work when custom-models is installed. Without that extra, the first dependent action fails before state mutation and prints one exact recovery command.\n- fetch-model, init, mine, search, MCP stdio, watcher, and all four installed application surfaces directly exercise the real default FastEmbed model. Cached operation with HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE performs no network call; cache miss, force, retry, provenance, and cleanup behavior remain explicit and idempotent.\n- uv.lock and the v1.13.5 dependency report are regenerated through existing owners. The complete FastEmbed/ONNX graph passes advisory, fresh-resolver, artifact/Twine, public-safety, Gitleaks, lint, format, Pyright, architecture, scorecard, and release gates at one final SHA.\n- The existing release-critical package job runs the exact wheel on ubuntu-latest Python 3.11 and native ubuntu-24.04-arm Python 3.12 using the existing installed-smoke owner; no sibling release authority is created.\n- Public human and LLM documentation names the default cache/runtime truth, the custom-model extra, current status, one action, authority, and one recovery command without retaining SentenceTransformer-only default claims or private paths."
