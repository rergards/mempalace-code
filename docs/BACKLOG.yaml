items:
  - key: REL-MINILM-PUBLIC-CORPUS-PIN
    summary: "Make MiniLM compatibility self-contained in public squash candidates"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, benchmark, rule-zero]
    description: "## Symptom\n\nPublic candidate run 33328559281 x64 installed-application failed before installer/golden execution because pinned commit 3ad086bfd15bab032e86bef3e9deec207c13c17b was unavailable from the intentional one-parent public squash history. Independent review also reproduced that the archived corpus can shadow the installed mempalace_code package and fail the runtime-root binding before compatibility is measured.\n\n## Steps to reproduce\n\nFrom a clean checkout of candidate 5cc2da3a3ef7987bf78ec92035959ba27ee1c624 run python benchmarks/code_retrieval_bench.py --check-minilm-runtime-compatibility after installing the candidate wheel. Confirm the checkout lacks the pinned historical object. For malformed-input hardening, feed a fixture with a duplicate object key and require rejection before embedding.\n\n## Scope\n\nReuse the existing benchmarks/code_retrieval_bench.py command owner, benchmarks/minilm_runtime_compatibility_fixture.json, and current embedding-runtime tests. Review c296d37f, 79921474, 2d7b03f4 and 87571bdc as evidence only; do not import their unreachable commit pin or historical package shadowing. Delete the Git archive/recovery path and execute the existing public former-runtime fixture through the installed mempalace_code.storage._FastEmbedder. The fixture is the semantic authority; a compact integrity digest may bind its exact bytes, while code should avoid duplicating its full texts, model facts, vectors, or thresholds as a competing owner. Do not add a second fixture, benchmark owner, network fallback, dependency, or generated benchmark result.\n\n## Expected vs actual\n\nExpected: exact-wheel MiniLM embedding compatibility is reproducible offline from the published release tree and imports storage from the installed distribution. Actual: the old command requires an absent Git object and can import code from the archived corpus instead of the candidate wheel. This gate proves former-runtime embedding-vector compatibility on the committed five-text fixture; it does not claim to rerun the historical 466-chunk or 469-chunk retrieval corpus.\n\n## Root cause hypothesis\n\nThe installed-application compatibility command treats unpublished Git history and executable historical package code as release inputs even though the repository already contains the public former-runtime vector fixture.\n\n## Acceptance criteria\n\n- A clean one-parent public squash checkout runs the compatibility command offline without git fetch, git archive, or an unreachable object.\n- The executable imports mempalace_code.storage from the installed candidate distribution and runs the existing _FastEmbedder in local-files-only mode.\n- The existing fixture binds schema, model identifier and revision, dimensions, texts, former vectors, paired cosine, similarity-matrix delta, and neighbor order; malformed, duplicate-key, non-finite, or drifted facts fail closed.\n- The fixture generation_command is validated and documented as inert provenance that the release gate never executes; docs explicitly limit the claim to five-text embedding compatibility.\n- The direct command against the exact installed wheel and prepared local MiniLM cache passes and prints one bounded status; missing cache or malformed fixture gives one actionable recovery command.\n- No second fixture, historical source tree, generated benchmark result, credential, external AI client, or network fallback enters the release shape.\n- Focused benchmark and embedding-runtime tests, installed-application workflow contract, artifact, docs, public-safety, Ruff, and full non-network gates pass."
  - key: REL-DEPENDENCY-REPORT-CURRENT-HASH
    summary: "Refresh the v1.13.5 dependency report after final dependency changes"
    type: task
    status: open
    priority: highest
    size: XS
    section_id: quality
    description: "## Scope\n\nRegenerate the existing v1.13.5 dependency report through scripts/dependency_upgrade_gate.py after the final custom-model/default dependency changes. Current public candidate run 33328559281 reports no document matching pyproject.toml SHA-256 9c9af191fb23aa109d957d92b0f146c257ef69b7146ad385be04c00c988daa30 and uv.lock SHA-256 896e921f44e7e22aafd6e4c0f40f74eabc647456569b0c058405fbadbec34a61. Reuse the existing report owner; do not create a second report format or change the gate.\n\n## Acceptance criteria\n\n- The canonical v1.13.5 report matches current pyproject.toml and uv.lock hashes.\n- Audit evidence covers default, dev, and every remaining optional extra; removed Chroma dependencies remain absent.\n- verify-report and ci-check --base-ref publish/main pass.\n- Public-safety, docs drift, Ruff, and dependency-focused tests pass."
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Make hosted ARM installer smoke establish its owned identity"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, installer, rule-zero]
    description: "## Symptom\n\nGitHub run 33328559281 job 99302917340 failed before the installed application smoke could be observed: /home/mempalace-ci-33328559281-1/.mempalace-release-smoke.identity was absent, then cleanup reported the missing timer/mail spool.\n\n## Steps to reproduce\n\nRun the installed-application job on ubuntu-24.04-arm for the exact candidate wheel and observe the identity handshake before --all-installers.\n\n## Scope\n\nReuse the existing installed-application workflow and release_install_metadata_smoke.py owner. Inspect the prior REL-LINUX-ARM-INSTALLER-HANDSHAKE attempt branches and native ARM receipt before writing. Fix the earliest proven failing boundary; do not weaken identity/process-group/cleanup checks or add arbitrary sleeps.\n\n## Expected vs actual\n\nExpected: the disposable user atomically publishes its identity, runs all installer and golden contours, and is fully removed. Actual: the owner process exits or races before the identity file is available.\n\n## Root cause hypothesis\n\nThe hosted ARM launcher/identity handshake has a scheduling or executable-access assumption not exercised by the prior native receipt.\n\n## Acceptance criteria\n\n- Hosted Ubuntu 24.04 ARM64 reaches and completes all supported installer and golden rows for the exact wheel.\n- Identity is atomic, owned by the disposable uid, tied to the expected process group and interpreter, and bounded by an explicit deadline.\n- Early child failure reports its sanitized primary diagnostic instead of a secondary missing-file error.\n- Timer, user, process group, stage directory, identity files, and package artifacts are absent after success and failure.\n- Focused workflow/smoke tests, shell/static checks, public safety, and native or hosted ARM evidence pass."
  - key: REL-LINUX-SANITIZER-PATH-BOUNDARY
    summary: "Preserve executable recovery commands while redacting Linux temp paths"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux, drunk-path, rule-zero]
    description: "## Symptom\n\nAll hosted Python test jobs in run 33328559281 failed test_installed_custom_models_enospc_has_one_owned_tmpdir_retry because Linux tempfile root /tmp was substring-replaced inside TMPDIR=\"$HOME/.cache/mempalace/tmp\", producing a non-executable [REDACTED-PATH] recovery command.\n\n## Steps to reproduce\n\nRun TMPDIR=/tmp python -m pytest tests/test_release_readiness_gate.py::test_installed_custom_models_enospc_has_one_owned_tmpdir_retry -q.\n\n## Scope\n\nExtend the existing release_install_metadata_smoke.sanitize owner with path-boundary-aware explicit local-path replacement. Do not add a second sanitizer, a new mode, or a special-case recovery string.\n\n## Expected vs actual\n\nExpected: concrete /tmp/private-build is redacted and the literal $HOME/.cache/mempalace/tmp recovery path remains copy-pasteable exactly once. Actual: both are redacted by raw substring replacement.\n\n## Root cause hypothesis\n\nExplicit local paths are sanitized with str.replace without token/path boundaries.\n\n## Acceptance criteria\n\n- The exact TMPDIR=/tmp reproduction passes.\n- Concrete /tmp and other configured local paths remain redacted at path boundaries, including punctuation and end-of-string cases.\n- Embedded suffixes such as $HOME/.cache/mempalace/tmp remain unchanged.\n- The ENOSPC diagnostic retains one status, one executable recovery command, no private path, and bounded output.\n- Focused sanitizer/readiness/status tests, Ruff, formatting, and full non-network tests pass."
