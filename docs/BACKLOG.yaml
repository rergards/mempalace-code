items:
  - key: REL-LINUX-ARM-INSTALLER-HANDSHAKE
    summary: "Make hosted ARM installer smoke establish its owned identity"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, linux-arm, installer, rule-zero]
    description: "## Symptom\n\nPublic candidate run 33328559281 failed before installer execution because the disposable child wrote its temporary identity with a mode that did not satisfy the immediate 0600 postcondition. The later missing-identity and cleanup messages were secondary.\n\n## Steps to reproduce\n\nRun the installed-application job on ubuntu-24.04-arm for the exact candidate wheel and observe the embedded launcher fail at test \"$(stat -c %a \"$2\")\" = 600 before atomic identity publication.\n\n## Expected vs actual\n\nExpected: the temporary identity passes its existing 0600 check, publishes atomically, and the job reaches all-installers and installed-golden execution. Actual: the child exits at the mode check and the outer job reports missing identity.\n\n## Root cause hypothesis\n\nConfirmed by hosted x64 and ARM output: the embedded launcher relies on umask alone, while the exact post-write mode observed by the hosted shell does not equal 600. Existing native ARM evidence completed every installer, the 26-row golden suite, systemd lifecycle, and cleanup, so product installers and the downstream smoke are not the first failing owner.\n\n## Scope\n\nExtend the existing embedded launcher in .github/workflows/ci.yml with an explicit chmod 0600 -- \"$2\" immediately after the identity write and before the existing regular-file, owner, mode, and atomic mv checks. Extend the smallest existing workflow admission assertion for this ordering. Inspect prior attempt b660e2bd as evidence only; do not merge it wholesale. Do not add a deadline protocol, diagnostic receipt, new cleanup behavior, blind sleep, helper, or second handshake owner.\n\n## Acceptance criteria\n\n- The temporary identity is explicitly mode 0600 after write and before existing validation and same-directory atomic publication.\n- Existing identity, PGID, interpreter, signal, cleanup, exact-wheel, installer, and golden behavior is otherwise byte-for-byte unchanged.\n- The smallest existing workflow admission test proves write then chmod then mode check then mv; focused workflow tests, Actionlint, diff checks, and public safety pass.\n- One exact-SHA public candidate run reaches and completes the hosted Ubuntu 24.04 ARM64 installed-application job and release-required. Record that receipt when closing this task; do not create a second evidence task."
  - key: UPSTREAM-COMPARISON-E8098348
    summary: "Refresh reviewed upstream comparison to e8098348"
    type: task
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, upstream, documentation, rule-zero]
    description: "## Symptom\n\nThe canonical pre-tag live check reports that upstream develop moved from reviewed a9f345cc63254eb4dea7abad36963b85c9f8453a to e8098348ddfce59964fe536e5deffb81da579e6b, so v1.13.5 release admission fails closed.\n\n## Evidence\n\nReview the exact public range https://github.com/MemPalace/mempalace/compare/a9f345cc63254eb4dea7abad36963b85c9f8453a...e8098348ddfce59964fe536e5deffb81da579e6b. It contains 47 commits in 12 first-parent merge groups. Upstream 3.9.0 adds opt-in update awareness, hub search and read concurrency, logstream topics, alternate-backend and EmbeddingGemma changes, benchmarks, dependency metadata, and release metadata. Local update awareness is already owned by mempalace_code/version_check.py, mempalace_code/updater.py, mempalace_code/cli_commands/update.py, docs/UPDATES.md, docs/AGENT_INSTALL.md, and their focused tests. The fork has no hub, HTTP MCP, logstream, Qdrant, sqlite_exact, or EmbeddingGemma owner. The pinned upstream README and Claude plugin advertise 45 MCP tools while the pinned Codex plugin description still advertises 44; preserve this source discrepancy instead of normalizing it.\n\nThe first Autopilot attempt produced the right 47-commit grouping but stopped because tests/test_upstream_comparison_guard.py hard-codes the superseded 43-commit canonical snapshot. Its draft also incorrectly classified update awareness as irrelevant and claimed no local owner. Treat commit 5360b2227d3acb8544af59f2627eab9105b705e1 as rejected evidence only; do not cherry-pick it wholesale.\n\n## Scope\n\nOutcome: review and pin the exact upstream range so the live pre-tag check is truthful. Extend the existing docs/quality/upstream-comparison.json, docs/UPSTREAM_COMPARISON.md, and the canonical snapshot assertions in tests/test_upstream_comparison_guard.py. Do not import upstream runtime code, add capabilities, create a new guard/helper, change release behavior, or touch unrelated docs/tests. Group every merge and constituent commit exactly once. Classify upstream update awareness as equivalent-local with existing CLI/install/update predicates; state explicitly that the upstream MCP cached-status shape is not a local MCP compatibility claim. Classify architecturally absent hub/logstream/backend/model surfaces as irrelevant with explicit rationale. Preserve the pinned 45-versus-44 tool-count source discrepancy. Cheapest falsifier: any range commit that exposes an applicable local correctness or release gap without an existing predicate.\n\n## Acceptance criteria\n\n- The manifest pins e8098348ddfce59964fe536e5deffb81da579e6b, records a9f345cc63254eb4dea7abad36963b85c9f8453a as the previous commit, and uses review date 2026-08-31.\n- The manifest and document cover the exact 47-commit inventory once across 12 first-parent merge groups, with synchronized source links, SHA-256 anchor, release-critical classification, capability/version/count updates, and local predicates where required.\n- Update awareness is truthfully recorded as equivalent-local through the existing disabled-by-default version-check, explicit status/check/apply paths, safe install defaults, and focused local predicates; no upstream runtime implementation is imported.\n- The comparison reports upstream README/Claude 45-tool wording and Codex 44-tool wording as pinned source-local claims; local profiles remain 29 full and 4 minimal.\n- tests/test_upstream_comparison_guard.py updates only the canonical snapshot expectations from the previous 43-commit pin to the reviewed 47-commit pin; no new test owner or helper is added.\n- Static and live upstream guards, focused upstream/release tests, docs drift, public safety, formatting, and diff checks pass.\n- Independent review confirms zero unresolved release-critical drift or reports the exact blocker."
