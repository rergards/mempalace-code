items:
  - key: REL-CI-UPSTREAM-INVENTORY-CLEAN-CHECKOUT
    summary: "Make exact upstream inventory pass in a squash-candidate checkout"
    type: bug
    status: open
    priority: highest
    size: S
    section_id: quality
    assignee: bot
    labels: [release-blocker, ci, rule-zero]
    description: "## Symptom\n\nPublic candidate 5cc2da3a3ef7987bf78ec92035959ba27ee1c624 failed Tests run 33328559281 because the static upstream guard could not resolve dfba59b0f3b1c5b57a3d606317b2fd37a4fef6f0..a9f345cc63254eb4dea7abad36963b85c9f8453a from the intentional one-parent public squash history.\n\n## Steps to reproduce\n\nCreate a clean candidate whose sole parent is public main and whose tree equals the reviewed release tree, then run python scripts/upstream_comparison_guard.py --json.\n\n## Scope\n\nReuse scripts/upstream_comparison_guard.py and the existing package/preflight workflow owner. Compare the unmerged 371e22f0 implementation before writing; accept it only if it preserves the intended credential-free/static boundary and lower total complexity. Do not add AI clients, credentials, a second guard, or duplicate the same gate in multiple jobs.\n\n## Expected vs actual\n\nExpected: the canonical squash release candidate proves the exact 43-commit inventory. Actual: git rev-list exits 128 because upstream-only objects are absent.\n\n## Root cause hypothesis\n\nThe guard assumes pinned upstream Git objects exist locally while the canonical public candidate intentionally contains only fork history.\n\n## Acceptance criteria\n\n- A clean one-parent squash-candidate checkout passes the exact inventory and release preflight.\n- The 43-commit exactness, missing/extra/duplicate fail-closed behavior, and one recovery command remain covered.\n- The solution has one gate owner and no credential, token, external AI client, or hidden authenticated dependency.\n- Focused upstream/preflight/workflow tests, docs drift, public safety, Ruff, and actionlint pass."
  - key: REL-MINILM-PUBLIC-CORPUS-PIN
    summary: "Make MiniLM compatibility self-contained in public squash candidates"
    type: bug
    status: open
    priority: highest
    size: M
    section_id: quality
    assignee: bot
    labels: [release-blocker, benchmark, rule-zero]
    description: "## Symptom\n\nPublic candidate run 33328559281 x64 installed-application failed before installer/golden execution: pinned commit 3ad086bfd15bab032e86bef3e9deec207c13c17b was unavailable from the public squash history.\n\n## Steps to reproduce\n\nFrom a clean checkout of candidate 5cc2da3a3ef7987bf78ec92035959ba27ee1c624 run python benchmarks/code_retrieval_bench.py --check-minilm-runtime-compatibility.\n\n## Scope\n\nReuse the existing benchmark owner and review the already implemented c296d37f, 79921474, 2d7b03f4 and 87571bdc series before writing. Integrate only the residual self-contained corpus/provenance behavior that remains correct against current HEAD; avoid importing unrelated branch history or adding a new benchmark owner.\n\n## Expected vs actual\n\nExpected: exact-wheel compatibility is reproducible from the published release tree. Actual: it depends on an unreachable historical Git object.\n\n## Root cause hypothesis\n\nThe benchmark treats non-published repository history as release input.\n\n## Acceptance criteria\n\n- A clean public squash-candidate checkout runs the pinned MiniLM compatibility command without fetching an unreachable Git object.\n- Corpus provenance, exact chunk/query counts, measured values, regression thresholds, and current runtime-owner binding fail closed.\n- The committed release shape contains only the minimal public-safe reproducibility fixture and excludes generated scratch output.\n- Focused benchmark, artifact, docs, public-safety, Ruff, and full non-network gates pass."
  - key: REL-DEPENDENCY-REPORT-CURRENT-HASH
    summary: "Refresh the v1.13.5 dependency report after final dependency changes"
    type: task
    status: open
    priority: highest
    size: XS
    section_id: quality
    description: "## Scope\n\nRegenerate the existing v1.13.5 dependency report through scripts/dependency_upgrade_gate.py after the final custom-model/default dependency changes. Current public candidate run 33328559281 reports no document matching pyproject.toml SHA-256 9c9af191fb23aa109d957d92b0f146c257ef69b7146ad385be04c00c988daa30 and uv.lock SHA-256 896e921f44e7e22aafd6e4c0f40f74eabc647456569b0c058405fbadbec34a61. Reuse the existing report owner; do not create a second report format or change the gate.\n\n## Acceptance criteria\n\n- The canonical v1.13.5 report matches current pyproject.toml and uv.lock hashes.\n- Audit evidence covers default, dev, and every remaining optional extra; removed Chroma dependencies remain absent.\n- verify-report and ci-check --base-ref publish/main pass.\n- Public-safety, docs drift, Ruff, and dependency-focused tests pass."
