      resolution: '2026-05-01: Added TestSchemaMigration.test_write_with_all_metadata_after_partial_migration seeding a 12-column intermediate palace (9 original + hall/language/symbol_name) with one pre-existing row, opening via open_store to trigger partial migration, then asserting (a) the migration log lists exactly the absent columns, (b) the pre-existing row preserves its 12-column values and gets _META_FIELD_SPEC defaults for newly-added columns, and (c) full _META_FIELD_SPEC roundtrip for a freshly written drawer. Hardening replaced bare-substring log checks with list-repr-quoted matches and strengthened `any` to `all` so every absent column must appear in the migration log.'
