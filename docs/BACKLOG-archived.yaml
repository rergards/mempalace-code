    - key: INGEST-NONREGULAR-SOURCE-GUARD
      summary: Reject non-regular and symlinked ingest sources without blocking
      resolution: '2026-08-25: Reused the shared descriptor-validated source owner and existing scanner/stale sweep so project mine, mine-all, conversation mining, and watcher reject symlinks and non-regular nodes by exact kind before mutation. Full non-network pytest passed. A freshly built installed 1.13.5 wheel, invoked from a neutral directory, rejected FIFO and same-extension symlink inputs without hanging, removed the previously searchable stale symlink drawer, preserved regular incremental no-op behavior, and completed watcher startup plus SIGTERM shutdown with no lease descriptor. Fresh Rule Zero review found no release-blocking safety defect; stale symlink-only comments were removed. Autopilot plan review, implementation, and full verification completed; hardening terminal bookkeeping was bypassed after reproducible closed-packet and resume-lineage failures.'
      archived_date: "2026-08-25"
      done_summary: Reused the shared descriptor-validated source owner and existing scanner/stale sweep so project mine, mine-all, conversation mining, and watcher reject symlinks and non-regular nodes by exact kind before mutation. Full non-network pytest passed. A freshly built installed 1.13.5 wheel, invoked from a neutral directory, rejected FIFO and same-extension symlink inputs without hanging, removed the previously searchable stale symlink drawer, preserved regular incremental no-op behavior, and completed watcher startup plus SIGTERM shutdown with no lease descriptor. Fresh Rule Zero review found no release-blocking safety defect; stale symlink-only comments were removed. Autopilot plan review, implementation, and full verification completed; hardening terminal bookkeeping was bypassed after reproducible closed-packet and resume-lineage failures.
    - key: SCHEDULE-SNIPPET-INVOKED-LAUNCHER-PROVENANCE
      summary: Bind backup and watch schedules to the invoked launcher
      resolution: '2026-08-24: Reused the existing alias launcher-provenance owner and removed independent PATH selection from backup and watch renderers. A freshly built installed wheel was invoked through an absolute symlink path containing spaces with a conflicting ambient PATH; backup and watch snippets, re-render guidance, save paths, and install refusals all retained that launcher, safely quoted spaced targets, produced byte-identical repeated output, returned exit 2 for --install, and created no scheduler files. Focused suite passed 439 tests and the full non-network suite passed 3746 tests with zero unreasoned suppressions. Autopilot plan review and implementation completed; terminal verification bookkeeping was bypassed after it contradicted a successful repaired verify-fix result.'
      archived_date: "2026-08-24"
      done_summary: Backup and watch schedule output now binds to one proven invoked launcher and remains deterministic, safely quoted, and non-mutating.
    - key: STORE-CLEANUP-FIRST-RUN-POSTSTATE
      summary: Make first cleanup poststate truthful and idempotent
      resolution: '2026-08-24: Reused LanceStore.cleanup_stale_fragments and the supported LanceDB optimize path. Default cleanup now returns a verified no-op when every non-current version is newer than the threshold and reports reclaimable bytes before and after. A freshly built installed wheel from neutral cwd preserved 2 rows, 2 versions, and 4067 reclaimable bytes across two cleanup processes; both health checks passed. Full non-network suite passed with 3729 tests, and the quality scorecard retained zero unreasoned suppressions. Autopilot plan review and implementation completed; terminal verification bookkeeping was bypassed after a verify-fix scope-contract failure and stale-sidecar recovery failure.'
      archived_date: "2026-08-24"
      done_summary: Fresh default cleanup is a stable, truthful no-op; eligible and unsafe cleanup remain on the supported LanceDB optimize path.
    - key: CLI-COMPRESS-TOTAL-TOKEN-ACCOUNTING
      summary: Make compression totals match displayed drawer accounting
      resolution: '2026-08-24: Reused the existing per-drawer compression statistics in the single CLI summary owner. Freshly built wheel 1.13.5, invoked from a neutral directory, reported row sums and Total consistently at 271t -> 99t in dry-run and live modes; live mode stored 11 drawers. Ruff and the full pytest suite passed. Autopilot plan review and full verification completed, while hardening review and terminal bookkeeping were bypassed after reproducible review-packet and resume-lineage control-plane failures.'
      archived_date: "2026-08-24"
      done_summary: Compression Total now equals the sum of displayed per-drawer token estimates in dry-run and live installed-wheel execution.
