# Reviewed Gitleaks suppressions.
#
# Each entry suppresses exactly one finding fingerprint
# (commit:path:rule-id:start-line) and nothing else — no path globs, no rule
# disablement, no regex allowlists. A new commit, path, rule or line produces a
# new fingerprint and is therefore reported again.
#
# scripts/gitleaks_scan.py validate-baseline requires fingerprint, rationale,
# owner, and either review_condition or expires on every entry, and rejects
# duplicate fingerprints.
version: 1
entries:
  - fingerprint: fd9a87eeb1c4f905731f10e5cc1512f57355ae40:docs/BACKLOG.yaml:generic-api-key:1064
    rationale: >-
      Not a credential. The generic-api-key heuristic matches the public backlog
      identifier "MINE-K8S-LARGE-DOC" on the `- key:` line of a tracked backlog
      entry. Verified by reading the commit content: the line is a work-item key,
      the file is published in the public repository, and no token, key or secret
      material is present.
    owner: release-owner
    review_condition: >-
      Remove when the backlog key naming scheme changes or when .gitleaks.toml
      stops using the default generic-api-key rule; re-verify by re-running
      `python scripts/gitleaks_scan.py full-history` with this entry removed.
  - fingerprint: cddbbbbcf812bc84def50bbea09e4c13629e810b:docs/BACKLOG-archived.yaml:generic-api-key:229
    rationale: >-
      Not a credential. Same public backlog identifier "MINE-K8S-LARGE-DOC" as the
      entry above, matched again when the work item was moved into the archived
      backlog. Verified by reading the commit content: a work-item key in a
      published file, no token, key or secret material.
    owner: release-owner
    review_condition: >-
      Remove together with the docs/BACKLOG.yaml entry above; both exist only
      because one public work-item key trips the generic-api-key heuristic.
