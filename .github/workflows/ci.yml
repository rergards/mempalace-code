name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_tests:
        description: "Run needs_network model-backed tests with HuggingFace cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev,treesitter]"
      - run: python3 -m pytest tests/ -v -m "not needs_network"
      - name: Demo performance budgets (hard CI gate)
        if: matrix.python-version == '3.13'
        run: python benchmarks/demo_perf_budgets.py --check --ci

  chroma-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev,chroma]"
      - name: ChromaStore compatibility tests
        run: python -m pytest tests/test_chroma_compat.py -v
      - run: python -m pytest tests/ -v -m "not needs_network"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Architecture boundary guard
        run: python scripts/architecture_guard.py --root .
      - run: pip install ruff
      - run: ruff check mempalace_code/ tests/ scripts/
      - run: ruff format --check mempalace_code/ tests/ scripts/
      - name: Public-safety scan (tracked + staged)
        run: python scripts/public_safety_scan.py --tracked --staged
      - name: Quality scorecard (shape + determinism + public-safety)
        run: python scripts/quality_scorecard.py --check
      - name: Documentation drift guard
        run: python scripts/docs_drift_guard.py
      - name: Upstream comparison guard (static, network-free)
        run: python scripts/upstream_comparison_guard.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install build twine
      - name: Release metadata preflight
        run: python scripts/release_preflight.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Fresh wheel install smoke
        run: |
          python -m venv /tmp/mempalace-package-smoke
          /tmp/mempalace-package-smoke/bin/pip install --no-cache-dir dist/*.whl
          /tmp/mempalace-package-smoke/bin/python -c "import mempalace_code; print(mempalace_code.__version__)"
          /tmp/mempalace-package-smoke/bin/mempalace-code --help

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev,chroma,spellcheck,treesitter]"
      - name: Pyright typecheck
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"
      - name: Pyright strict slice
        run: python -m pyright -p pyrightconfig.strict.json

  dependency-upgrade-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Dependency upgrade gate
        run: |
          python scripts/dependency_upgrade_gate.py ci-check \
            --base-ref "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  model-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.model_tests == 'true'
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MEMPALACE_TEST_HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Restore HuggingFace model cache
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: hf-${{ runner.os }}-py3.13-minilm-all-MiniLM-L6-v2-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-py3.13-minilm-all-MiniLM-L6-v2-
      - run: pip install -e ".[dev,treesitter]"
      - name: Fetch embedding model (no-op on cache hit)
        run: mempalace-code fetch-model
      - name: Run model-backed tests
        run: python -m pytest tests/ -v -m needs_network
