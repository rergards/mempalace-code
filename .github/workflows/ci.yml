name: Tests

on:
  push:
    # `release/v*` is the public release-candidate branch shape. The candidate is
    # pushed there and proven green *before* it fast-forwards onto `main`, so this
    # trigger is what lets a candidate SHA have its own Tests and `release-required`
    # results. It stays narrow on purpose: no other branch pattern is release
    # evidence, and `workflow_dispatch` never is (it skips release-critical jobs).
    branches: [main, "release/v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_tests:
        description: "Run needs_network model-backed tests with HuggingFace cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Least privilege for every job below: none of them write repository state.
permissions:
  contents: read

# Every cache site below carries `# zizmor: ignore[cache-poisoning]`. The
# `release/v*` trigger makes zizmor classify this workflow as release-publishing
# from the branch name alone, but nothing here publishes anything: the shipped
# distributions are built only by the tag-triggered publish.yml, which restores no
# cache at all. These caches feed test/lint jobs whose exposure is exactly what it
# was when pushes to `main` were the release evidence. The suppression is per site,
# with no repository-wide audit config.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev,treesitter]"
      - run: python3 -m pytest tests/ -v -m "not needs_network"
      - name: Demo performance budgets (hard CI gate)
        if: matrix.python-version == '3.13'
        run: python benchmarks/demo_perf_budgets.py --check --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Architecture boundary guard
        run: python scripts/architecture_guard.py --root .
      - run: pip install -e ".[dev]"
      - run: ruff check mempalace_code/ tests/ scripts/
      - run: ruff format --check mempalace_code/ tests/ scripts/
      - name: GitHub Actions syntax lint
        run: actionlint .github/workflows/*.yml
      - name: GitHub Actions security audit
        # Network-free audit. Blocks at medium severity and above, which covers
        # unpinned action references, expression injection, excessive job
        # permissions, and credential-persisting checkouts. Repository-local
        # composite actions are audited too, since a workflow is only as safe as
        # the actions it calls. No audit is disabled repository-wide.
        run: zizmor --offline --min-severity=medium .github/workflows/ .github/actions/
      - name: Public-safety scan (tracked + staged)
        run: python scripts/public_safety_scan.py --tracked --staged
      - name: Quality scorecard (shape + determinism + public-safety)
        run: python scripts/quality_scorecard.py --check
      - name: Documentation drift guard
        run: python scripts/docs_drift_guard.py
      - name: Upstream comparison guard (credential-free public read)
        run: python scripts/upstream_comparison_guard.py

  gitleaks-changed-range:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/gitleaks/go.mod
          # The scanner binary is built here, so a restored build cache would be
          # an input to a security gate. go.sum already makes the source
          # verifiable; the cache would not be.
          cache: false
      # Installs the Gitleaks version pinned by tools/gitleaks/go.mod and locked by
      # tools/gitleaks/go.sum. Dependabot's gomod ecosystem owns that upgrade.
      - uses: ./.github/actions/gitleaks-gate
      - name: Derive exact Gitleaks commit range
        id: gitleaks-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            # A push that *creates* a branch reports an all-zeros `before`, which the
            # scanner rejects outright. The release candidate branch is created by
            # exactly that shape, so fall back to `origin/main`: `origin/main..HEAD`
            # is the same commit set as `merge-base..HEAD`, so the scan still covers
            # every commit the branch adds and never narrows the range.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=origin/main
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      # Artifacts land in RUNNER_TEMP, never in the checkout, so the worktree stays
      # clean for --require-clean and no scan output can ever be committed.
      - name: Gitleaks changed-range scan
        run: >
          python scripts/gitleaks_scan.py changed-range
          --base-ref "${{ steps.gitleaks-range.outputs.base }}"
          --head-ref "${{ steps.gitleaks-range.outputs.head }}"
          --artifact-dir "${{ runner.temp }}/gitleaks/changed-range"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gitleaks-changed-range
          path: ${{ runner.temp }}/gitleaks/changed-range/
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install build twine
      - name: Release metadata preflight
        run: python scripts/release_preflight.py
      - name: Build wheel and source distribution
        run: python -m build
      # Invokes twine itself, so a separate metadata-validation step would only
      # re-run a subset of what this already asserts about the archives.
      - name: Inspect built distributions
        run: python scripts/release_artifact_gate.py --dist dist --require-wheel --require-sdist
      - name: Fresh wheel install smoke
        run: |
          python -m venv /tmp/mempalace-package-smoke
          /tmp/mempalace-package-smoke/bin/pip install --no-cache-dir dist/*.whl
          /tmp/mempalace-package-smoke/bin/python -c "import mempalace_code; print(mempalace_code.__version__)"
          /tmp/mempalace-package-smoke/bin/mempalace-code --help

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev,spellcheck,treesitter]"
      - name: Pyright typecheck
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"
      - name: Pyright strict slice
        run: python -m pyright -p pyrightconfig.strict.json

  dependency-upgrade-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Dependency upgrade gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # Same branch-creation case as the Gitleaks range: an all-zeros `before`
          # is unresolvable, and this gate fails closed on it by demanding a fresh
          # upgrade report that a release candidate has no reason to carry.
          # `origin/main` is the candidate's parent, so it is the honest base.
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=origin/main
          fi
          python scripts/dependency_upgrade_gate.py ci-check --base-ref "$base"

  installed-application:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python: "3.11"
            arch: x64
          - runner: ubuntu-24.04-arm
            python: "3.12"
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MEMPALACE_TEST_HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.arch == 'x64' && '0' || '1' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Restore required MiniLM cache
        id: hf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/huggingface/mempalace-fastembed/all-MiniLM-L6-v2-v1
          key: fastembed-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python }}-minilm-${{ hashFiles('pyproject.toml', 'uv.lock', 'benchmarks/minilm_runtime_compatibility_fixture.json') }} # zizmor: ignore[cache-poisoning]
          restore-keys: |
            fastembed-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python }}-minilm-
      - name: Seed missing MiniLM cache
        if: steps.hf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_home="$RUNNER_TEMP/mempalace-cache-bootstrap-home"
          mkdir -p "$bootstrap_home"
          clean_env=(
            env -i
            HOME="$bootstrap_home"
            HF_HOME="$HF_HOME"
            HF_HUB_DISABLE_IMPLICIT_TOKEN=1
            LANG=C.UTF-8
            PATH="$PATH"
            PIP_CONFIG_FILE=/dev/null
            PIP_DISABLE_PIP_VERSION_CHECK=1
            PIP_KEYRING_PROVIDER=disabled
            PYTHONDONTWRITEBYTECODE=1
            PYTHONNOUSERSITE=1
          )
          "${clean_env[@]}" python -m pip install .
          "${clean_env[@]}" mempalace-code fetch-model
      - name: Build exact candidate and provision installers
        run: |
          python -m pip install build pipx pytest uv
          python -m build --wheel --outdir dist
      - name: Verify pinned MiniLM runtime compatibility
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          python -m pip install "${wheel[0]}"
          python benchmarks/code_retrieval_bench.py --check-minilm-runtime-compatibility
      - name: Verify installed application through every supported installer
        shell: bash
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          lifecycle_user="mempalace-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lifecycle_user="${lifecycle_user:0:31}"
          lifecycle_created=0
          lifecycle_uid=""
          lifecycle_home=""
          lifecycle_runtime=""
          stage_dir=""
          staged_script=""
          staged_wheel=""
          smoke_launcher_pid=""
          smoke_pid=""
          smoke_pgid=""
          smoke_identity=""
          smoke_identity_tmp=""
          smoke_launcher_stderr=""
          # shellcheck disable=SC2317,SC2329  # Invoked indirectly by the EXIT trap below.
          cleanup_lifecycle_user() {
            primary_rc=$?
            trap - EXIT
            set +e
            if (( lifecycle_created == 0 )); then
              exit "$primary_rc"
            fi
            if [ -z "$lifecycle_uid" ]; then
              lifecycle_uid="$(id -u "$lifecycle_user" 2>/dev/null)"
            fi
            if [ -z "$lifecycle_home" ]; then
              lifecycle_home="$(getent passwd "$lifecycle_user" | cut -d: -f6)"
            fi
            if [ -z "$lifecycle_runtime" ] && [ -n "$lifecycle_uid" ]; then
              lifecycle_runtime="/run/user/$lifecycle_uid"
            fi
            cleanup_rc=0
            if [ -n "$smoke_identity" ] && sudo test -e "$smoke_identity"; then
              identity_rc=0
              sudo test -f "$smoke_identity" && sudo test ! -L "$smoke_identity" || identity_rc=1
              test "$(sudo stat -c %u "$smoke_identity" 2>/dev/null)" = "$lifecycle_uid" || identity_rc=1
              smoke_extra=""
              read -r smoke_pid smoke_pgid smoke_uid smoke_command smoke_extra < <(sudo cat "$smoke_identity")
              test -n "$smoke_pid" && test -n "$smoke_pgid" && test -n "$smoke_uid" && test -n "$smoke_command" || identity_rc=1
              test -z "$smoke_extra" || identity_rc=1
              test "$smoke_pid" = "$smoke_pgid" || identity_rc=1
              test "$smoke_uid" = "$lifecycle_uid" || identity_rc=1
              test "$smoke_command" = "$python_bin" || identity_rc=1
              if [ -n "$smoke_pid" ] && sudo test -d "/proc/$smoke_pid"; then
                current_pgid="$(ps -o pgid= -p "$smoke_pid" | tr -d ' ')"
                current_uid="$(sudo awk '/^Uid:/ {print $2}' "/proc/$smoke_pid/status")"
                mapfile -d '' smoke_cmdline < <(sudo cat "/proc/$smoke_pid/cmdline")
                test "$current_pgid" = "$smoke_pgid" || identity_rc=1
                test "$current_uid" = "$lifecycle_uid" || identity_rc=1
                test "${smoke_cmdline[0]:-}" = "$python_bin" || identity_rc=1
                test "${smoke_cmdline[1]:-}" = "$staged_script" || identity_rc=1
                if (( identity_rc == 0 )); then
                  sudo kill -TERM -- "-$smoke_pgid"
                  for _attempt in {1..20}; do
                    sudo kill -0 -- "-$smoke_pgid" 2>/dev/null || break
                    sleep 0.25
                  done
                  if sudo kill -0 -- "-$smoke_pgid" 2>/dev/null; then
                    if sudo test -d "/proc/$smoke_pid"; then
                      test "$(ps -o pgid= -p "$smoke_pid" | tr -d ' ')" = "$smoke_pgid" || identity_rc=1
                    fi
                    if (( identity_rc == 0 )); then
                      sudo kill -KILL -- "-$smoke_pgid"
                      for _attempt in {1..20}; do
                        sudo kill -0 -- "-$smoke_pgid" 2>/dev/null || break
                        sleep 0.25
                      done
                    fi
                  fi
                  sudo kill -0 -- "-$smoke_pgid" 2>/dev/null && identity_rc=1
                fi
              elif [ -n "$smoke_pgid" ] && sudo kill -0 -- "-$smoke_pgid" 2>/dev/null; then
                identity_rc=1
              fi
              cleanup_rc=$((cleanup_rc | identity_rc))
            fi
            if [ -n "$smoke_identity_tmp" ]; then
              sudo rm -f -- "$smoke_identity_tmp"
              cleanup_rc=$((cleanup_rc | $?))
            fi
            if [ -n "$smoke_launcher_stderr" ]; then
              sudo rm -f -- "$smoke_launcher_stderr"
              cleanup_rc=$((cleanup_rc | $?))
            fi
            if (( cleanup_rc != 0 )); then
              echo "disposable smoke process identity or termination failed" >&2
            fi
            sudo -u "$lifecycle_user" env -i \
              HOME="$lifecycle_home" \
              XDG_RUNTIME_DIR="$lifecycle_runtime" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=$lifecycle_runtime/bus" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              systemctl --user disable --now mempalace-update.timer
            unit_rc=$?
            if (( unit_rc != 0 )) && {
              sudo test -e "$lifecycle_home/.config/systemd/user/mempalace-update.timer" ||
              sudo test -e "$lifecycle_home/.config/systemd/user/mempalace-update.service"
            }; then
              cleanup_rc=1
            fi
            if [ -n "$lifecycle_uid" ]; then
              sudo systemctl stop "user@${lifecycle_uid}.service"
              cleanup_rc=$((cleanup_rc | $?))
            fi
            lifecycle_mail_spool="/var/mail/$lifecycle_user"
            if sudo test -e "$lifecycle_mail_spool" || sudo test -L "$lifecycle_mail_spool"; then
              mail_rc=0
              case "$lifecycle_mail_spool" in
                "/var/mail/$lifecycle_user") ;;
                *) mail_rc=1 ;;
              esac
              sudo test -f "$lifecycle_mail_spool" && sudo test ! -L "$lifecycle_mail_spool" || mail_rc=1
              if (( mail_rc == 0 )); then
                sudo rm -f -- "$lifecycle_mail_spool"
                mail_rc=$?
              fi
              cleanup_rc=$((cleanup_rc | mail_rc))
            fi
            sudo userdel --remove "$lifecycle_user"
            cleanup_rc=$((cleanup_rc | $?))
            if [ -n "$stage_dir" ]; then
              stage_rc=0
              case "$stage_dir" in
                /var/tmp/mempalace-installed-application.??????) ;;
                *) stage_rc=1 ;;
              esac
              stage_mode="$(sudo stat -c %a "$stage_dir" 2>/dev/null)"
              if (( stage_rc == 0 )) &&
                sudo test -d "$stage_dir" &&
                sudo test ! -L "$stage_dir" &&
                test "$(sudo stat -c %u "$stage_dir")" = 0 &&
                { test "$stage_mode" = 700 || test "$stage_mode" = 755 || test "$stage_mode" = 555; }; then
                sudo rm -f -- "$staged_script" "$staged_wheel"
                stage_rc=$((stage_rc | $?))
                sudo rmdir -- "$stage_dir"
                stage_rc=$((stage_rc | $?))
              else
                stage_rc=1
              fi
              if sudo test -e "$stage_dir" || sudo test -L "$stage_dir"; then
                stage_rc=1
              fi
              cleanup_rc=$((cleanup_rc | stage_rc))
            fi
            if (( cleanup_rc != 0 )); then
              echo "disposable systemd-user or staging cleanup failed" >&2
            fi
            if (( primary_rc != 0 )); then
              exit "$primary_rc"
            fi
            exit "$cleanup_rc"
          }
          trap cleanup_lifecycle_user EXIT
          if getent passwd "$lifecycle_user" >/dev/null; then
            echo "refused to reuse an existing lifecycle user" >&2
            exit 1
          fi
          lifecycle_created=1
          sudo useradd --create-home --shell /bin/bash "$lifecycle_user"
          lifecycle_uid="$(id -u "$lifecycle_user")"
          lifecycle_home="$(getent passwd "$lifecycle_user" | cut -d: -f6)"
          lifecycle_runtime="/run/user/$lifecycle_uid"
          smoke_identity="$lifecycle_home/.mempalace-release-smoke.identity"
          smoke_identity_tmp="$smoke_identity.tmp"
          smoke_launcher_stderr="$lifecycle_home/.mempalace-release-smoke.launcher.stderr"
          sudo systemctl start "user@${lifecycle_uid}.service"
          test "$(stat -c %u "$lifecycle_runtime")" = "$lifecycle_uid"
          python_bin="$(command -v python)"
          script_source="$GITHUB_WORKSPACE/scripts/release_install_metadata_smoke.py"
          wheel_source="$GITHUB_WORKSPACE/${wheel[0]}"
          test -f "$script_source" && test ! -L "$script_source"
          test -f "$wheel_source" && test ! -L "$wheel_source"
          stage_dir="$(sudo mktemp -d /var/tmp/mempalace-installed-application.XXXXXX)"
          staged_script="$stage_dir/release_install_metadata_smoke.py"
          staged_wheel="$stage_dir/${wheel[0]##*/}"
          test "$(sudo stat -c %u "$stage_dir")" = 0
          test "$(sudo stat -c %a "$stage_dir")" = 700
          sudo chmod 0755 "$stage_dir"
          sudo install -o root -g root -m 0444 -- "$script_source" "$staged_script"
          sudo install -o root -g root -m 0444 -- "$wheel_source" "$staged_wheel"
          sudo chmod 0555 "$stage_dir"
          for staged_path in "$staged_script" "$staged_wheel"; do
            sudo test -f "$staged_path" && sudo test ! -L "$staged_path"
            test "$(sudo stat -c %u "$staged_path")" = 0
            test "$(sudo stat -c %a "$staged_path")" = 444
            sudo -u "$lifecycle_user" test -r "$staged_path"
          done
          cmp -s -- "$script_source" "$staged_script"
          cmp -s -- "$wheel_source" "$staged_wheel"
          sudo -u "$lifecycle_user" env -i \
            HOME="$lifecycle_home" \
            USER="$lifecycle_user" \
            LOGNAME="$lifecycle_user" \
            LANG=C.UTF-8 \
            PATH="$(dirname "$python_bin"):/usr/local/bin:/usr/bin:/bin" \
            XDG_RUNTIME_DIR="$lifecycle_runtime" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$lifecycle_runtime/bus" \
            MEMPALACE_RELEASE_SYSTEMD_USER=1 \
            setsid bash -c '
              set -euo pipefail
              umask 077
              exec 3>&2 2>"$6"
              trap '\''rc=$?; printf "pre-handshake command failed: status=%s line=%s command=%q\n" "$rc" "$LINENO" "$BASH_COMMAND" >&2; exit "$rc"'\'' ERR
              test ! -e "$1"
              test ! -e "$2"
              test ! -L "$2"
              trap '\''rm -f -- "$2"'\'' EXIT
              printf "%s %s %s %s\n" "$$" "$$" "$(id -u)" "$3" > "$2"
              test -f "$2" && test ! -L "$2"
              test "$(stat -c %u "$2")" = "$(id -u)"
              test "$(stat -c %a "$2")" = 600
              mv -- "$2" "$1"
              trap - EXIT
              trap - ERR
              exec 2>&3 3>&-
              exec "$3" "$4" --all-installers --install-spec "$5" --json
            ' bash "$smoke_identity" "$smoke_identity_tmp" "$python_bin" "$staged_script" "$staged_wheel" "$smoke_launcher_stderr" &
          smoke_launcher_pid=$!
          smoke_started_at=$SECONDS
          for _attempt in {1..40}; do
            sudo test -f "$smoke_identity" && break
            kill -0 "$smoke_launcher_pid" 2>/dev/null || break
            sleep 0.25
          done
          if ! sudo test -f "$smoke_identity" || sudo test -L "$smoke_identity"; then
            if wait "$smoke_launcher_pid"; then
              smoke_launcher_rc=0
            else
              smoke_launcher_rc=$?
            fi
            smoke_launcher_pid=""
            echo "launcher exited before identity publication: status=$smoke_launcher_rc" >&2
            if sudo test -f "$smoke_launcher_stderr" && sudo test ! -L "$smoke_launcher_stderr"; then
              if ! sudo head -c 4096 -- "$smoke_launcher_stderr" >&2; then
                echo "bounded launcher diagnostic could not be read" >&2
              fi
            fi
            if (( smoke_launcher_rc == 0 )); then
              exit 1
            fi
            exit "$smoke_launcher_rc"
          fi
          sudo test -f "$smoke_identity" && sudo test ! -L "$smoke_identity"
          smoke_extra=""
          read -r smoke_pid smoke_pgid smoke_uid smoke_command smoke_extra < <(sudo cat "$smoke_identity")
          test -n "$smoke_pid" && test -n "$smoke_pgid" && test -n "$smoke_uid" && test -n "$smoke_command"
          test -z "$smoke_extra"
          test "$smoke_pid" = "$smoke_pgid"
          test "$smoke_uid" = "$lifecycle_uid"
          test "$smoke_command" = "$python_bin"
          while kill -0 "$smoke_launcher_pid" 2>/dev/null; do
            if (( SECONDS - smoke_started_at >= 2400 )); then
              echo "installed-application smoke exceeded its 40-minute deadline; recovery: rerun the installed-application job" >&2
              exit 124
            fi
            sleep 1
          done
          if wait "$smoke_launcher_pid"; then
            smoke_launcher_rc=0
          else
            smoke_launcher_rc=$?
          fi
          exit "$smoke_launcher_rc"
      - name: Run full golden CLI suite through the exact installed wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          WHEEL="${wheel[0]}"
          python scripts/release_readiness_gate.py --installed-golden-wheel "$WHEEL" --json

  # Stable aggregate release-admission check. Its name is the branch-ruleset
  # required-check context, so it must never be renamed without updating
  # RELEASE_CRITICAL_CI_JOBS / AGGREGATE_REQUIRED_CHECK in
  # scripts/release_admission_checks.py and docs/release-admission-rulesets.md.
  # `if: always()` is required: without it a skipped or failed upstream job would
  # skip this job too, and a skipped required check never blocks a merge.
  release-required:
    name: release-required
    runs-on: ubuntu-latest
    needs:
      - dependency-upgrade-gate
      - gitleaks-changed-range
      - installed-application
      - lint
      - package
      - test
      - typecheck
    if: always()
    steps:
      - name: Require every release-critical CI job
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EXPECTED_JOBS: >-
            dependency-upgrade-gate gitleaks-changed-range installed-application
            lint package test typecheck
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = sorted(os.environ["EXPECTED_JOBS"].split())

          problems = []
          # A job absent from `needs` is as blocking as a failed one: it means the
          # dependency list drifted away from the release-critical job set.
          for name in expected:
              data = needs.get(name)
              if not isinstance(data, dict):
                  problems.append(f"{name}: missing from needs")
                  continue
              result = data.get("result")
              # success is the only admissible result; skipped, cancelled, failure,
              # and any unknown future value all fail closed.
              if result != "success":
                  problems.append(f"{name}: {result or 'unknown'}")
          for name in sorted(needs):
              if name not in expected:
                  problems.append(f"{name}: not in the release-critical job list")

          if problems:
              print("release-required: FAIL")
              for problem in problems:
                  print(f"  {problem}")
              sys.exit(1)
          print(f"release-required: all {len(expected)} release-critical jobs succeeded")
          PY

  model-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.model_tests == 'true'
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MEMPALACE_TEST_HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Restore HuggingFace model cache
        id: hf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/huggingface/mempalace-fastembed/all-MiniLM-L6-v2-v1
          key: fastembed-${{ runner.os }}-py3.13-minilm-${{ hashFiles('pyproject.toml', 'uv.lock') }} # zizmor: ignore[cache-poisoning]
          restore-keys: |
            fastembed-${{ runner.os }}-py3.13-minilm-
      - run: pip install -e ".[dev,treesitter]"
      - name: Fetch embedding model (no-op on cache hit)
        run: mempalace-code fetch-model
      - name: Run model-backed tests
        run: python -m pytest tests/ -v -m needs_network
