name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  current-audit:
    runs-on: ubuntu-latest
    # Keep full resolver installs without retaining duplicate download caches.
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install audit dependencies
        run: pip install pip-audit

      - name: Run current dependency audit
        id: audit
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          findmnt -T /tmp -n -o FSTYPE,SIZE,AVAIL
          findmnt -T "$RUNNER_TEMP" -n -o FSTYPE,SIZE,AVAIL
          python - <<'PYTEMP'
          import os
          import tempfile
          from pathlib import Path

          if Path(tempfile.gettempdir()).resolve() != Path(os.environ["RUNNER_TEMP"]).resolve():
              raise SystemExit("Audit temporary directory must use runner storage")
          print("Audit temporary directory uses runner storage")
          PYTEMP
          set +e
          python scripts/dependency_upgrade_gate.py current-audit \
            --out-dir dependency-audit-output
          rc=$?
          echo "audit_exit=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("dependency-audit-output/current-audit-report.json")
          status = json.loads(report.read_text())["status"]
          if status not in {"clean", "accepted_risk", "findings"}:
              raise SystemExit("Unknown audit status")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"audit_status={status}\n")
          PY
          status_rc=$?
          if [ "$status_rc" -ne 0 ]; then
            exit "$status_rc"
          fi
          exit $rc
        continue-on-error: true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-report
          path: dependency-audit-output/
          if-no-files-found: warn

      # One issue tracks the findings: it is matched by its exact title, updated
      # on every failing run, and closed by the first clean run below.
      - name: Create or update dependency-audit issue
        if: (steps.audit.outcome == 'failure' || steps.audit.outputs.audit_status == 'accepted_risk') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ISSUE_TITLE="[dependency-audit] current dependency audit findings"
          ISSUE_BODY_FILE="dependency-audit-output/current-audit-issue-body.md"
          ISSUE_LABEL="dependency-audit"

          if [ ! -f "$ISSUE_BODY_FILE" ]; then
            echo "No issue body file found; skipping issue creation." >&2
            exit 0
          fi

          # Search is fuzzy, so keep only the exact stable title.
          EXISTING=$(gh issue list \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty" \
            2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$ISSUE_BODY_FILE"
            echo "Updated existing issue #$EXISTING"
            gh issue edit "$EXISTING" --add-label "$ISSUE_LABEL" || \
              echo "::warning::Could not add the '$ISSUE_LABEL' label to issue #$EXISTING"
          elif ! gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file "$ISSUE_BODY_FILE" \
            --label "$ISSUE_LABEL"; then
            echo "::warning::Could not create the issue with the '$ISSUE_LABEL' label; creating it without the label"
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file "$ISSUE_BODY_FILE"
          fi

      # A clean run of main resolves the tracked findings, so it closes the open
      # issue with a link to the evidence. A clean dispatch from another branch
      # says nothing about main's lock and leaves the issue alone. Issue bookkeeping
      # must never turn a clean audit into a failed run: release admission reads
      # this workflow's conclusion.
      - name: Close resolved dependency-audit issue
        if: steps.audit.outcome == 'success' && steps.audit.outputs.audit_status == 'clean' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_TITLE="[dependency-audit] current dependency audit findings"
          OPEN_ISSUES=$(gh issue list \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[].number")

          for number in $OPEN_ISSUES; do
            gh issue close "$number" \
              --reason completed \
              --comment "Dependency Audit run $RUN_URL found no actionable findings; closing."
            echo "Closed resolved issue #$number"
          done

      - name: Fail workflow on audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Dependency audit found actionable findings. See uploaded artifact and issue."
          exit 1
