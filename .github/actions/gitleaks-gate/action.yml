name: Gitleaks gate setup
description: Install the checksum-locked Gitleaks CLI from tools/gitleaks.

runs:
  using: composite
  steps:
    - name: Install the pinned Gitleaks CLI from tools/gitleaks
      shell: bash
      env:
        # Install outside the checkout so the scan wrapper's --require-clean
        # contract is never weakened by the tool it depends on.
        GOBIN: ${{ runner.temp }}/gitleaks-bin
      # `go install` without an `@version` resolves the version from the tool
      # module's go.mod and verifies every module checksum against go.sum. GOFLAGS
      # stays at the default -mod=readonly, so a drifted go.mod/go.sum fails here
      # rather than silently installing something else. Upstream stamps its version
      # string at release time, so the same resolved version is linked in and then
      # asserted back — a binary that does not report the pinned version fails.
      run: |
        set -euo pipefail
        cd tools/gitleaks
        version="$(go list -m -f '{{.Version}}' github.com/zricethezav/gitleaks/v8)"
        go install \
          -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=${version}" \
          github.com/zricethezav/gitleaks/v8
        installed="$("${GOBIN}/gitleaks" version)"
        if [ "${installed}" != "${version}" ]; then
          echo "Gitleaks version drift: go.mod pins ${version}, binary reports ${installed}" >&2
          exit 1
        fi
        echo "Installed Gitleaks ${installed} from tools/gitleaks/go.mod"
    # The scan wrapper invokes `gitleaks` by name, so the install directory has to
    # reach later steps. The single value written is the literal path chosen above:
    # no repository, event, or user input reaches this line.
    - name: Put the pinned Gitleaks CLI on PATH
      shell: bash
      run: echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
